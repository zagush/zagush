<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAGUSH — PORTFOLIO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&display=swap" rel="stylesheet">
    <style>
        /* РЕЖИМ ЧЁТКОГО ПИКСЕЛЬ-АРТА */
        .pixel-crisp,
        .pixel-mode img,
        .lightbox-modal.pixel-mode .lightbox-img {
            image-rendering: pixelated !important;
            image-rendering: crisp-edges !important;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-text-stroke: 0 !important;
        }

        /* УБИРАЕМ ВТОРОЙ СКРОЛЛБАР СТРАНИЦЫ */
        html, body {
            height: 100vh;
            overflow: hidden; /* Запрещает внешний скролл на ПК */
        }

        body {
            background: #2b2118 url('stol.jpg') center center / cover fixed no-repeat;
            font-family: Arial, Helvetica, sans-serif;
            color: #1a1a1a;
            padding: 15px 15px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        /* Верхняя панель навигации */
        .top-bar {
            width: min(960px, 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
        }

        .back-desk-btn, .lang-btn {
            background: #ffffff;
            color: #000;
            font-family: 'Rubik Mono One', monospace, sans-serif;
            font-size: 11px;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 3px 5px 12px rgba(0, 0, 0, 0.35);
            transition: transform 0.15s ease, background 0.15s ease;
            user-select: none;
        }

        .back-desk-btn:hover, .lang-btn:hover {
            transform: translateY(-2px);
            background: #f0f0f0;
        }

        /* Хлебные крошки */
        .breadcrumbs {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Rubik Mono One', monospace, sans-serif;
            font-size: clamp(10px, 1.2vw, 12px);
            background: rgba(255, 255, 255, 0.92);
            padding: 8px 14px;
            border-radius: 6px;
            box-shadow: 2px 4px 10px rgba(0, 0, 0, 0.25);
            flex-wrap: wrap;
        }

        .crumb-link {
            color: #777;
            cursor: pointer;
            transition: color 0.15s ease;
        }
        .crumb-link:hover { color: #000; }
        .crumb-active { color: #000; }
        .crumb-sep { color: #aaa; }

        /* Лист скетчбука: идеально уложен в экран */
        .sketchbook-sheet {
            width: min(980px, 100%);
            flex: 1; /* Занимает всё свободное место без вылезания вниз */
            max-height: calc(100vh - 85px); /* Ровно по высоте экрана */
            background: transparent url('paper-pc.png') center top / 100% 100% no-repeat;
            border: none;
            border-radius: 0;
            box-shadow: none;
            filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.5));
            padding: clamp(30px, 4vw, 55px) clamp(25px, 4vw, 50px);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Обрезает контент, чтобы не вылезал */
        }

        /* Шапка листа: ВСЕГДА ВЫШЕ КАРТИНОК И НЕ СЖИМАЕТСЯ */
        .sheet-title-row {
            display: grid;
            grid-template-columns: 120px 1fr 120px;
            align-items: center;
            border-bottom: 2px dashed #d5cbba;
            padding-bottom: 12px;
            margin-bottom: 15px;
            position: relative;
            z-index: 500; /* ВЫШЕ КАРТИНОК */
            flex-shrink: 0; /* Никогда не сплющивается */
            user-select: none;
        }

        .sheet-title {
            grid-column: 2;
            text-align: center;
            font-family: 'Rubik Mono One', monospace, sans-serif;
            font-size: clamp(16px, 2.5vw, 22px);
            letter-spacing: 0;
            color: #171717;
            user-select: none;
        }

        /* КНОПКА «НАЗАД»: НАИВЫСШИЙ СЛОЙ, НАЖИМАЕТСЯ ВСЕГДА */
        .nav-back-step {
            grid-column: 1;
            justify-self: start;
            font-family: 'Rubik Mono One', monospace, sans-serif;
            font-size: 11px;
            background: #eee6d8 url('btn_back.png') center / 100% 100% no-repeat;
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            border: none;
            display: none;
            color: #000;
            position: relative;
            z-index: 1000 !important; /* НА САМОМ ВЕРХУ, ПЕРЕХВАТЫВАЕТ ВСЕ КЛИКИ */
            pointer-events: auto !important;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
            transition: transform 0.15s ease, filter 0.15s ease;
        }
        .nav-back-step:hover {
            transform: translateY(-2px);
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.22));
        }

        /* Зона картинок: СТРОГО НИЖЕ ШАПКИ, НЕ НАЛЕЗАЕТ НА КНОПКИ */
        #contentView {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
            z-index: 1;
            padding-right: 6px;
            padding-bottom: 20px;
        }

        #contentView::-webkit-scrollbar {
            width: 6px;
        }
        #contentView::-webkit-scrollbar-track {
            background: transparent;
        }
        #contentView::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }
        #contentView::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.35);
        }
        
        /* КНОПКА «НАЗАД» (Подготовлена под твой рисунок btn_back.png) */
        .nav-back-step {
            grid-column: 1;
            justify-self: start;
            font-family: 'Rubik Mono One', monospace, sans-serif;
            font-size: 11px;
            background: #eee6d8 url('btn_back.png') center / 100% 100% no-repeat;
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            border: none;
            display: none;
            color: #000;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
            transition: transform 0.15s ease, filter 0.15s ease;
        }
        .nav-back-step:hover {
            transform: translateY(-2px);
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.22));
        }

        /* Сетка папок: более компактная и аккуратная */
        .folders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 35px 20px;
            margin-top: 15px;
        }

        .folder-card {
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
            transition: transform 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        /* Размашистый веер из 4 картинок во всю ширину папки */
        .folder-previews {
            position: absolute;
            top: 0;
            width: 220px;
            height: 85px;
            pointer-events: none;
            z-index: 1;
            display: flex;
            justify-content: center;
        }

        /* Картинки стали крупнее (72px) с минимальной белой каймой */
        .preview-thumb {
            position: absolute;
            width: 72px;
            height: 72px;
            object-fit: cover;
            border-radius: 3px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.28);
            background: #e5ded2;
            border: 2px solid #fff;
            transition: transform 0.22s ease;
        }

        /* Размашистое распределение 4 картинок */
        .preview-thumb:nth-child(1) { left: 8px;   top: 10px; transform: rotate(-18deg); }
        .preview-thumb:nth-child(2) { left: 54px;  top: 2px;  transform: rotate(-6deg); }
        .preview-thumb:nth-child(3) { left: 102px; top: 2px;  transform: rotate(6deg); }
        .preview-thumb:nth-child(4) { left: 148px; top: 10px; transform: rotate(18deg); }

        .folder-card:hover .preview-thumb:nth-child(1) { transform: rotate(-22deg) translateY(-14px); }
        .folder-card:hover .preview-thumb:nth-child(2) { transform: rotate(-8deg)  translateY(-18px); }
        .folder-card:hover .preview-thumb:nth-child(3) { transform: rotate(8deg)   translateY(-18px); }
        .folder-card:hover .preview-thumb:nth-child(4) { transform: rotate(22deg)  translateY(-14px); }

        /* Компактный нарисованный кармашек */
        .folder-pocket {
            position: relative;
            z-index: 2;
            width: 100%;
            background-color: transparent !important;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            border: none;
            border-radius: 0;
            box-shadow: none;
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.16));
            padding: 18px 14px 14px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            transition: transform 0.15s ease, filter 0.15s ease;
        }

        .folder-card:hover .folder-pocket {
            transform: translateY(-3px);
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.25));
        }

        .folder-title {
            font-family: 'Rubik Mono One', monospace, sans-serif;
            font-size: 11px;
            color: #000;
            line-height: 1.3;
            letter-spacing: 0;
        }

        .folder-count-badge {
            align-self: flex-start;
            margin-top: 4px;
            background: rgba(0, 0, 0, 0.08);
            padding: 3px 6px;
            font-size: 9px;
            font-weight: 800;
            border-radius: 3px;
            color: #333;
        }

        /* Аккуратная белая рамочка холстов в галерее без лишних полей */
        .work-item {
            background: #ffffff;
            padding: 2px;
            border: 2px solid #ffffff;
            border-radius: 2px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            content-visibility: auto;
            contain-intrinsic-size: 110px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        /* ========================================================
           СЕТКА РАБОТ: 6 В РЯД + БЕЛАЯ РАМОЧКА ВОКРУГ КАРТИНОК
           ======================================================== */
        .works-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .work-item {
            background: #ffffff;
            padding: 4px;
            /* БЕЛАЯ РАМОЧКА ОБРАМЛЯЕТ ХОЛСТ: */
            border: 3px solid #ffffff;
            border-radius: 3px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.22);
            cursor: pointer;
            content-visibility: auto;
            contain-intrinsic-size: 110px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .work-item:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.32);
        }

        .work-item img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 1px;
            display: block;
            background: #ece6da;
            transform: translateZ(0);
        }

        @media (max-width: 880px) {
            .works-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 8px;
            }
        }

        @media (max-width: 550px) {
            .works-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 6px;
            }
        }

        .loading-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 0;
            font-family: 'Rubik Mono One', monospace, sans-serif;
            font-size: 12px;
            color: #777;
        }

        /* ========================================================
           ПРОСМОТРЩИК (LIGHTBOX PRO: ЧИСТЫЕ PNG, БЕЛАЯ РАМКА)
           ======================================================== */
        .lightbox-modal {
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(8, 7, 12, 0.94);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
        }

        .lightbox-modal.active { display: flex; }

        .lightbox-viewport {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            cursor: default;
        }

        .lightbox-viewport.is-zoomed { cursor: grab; }
        .lightbox-viewport.is-dragging { cursor: grabbing; }

        /* Белая рамка вокруг картины */
        .lightbox-img {
            max-width: 90vw;
            max-height: 82vh;
            object-fit: contain;
            border: 4px solid #ffffff; /* БЕЛАЯ РАМКА */
            border-radius: 2px;
            box-shadow: 0 14px 45px rgba(0, 0, 0, 0.9);
            transition: transform 0.1s ease-out;
            transform-origin: center center;
            pointer-events: auto;
        }

        .lightbox-modal.pixel-mode .lightbox-img {
            image-rendering: pixelated !important;
            image-rendering: crisp-edges !important;
            width: min(80vw, 75vh);
            height: min(80vw, 75vh);
            object-fit: contain;
            border: 4px solid #ffffff;
        }

        /* 1. КРЕСТИК ЗАКРЫТИЯ — ТЁМНО-КРАСНЫЙ (#990000) */
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 25px;
            z-index: 2010;
            background-color: transparent !important;
            background-image: url('btn_close.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            border: none !important;
            box-shadow: none !important;
            backdrop-filter: none !important;
            color: #990000 !important; /* ТЁМНО-КРАСНЫЙ КРЕСТИК */
            width: 48px;
            height: 48px;
            font-size: 26px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.45));
            transition: transform 0.15s ease;
        }
        .lightbox-close:hover {
            transform: scale(1.08);
        }

        /* 2. СЧЁТЧИК РАБОТ — ЦВЕТ СО СКРИНШОТА (#565071) */
        .lightbox-counter {
            position: absolute;
            top: 20px;
            left: 25px;
            z-index: 2010;
            font-family: 'Rubik Mono One', monospace, sans-serif;
            font-size: 11px;
            color: #565071 !important; /* ЦВЕТ СО СКРИНШОТА */
            background-color: transparent !important;
            background-image: url('badge_counter.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            border: none !important;
            box-shadow: none !important;
            backdrop-filter: none !important;
            padding: 10px 16px;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.45));
        }

        /* 3. СТРЕЛКИ ВПРАВО / ВЛЕВО — ЦВЕТ СО СКРИНШОТА (#565071) */
        .lightbox-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 2010;
            background-color: transparent !important;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            border: none !important;
            box-shadow: none !important;
            backdrop-filter: none !important;
            color: #565071 !important; /* ЦВЕТ СО СКРИНШОТА */
            width: 50px;
            height: 65px;
            font-size: 24px;
            font-family: 'Rubik Mono One', monospace, sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
            transition: transform 0.15s ease;
        }
        .lightbox-arrow:hover {
            transform: translateY(-50%) scale(1.08);
        }
        .lb-prev { 
            left: 20px; 
            background-image: url('btn_prev.png'); 
        }
        .lb-next { 
            right: 20px; 
            background-image: url('btn_next.png'); 
        }

        /* 4. ПАНЕЛЬ ЗУМА СНИЗУ: КНОПКИ И ПРОЦЕНТЫ — ЦВЕТ СО СКРИНШОТА (#565071) */
        .lightbox-toolbar {
            position: absolute;
            bottom: 22px;
            z-index: 2010;
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: transparent !important;
            background-image: url('bar_zoom.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            border: none !important;
            box-shadow: none !important;
            backdrop-filter: none !important;
            padding: 8px 14px;
            filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.5));
        }

        .lb-tool-btn {
            background: transparent !important;
            border: none !important;
            color: #565071 !important; /* ЦВЕТ СО СКРИНШОТА */
            width: 32px;
            height: 32px;
            font-size: 16px;
            font-family: 'Rubik Mono One', monospace, sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease;
        }
        .lb-tool-btn:hover { 
            transform: scale(1.15); 
        }

        .lb-reset-btn { font-size: 16px; }

        .lb-zoom-val {
            font-family: 'Rubik Mono One', monospace, sans-serif;
            font-size: 10px;
            color: #565071 !important; /* ЦВЕТ СО СКРИНШОТА */
            min-width: 50px;
            text-align: center;
        }

        /* 5. ПЛАШКА ИНФОРМАЦИИ: ЧЁРНЫЙ ТЕКСТ + ТЁМНО-КРАСНАЯ ЦЕНА (#990000) */
        .lightbox-info-badge {
            position: absolute;
            bottom: 22px;
            right: 25px;
            z-index: 2010;
            background-color: transparent !important;
            background-image: url('badge_info.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            border: none !important;
            box-shadow: none !important;
            border-radius: 0;
            padding: 12px 16px;
            filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.5));
            display: none; /* Скрыта везде, включается ТОЛЬКО в холстах */
            flex-direction: column;
            gap: 4px;
            pointer-events: none;
        }

        .lb-info-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-family: 'Rubik Mono One', monospace, sans-serif;
            font-size: 10px;
        }

        .lb-info-label {
            color: #000000 !important; /* ЧЁРНЫЙ ТЕКСТ */
            font-weight: 900;
        }

        .lb-info-val {
            color: #000000 !important; /* ЧЁРНЫЙ ТЕКСТ */
            font-weight: 800;
        }

        .lb-price-val {
            color: #990000 !important; /* СТРОГО ТЁМНО-КРАСНАЯ ЦЕНА */
            font-weight: 900;
        }

        @media (max-width: 600px) {
            .lightbox-arrow { width: 40px; height: 50px; font-size: 18px; }
            .lb-prev { left: 8px; }
            .lb-next { right: 8px; }
            .lightbox-toolbar { bottom: 15px; }
            .lightbox-info-badge {
                bottom: 75px;
                right: 15px;
                padding: 8px 12px;
            }
        }

        @media (max-width: 650px) {
            html, body {
                height: auto;
                overflow-y: auto; /* На телефоне разрешаем естественный скролл */
            }
            body {
                padding: 10px 10px 25px;
                height: auto;
                min-height: 100vh;
            }
            .sheet-title-row { grid-template-columns: 90px 1fr 90px; }
            .sketchbook-sheet {
                background: transparent url('paper-mobile.png') center top / 100% 100% no-repeat;
                height: 88vh;
                max-height: none;
                padding: 45px 16px 50px;
                border: none;
                width: 100%;
            }
            .folders-grid {
                grid-template-columns: 1fr;
                gap: 40px;
            }
            .works-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="index.html" class="back-desk-btn" id="toDeskBtn">← НА СТОЛ</a>

        <div class="breadcrumbs" id="breadcrumbs">
            <span class="crumb-active" id="rootCrumb">ПОРТФОЛИО</span>
        </div>

        <button class="lang-btn" id="langBtn" type="button">EN</button>
    </div>

    <main class="sketchbook-sheet">
        <div class="sheet-title-row">
            <button class="nav-back-step" id="navBackBtn" type="button">← НАЗАД</button>
            <h1 class="sheet-title" id="sectionTitle">ПОРТФОЛИО</h1>
            <div></div>
        </div>

        <div id="contentView"></div>
    </main>

    <!-- ПРОДВИНУТЫЙ ПРОСМОТРЩИК АРТА -->
    <div class="lightbox-modal" id="lightboxModal">
        <button class="lightbox-close" id="lightboxClose" title="Закрыть (Esc)">&times;</button>
        <div class="lightbox-counter" id="lightboxCounter">1 / 1</div>

        <button class="lightbox-arrow lb-prev" id="lightboxPrev" title="Предыдущая (←)">&#10094;</button>
        <button class="lightbox-arrow lb-next" id="lightboxNext" title="Следующая (→)">&#10095;</button>

        <div class="lightbox-viewport" id="lightboxViewport">
            <img src="" alt="" class="lightbox-img" id="lightboxImg" draggable="false">
        </div>

        <div class="lightbox-toolbar">
            <button class="lb-tool-btn" id="zoomOutBtn" title="Отдалить (−)">−</button>
            <span class="lb-zoom-val" id="zoomVal">100%</span>
            <button class="lb-tool-btn" id="zoomInBtn" title="Приблизить (+)">+</button>
            <button class="lb-tool-btn lb-reset-btn" id="zoomResetBtn" title="Сбросить (1:1)">⟲</button>
        </div>

        <!-- Плашка цены и размера (появляется только в Холстах) -->
        <div class="lightbox-info-badge" id="lightboxInfoBadge">
            <div class="lb-info-row">
                <span class="lb-info-label">РАЗМЕР:</span>
                <span class="lb-info-val" id="lbWorkSize">—</span>
            </div>
            <div class="lb-info-row">
                <span class="lb-info-label">ЦЕНА:</span>
                <span class="lb-info-val lb-price-val" id="lbWorkPrice">—</span>
            </div>
        </div>
    </div>

    <script>
        const GITHUB_REPO = "zagush/zagush";

        // ========================================================
        // СТРУКТУРА ПАПОК ПОД ТВОЙ РЕПОЗИТОРИЙ (ЧИСТАЯ, БЕЗ МУСОРА)
        // ========================================================
        const portfolioData = {
            id: "root",
            title: { ru: "ПОРТФОЛИО", en: "PORTFOLIO" },
            items: [
                // 1. ПИКСЕЛЬ-АРТ
                {
                    id: "pixel-art",
                    title: { ru: "ПИКСЕЛЬ-АРТ", en: "PIXEL ART" },
                    type: "category",
                    items: [
                        {
                            id: "pixel-chars",
                            title: { ru: "ПЕРСОНАЖИ", en: "CHARACTERS" },
                            type: "category",
                            items: [
                                {
                                    id: "pixel-peoples",
                                    title: { ru: "ЛЮДИ", en: "PEOPLES" },
                                    type: "category",
                                    items: [
                                        { id: "pixel-game1", title: { ru: "GAME 1", en: "GAME 1" }, folder: "portfolio/pixel-art/characters/peoples/game1", type: "gallery" },
                                        { id: "pixel-game2", title: { ru: "GAME 2", en: "GAME 2" }, folder: "portfolio/pixel-art/characters/peoples/game2", type: "gallery" },
                                        { id: "pixel-game3", title: { ru: "GAME 3", en: "GAME 3" }, folder: "portfolio/pixel-art/characters/peoples/game3", type: "gallery" },
                                        { id: "pixel-peoples-other", title: { ru: "ОСТАЛЬНОЕ", en: "OTHER" }, folder: "portfolio/pixel-art/characters/peoples/other", type: "gallery" }
                                    ]
                                },
                                { id: "pixel-chars-other", title: { ru: "ОСТАЛЬНОЕ", en: "OTHER" }, folder: "portfolio/pixel-art/characters/other", type: "gallery" }
                            ]
                        },
                        {
                            id: "pixel-full",
                            title: { ru: "ПОЛНОЦЕННЫЕ / ФОНЫ", en: "FULL ART & BG" },
                            folder: "portfolio/pixel-art/full-art",
                            type: "gallery"
                        },
                        {
                            id: "pixel-ui",
                            title: { ru: "UI / UX", en: "UI / UX" },
                            type: "category",
                            items: [
                                { id: "pixel-ui-dekor", title: { ru: "ДЕКОР", en: "DEKOR" }, folder: "portfolio/pixel-art/ui-ux/dekor", type: "gallery" },
                                { id: "pixel-ui-main", title: { ru: "ОСНОВНОЕ", en: "MAIN" }, folder: "portfolio/pixel-art/ui-ux", type: "gallery" }
                            ]
                        },
                        {
                            id: "pixel-stickers",
                            title: { ru: "СТИКЕРЫ", en: "STICKERS" },
                            type: "category",
                            items: [
                                { id: "st-tg1", title: { ru: "TG 1 PEEAS", en: "TG 1 PEEAS" }, folder: "portfolio/pixel-art/stickers/tg1 peeas", type: "gallery" },
                                { id: "st-tg2", title: { ru: "TG 2 PINK CAT", en: "TG 2 PINK CAT" }, folder: "portfolio/pixel-art/stickers/tg2 pink cat", type: "gallery" },
                                { id: "st-tg4", title: { ru: "TG 4 CAT", en: "TG 4 CAT" }, folder: "portfolio/pixel-art/stickers/tg4 cat", type: "gallery" }
                            ]
                        },
                        {
                            id: "pixel-other",
                            title: { ru: "ОСТАЛЬНОЕ", en: "OTHER" },
                            folder: "portfolio/pixel-art/other",
                            type: "gallery"
                        }
                    ]
                },

                // 2. ХОЛСТЫ
                {
                    id: "canvases",
                    title: { ru: "ХОЛСТЫ", en: "CANVASES" },
                    type: "category",
                    items: [
                        { id: "canvas-2026", title: { ru: "2026", en: "2026" }, folder: "portfolio/canvases/2026", type: "gallery" },
                        { id: "canvas-2025", title: { ru: "2025", en: "2025" }, folder: "portfolio/canvases/2025", type: "gallery" },
                        { id: "canvas-2024", title: { ru: "2024", en: "2024" }, folder: "portfolio/canvases/2024", type: "gallery" },
                        { id: "canvas-2023", title: { ru: "2023", en: "2023" }, folder: "portfolio/canvases/2023", type: "gallery" }
                    ]
                },

                // 3. МЕРЧ
                {
                    id: "merch",
                    title: { ru: "МЕРЧ", en: "MERCH" },
                    type: "category",
                    items: [
                        { id: "merch-pins", title: { ru: "ЗНАЧКИ", en: "PINS" }, folder: "portfolio/merch/pins", type: "gallery" },
                        { id: "merch-keychains", title: { ru: "БРЕЛОКИ", en: "KEYCHAINS" }, folder: "portfolio/merch/keychains", type: "gallery" },
                        { id: "merch-figures", title: { ru: "ФИГУРКИ", en: "FIGURINES" }, folder: "portfolio/merch/figures", type: "gallery" },
                        { id: "merch-stickers", title: { ru: "СТИКЕРЫ", en: "STICKERS" }, folder: "portfolio/merch/stickers", type: "gallery" },
                        { id: "merch-custom", title: { ru: "КАСТОМ", en: "CUSTOM" }, folder: "portfolio/merch/custom", type: "gallery" }
                    ]
                },

                // 4. ТРАДИШКА
                {
                    id: "traditional",
                    title: { ru: "ТРАДИШКА", en: "TRADITIONAL" },
                    folder: "portfolio/traditional",
                    type: "gallery"
                },

                // 5. ОСТАЛЬНОЕ
                {
                    id: "other",
                    title: { ru: "ОСТАЛЬНОЕ", en: "OTHER" },
                    type: "category",
                    items: [
                        { id: "other-tags", title: { ru: "ТЕГИ", en: "TAGS" }, folder: "portfolio/other/tags", type: "gallery" },
                        { id: "other-misc", title: { ru: "РАЗНОЕ", en: "MISC" }, folder: "portfolio/other/misc", type: "gallery" }
                    ]
                }
            ]
        };
        // Чтение папок GitHub API
        async function fetchImagesFromFolder(folderPath) {
            if (!folderPath) return [];

            const cacheKey = "zagush_cache_" + folderPath;
            try {
                const cached = sessionStorage.getItem(cacheKey);
                if (cached) return JSON.parse(cached);
            } catch(e) {}

            try {
                const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${encodeURI(folderPath)}`);
                if (!res.ok) return [];

                const files = await res.json();
                if (!Array.isArray(files)) return [];

                const imageExtensions = /\.(png|jpe?g|webp|gif)$/i;
                const images = files
                    .filter(f => f.type === "file" && imageExtensions.test(f.name))
                    .map(f => {
                        const rawName = f.name.replace(imageExtensions, "");

                        let size = "—";
                        const sizeMatch = rawName.match(/(\d{2,3})[xхXХ*](\d{2,3})/i);
                        if (sizeMatch) {
                            size = `${sizeMatch[1]}×${sizeMatch[2]} см`;
                        }

                        let price = "—";
                        const priceMatch = rawName.match(/(?:_|-)(\d{3,7})(?:rub|r|руб|р)/i);
                        if (priceMatch) {
                            const num = parseInt(priceMatch[1], 10);
                            price = num.toLocaleString("ru-RU") + " ₽";
                        }

                        return {
                            img: f.download_url || f.path,
                            size: size,
                            price: price
                        };
                    });

                if (images.length > 0) {
                    try {
                        sessionStorage.setItem(cacheKey, JSON.stringify(images));
                    } catch(e) {}
                }

                return images;
            } catch (err) {
                console.warn("GitHub API folder fetch:", err);
                return [];
            }
        }

        function findTargetFolder(item) {
            if (item.folder) return item.folder;
            if (item.items && item.items.length > 0) {
                for (let sub of item.items) {
                    const found = findTargetFolder(sub);
                    if (found) return found;
                }
            }
            return null;
        }

        let navStack = [portfolioData];
        let currentLang = localStorage.getItem("user_lang") || "ru";

        const contentView = document.getElementById("contentView");
        const sectionTitle = document.getElementById("sectionTitle");
        const breadcrumbs = document.getElementById("breadcrumbs");
        const navBackBtn = document.getElementById("navBackBtn");
        const langBtn = document.getElementById("langBtn");
        const toDeskBtn = document.getElementById("toDeskBtn");

        const lightboxModal = document.getElementById("lightboxModal");
        const lightboxImg = document.getElementById("lightboxImg");

        function pushNav(item) {
            navStack.push(item);
            history.pushState({ depth: navStack.length }, "");
            renderCurrentView();
        }

        window.addEventListener("popstate", () => {
            if (navStack.length > 1) {
                navStack.pop();
                renderCurrentView();
            }
        });

        function updateLangUI() {
            document.documentElement.lang = currentLang;
            langBtn.textContent = currentLang === "ru" ? "EN" : "RU";
            toDeskBtn.textContent = currentLang === "ru" ? "← НА СТОЛ" : "← TO DESK";
            navBackBtn.textContent = currentLang === "ru" ? "← НАЗАД" : "← BACK";
            renderCurrentView();
        }

        langBtn.addEventListener("click", () => {
            currentLang = currentLang === "ru" ? "en" : "ru";
            try { localStorage.setItem("user_lang", currentLang); } catch (e) {}
            updateLangUI();
        });

        function renderBreadcrumbs() {
            breadcrumbs.innerHTML = "";
            navStack.forEach((node, index) => {
                if (index > 0) {
                    const sep = document.createElement("span");
                    sep.className = "crumb-sep";
                    sep.textContent = ">";
                    breadcrumbs.appendChild(sep);
                }

                const span = document.createElement("span");
                const isLast = index === navStack.length - 1;
                span.className = isLast ? "crumb-active" : "crumb-link";
                span.textContent = node.title[currentLang];

                if (!isLast) {
                    span.addEventListener("click", () => {
                        navStack = navStack.slice(0, index + 1);
                        history.pushState({ depth: navStack.length }, "");
                        renderCurrentView();
                    });
                }
                breadcrumbs.appendChild(span);
            });
        }

        async function renderCurrentView() {
            const current = navStack[navStack.length - 1];
            sectionTitle.textContent = current.title[currentLang];
            navBackBtn.style.display = navStack.length > 1 ? "block" : "none";
            renderBreadcrumbs();
            contentView.innerHTML = "";

            // Ветка категорий
            if (current.type === "category" || current.id === "root") {
                const grid = document.createElement("div");
                grid.className = "folders-grid";

                current.items.forEach((item, index) => {
                    const card = document.createElement("div");
                    card.className = "folder-card";

                    const previewsWrap = document.createElement("div");
                    previewsWrap.className = "folder-previews";

                    const targetFolder = findTargetFolder(item);
                    if (targetFolder) {
                        fetchImagesFromFolder(targetFolder).then(realImages => {
                            if (realImages && realImages.length > 0) {
                                previewsWrap.innerHTML = "";
                                realImages.slice(0, 4).forEach(work => {
                                    const img = document.createElement("img");
                                    img.className = "preview-thumb";
                                    img.loading = "lazy";
                                    img.src = work.img;
                                    previewsWrap.appendChild(img);
                                });
                            }
                        });
                    }

                    // Случайный выбор одной из 6 нарисованных плашек (pocket_1 ... pocket_6)
                    const pocketNum = (index % 6) + 1;

                    const pocket = document.createElement("div");
                    pocket.className = "folder-pocket";
                    pocket.style.backgroundImage = `url('pocket_${pocketNum}.png')`;

                    pocket.innerHTML = `
                        <div class="folder-title">${item.title[currentLang]}</div>
                        <div class="folder-count-badge">
                            ${item.items ? (item.items.length + (currentLang === 'ru' ? ' разделов' : ' sections')) : (currentLang === 'ru' ? 'галерея' : 'gallery')}
                        </div>
                    `;

                    card.appendChild(previewsWrap);
                    card.appendChild(pocket);

                    card.addEventListener("click", () => {
                        pushNav(item);
                    });

                    grid.appendChild(card);
                });

                contentView.appendChild(grid);
            } 
            // Ветка галереи работ
            else if (current.type === "gallery") {
                const grid = document.createElement("div");
                grid.className = "works-grid";

                const isPixelCategory = navStack.some(node => node.id && node.id.includes("pixel"));
                if (isPixelCategory) {
                    grid.classList.add("pixel-mode");
                }

                grid.innerHTML = `<div class="loading-state">${currentLang === 'ru' ? 'ЗАГРУЗКА РАБОТ...' : 'LOADING ARTWORKS...'}</div>`;
                contentView.appendChild(grid);

                const works = await fetchImagesFromFolder(current.folder);
                grid.innerHTML = "";

                if (works.length === 0) {
                    grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #888; font-weight: 700; padding: 40px 0;">
                        ${currentLang === 'ru' ? 'Работы пока загружаются на GitHub...' : 'Artworks coming soon...'}
                    </div>`;
                } else {
                    works.forEach((work, idx) => {
                        const item = document.createElement("div");
                        item.className = "work-item";
                        item.innerHTML = `
                            <img src="${work.img}" alt="" loading="lazy" decoding="async">
                        `;
                        item.addEventListener("click", () => {
                            openLightbox(works, idx);
                        });
                        grid.appendChild(item);
                    });
                }
            }
        }

        navBackBtn.addEventListener("click", () => {
            if (navStack.length > 1) {
                history.back();
            }
        });

        // ========================================================
        // ЛОГИКА ПРОСМОТРЩИКА: ЗУМ, ПЕРЕТАСКИВАНИЕ И ЛИСТАНИЕ
        // ========================================================
        let currentGalleryWorks = [];
        let currentWorkIdx = 0;
        let zoomLevel = 1;
        let panX = 0, panY = 0;
        let isDragging = false;
        let startDragX = 0, startDragY = 0;

        const lightboxViewport = document.getElementById("lightboxViewport");
        const lightboxCounter = document.getElementById("lightboxCounter");
        const lightboxPrev = document.getElementById("lightboxPrev");
        const lightboxNext = document.getElementById("lightboxNext");
        const zoomVal = document.getElementById("zoomVal");
        const zoomInBtn = document.getElementById("zoomInBtn");
        const zoomOutBtn = document.getElementById("zoomOutBtn");
        const zoomResetBtn = document.getElementById("zoomResetBtn");
        const lightboxClose = document.getElementById("lightboxClose");

        function updateTransform() {
            lightboxImg.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomLevel})`;
            zoomVal.textContent = Math.round(zoomLevel * 100) + '%';
            
            if (zoomLevel > 1) {
                lightboxViewport.classList.add("is-zoomed");
            } else {
                lightboxViewport.classList.remove("is-zoomed");
            }
        }

        function resetZoom() {
            zoomLevel = 1;
            panX = 0;
            panY = 0;
            updateTransform();
        }

        function setZoom(newLevel) {
            zoomLevel = Math.min(Math.max(newLevel, 1), 6);
            if (zoomLevel === 1) {
                panX = 0;
                panY = 0;
            }
            updateTransform();
        }

        function showImageAt(idx) {
            if (currentGalleryWorks.length === 0) return;
            currentWorkIdx = (idx + currentGalleryWorks.length) % currentGalleryWorks.length;
            const work = currentGalleryWorks[currentWorkIdx];

            resetZoom();
            lightboxImg.src = work.img;
            lightboxCounter.textContent = `${currentWorkIdx + 1} / ${currentGalleryWorks.length}`;

            // ПЛАШКА ЦЕНЫ И РАЗМЕРА: ВКЛЮЧАЕТСЯ ТОЛЬКО ДЛЯ ХОЛСТОВ
            const isCanvas = navStack.some(node => node.id && node.id.includes("canvas"));
            const infoBadge = document.getElementById("lightboxInfoBadge");
            if (infoBadge) {
                if (isCanvas) {
                    infoBadge.style.display = "flex";
                    const lbWorkSize = document.getElementById("lbWorkSize");
                    const lbWorkPrice = document.getElementById("lbWorkPrice");
                    if (lbWorkSize) lbWorkSize.textContent = work.size || "—";
                    if (lbWorkPrice) lbWorkPrice.textContent = work.price || "—";
                } else {
                    infoBadge.style.display = "none";
                }
            }

            // Пиксель-арт авто-определение
            const isPixel = navStack.some(node => node.id && node.id.includes("pixel"));
            if (isPixel) {
                lightboxModal.classList.add("pixel-mode");
            } else {
                lightboxModal.classList.remove("pixel-mode");
            }

            lightboxImg.onload = () => {
                if (lightboxImg.naturalWidth <= 320) {
                    lightboxModal.classList.add("pixel-mode");
                }
            };
        }

        function openLightbox(works, index) {
            currentGalleryWorks = works;
            showImageAt(index);
            lightboxModal.classList.add("active");
        }

        function closeLightbox() {
            lightboxModal.classList.remove("active");
            resetZoom();
        }

        lightboxPrev.addEventListener("click", (e) => { e.stopPropagation(); showImageAt(currentWorkIdx - 1); });
        lightboxNext.addEventListener("click", (e) => { e.stopPropagation(); showImageAt(currentWorkIdx + 1); });

        zoomInBtn.addEventListener("click", (e) => { e.stopPropagation(); setZoom(zoomLevel + 0.4); });
        zoomOutBtn.addEventListener("click", (e) => { e.stopPropagation(); setZoom(zoomLevel - 0.4); });
        zoomResetBtn.addEventListener("click", (e) => { e.stopPropagation(); resetZoom(); });

        lightboxViewport.addEventListener("wheel", (e) => {
            e.preventDefault();
            const delta = e.deltaY < 0 ? 0.25 : -0.25;
            setZoom(zoomLevel + delta);
        }, { passive: false });

        lightboxViewport.addEventListener("pointerdown", (e) => {
            if (zoomLevel <= 1) return;
            isDragging = true;
            startDragX = e.clientX - panX;
            startDragY = e.clientY - panY;
            lightboxViewport.classList.add("is-dragging");
            lightboxViewport.setPointerCapture(e.pointerId);
        });

        lightboxViewport.addEventListener("pointermove", (e) => {
            if (!isDragging) return;
            panX = e.clientX - startDragX;
            panY = e.clientY - startDragY;
            updateTransform();
        });

        function endDrag(e) {
            if (!isDragging) return;
            isDragging = false;
            lightboxViewport.classList.remove("is-dragging");
            try { lightboxViewport.releasePointerCapture(e.pointerId); } catch(err) {}
        }
        lightboxViewport.addEventListener("pointerup", endDrag);
        lightboxViewport.addEventListener("pointercancel", endDrag);

        document.addEventListener("keydown", (e) => {
            if (!lightboxModal.classList.contains("active")) return;
            if (e.key === "Escape") closeLightbox();
            if (e.key === "ArrowLeft") showImageAt(currentWorkIdx - 1);
            if (e.key === "ArrowRight") showImageAt(currentWorkIdx + 1);
            if (e.key === "+" || e.key === "=") setZoom(zoomLevel + 0.3);
            if (e.key === "-") setZoom(zoomLevel - 0.3);
            if (e.key === "0") resetZoom();
        });

        lightboxClose.addEventListener("click", closeLightbox);
        lightboxViewport.addEventListener("click", (e) => {
            if (e.target === lightboxViewport && zoomLevel === 1) closeLightbox();
        });

        history.replaceState({ depth: 1 }, "");
        updateLangUI();
    </script>
