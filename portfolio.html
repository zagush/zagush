<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAGUSH — PORTFOLIO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&display=swap" rel="stylesheet">
    <style>
        /* РЕЖИМ ЧЁТКОГО ПИКСЕЛЬ-АРТА БЕЗ РАЗМЫТИЯ */
.pixel-crisp,
.pixel-mode img,
.lightbox-modal.pixel-mode .lightbox-img {
    image-rendering: pixelated !important;
    image-rendering: crisp-edges !important;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #2b2118 url('stol.jpg') center center / cover fixed no-repeat;
            font-family: Arial, Helvetica, sans-serif;
            color: #1a1a1a;
            padding: 20px 15px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Верхняя панель навигации */
        .top-bar {
            width: min(960px, 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
        }

        .back-desk-btn, .lang-btn {
            background: #ffffff;
            color: #000;
            font-family: 'Rubik Mono One', monospace, sans-serif;
            font-size: 11px;
            padding: 10px 16px;
            border: none;
            border-radius: 4px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 3px 5px 12px rgba(0, 0, 0, 0.35);
            transition: transform 0.15s ease, background 0.15s ease;
            user-select: none;
        }

        .back-desk-btn:hover, .lang-btn:hover {
            transform: translateY(-2px);
            background: #f0f0f0;
        }

        /* Хлебные крошки */
        .breadcrumbs {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Rubik Mono One', monospace, sans-serif;
            font-size: clamp(10px, 1.2vw, 12px);
            background: rgba(255, 255, 255, 0.92);
            padding: 8px 14px;
            border-radius: 4px;
            box-shadow: 2px 4px 10px rgba(0, 0, 0, 0.25);
            flex-wrap: wrap;
        }

        .crumb-link {
            color: #777;
            cursor: pointer;
            transition: color 0.15s ease;
        }
        .crumb-link:hover { color: #000; }
        .crumb-active { color: #000; }
        .crumb-sep { color: #aaa; }

        /* Лист скетчбука */
        .sketchbook-sheet {
            width: min(960px, 100%);
            min-height: 82vh;
            background: #fbf8f1 url('paper.png') center center / cover no-repeat;
            box-shadow: 0 14px 35px rgba(0, 0, 0, 0.45), 0 2px 8px rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            padding: clamp(20px, 4vw, 40px);
            position: relative;
            border-left: 12px solid #eae2d3;
        }

        /* Заголовок строго посередине, назад слева */
        .sheet-title-row {
            display: grid;
            grid-template-columns: 110px 1fr 110px;
            align-items: center;
            border-bottom: 2px dashed #d5cbba;
            padding-bottom: 14px;
            margin-bottom: 30px;
        }

        .sheet-title {
            grid-column: 2;
            text-align: center;
            font-family: 'Rubik Mono One', monospace, sans-serif;
            font-size: clamp(16px, 2.8vw, 26px);
            letter-spacing: -0.02em;
            color: #171717;
        }

        .nav-back-step {
            grid-column: 1;
            justify-self: start;
            font-family: 'Rubik Mono One', monospace, sans-serif;
            font-size: 11px;
            background: #eee6d8;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            border: none;
            display: none;
            transition: background 0.15s ease;
        }
        .nav-back-step:hover { background: #e0d4bf; }

        /* Сетка папок */
        .folders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 50px 25px;
            margin-top: 25px;
        }

        .folder-card {
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 55px;
            transition: transform 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        /* Веер миниатюр */
        .folder-previews {
            position: absolute;
            top: 0;
            width: 240px;
            height: 95px;
            pointer-events: none;
            z-index: 1;
            display: flex;
            justify-content: center;
        }

        .preview-thumb {
            position: absolute;
            width: 68px;
            height: 68px;
            object-fit: cover;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
            background: #e5ded2;
            border: 2px solid #fff;
            transition: transform 0.25s ease;
        }

        .preview-thumb:nth-child(1) { left: 10px;  top: 14px; transform: rotate(-22deg); }
        .preview-thumb:nth-child(2) { left: 35px;  top: 8px;  transform: rotate(-15deg); }
        .preview-thumb:nth-child(3) { left: 60px;  top: 3px;  transform: rotate(-8deg); }
        .preview-thumb:nth-child(4) { left: 85px;  top: 0px;  transform: rotate(0deg); }
        .preview-thumb:nth-child(5) { left: 110px; top: 3px;  transform: rotate(8deg); }
        .preview-thumb:nth-child(6) { left: 135px; top: 8px;  transform: rotate(15deg); }
        .preview-thumb:nth-child(7) { left: 160px; top: 14px; transform: rotate(22deg); }

        .folder-card:hover .preview-thumb:nth-child(1) { transform: rotate(-26deg) translateY(-14px); }
        .folder-card:hover .preview-thumb:nth-child(2) { transform: rotate(-18deg) translateY(-18px); }
        .folder-card:hover .preview-thumb:nth-child(3) { transform: rotate(-10deg) translateY(-22px); }
        .folder-card:hover .preview-thumb:nth-child(4) { transform: rotate(0deg)   translateY(-24px); }
        .folder-card:hover .preview-thumb:nth-child(5) { transform: rotate(10deg)  translateY(-22px); }
        .folder-card:hover .preview-thumb:nth-child(6) { transform: rotate(18deg)  translateY(-18px); }
        .folder-card:hover .preview-thumb:nth-child(7) { transform: rotate(26deg)  translateY(-14px); }

        .folder-pocket {
            position: relative;
            z-index: 2;
            width: 100%;
            background: #ffffff;
            border-radius: 4px;
            padding: 22px 16px 16px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
            border-top: 4px solid #1a1a1a;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: box-shadow 0.2s ease, background 0.2s ease;
        }

        .folder-card:hover .folder-pocket {
            background: #fafafa;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
        }

        .folder-title {
            font-family: 'Rubik Mono One', monospace, sans-serif;
            font-size: 13px;
            color: #000;
            line-height: 1.3;
        }

        .folder-desc {
            font-size: 11px;
            font-weight: 700;
            color: #666;
            line-height: 1.4;
        }

        .folder-count-badge {
            align-self: flex-start;
            margin-top: 8px;
            background: #eee8dc;
            padding: 3px 7px;
            font-size: 10px;
            font-weight: 800;
            border-radius: 3px;
            color: #444;
        }

/* ========================================================
           СЕТКА РАБОТ: РОВНО ПО 6 ШТУК В РЯД + МАКСИМАЛЬНАЯ ОПТИМИЗАЦИЯ
           ======================================================== */
        .works-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr); /* РОВНО 6 В РЯД */
            gap: 10px;
            margin-top: 20px;
        }

        .work-item {
            background: #fff;
            padding: 4px 4px 6px;
            border-radius: 3px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            /* Снимает 80% нагрузки с процессора */
            content-visibility: auto;
            contain-intrinsic-size: 110px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .work-item:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.2);
        }

        .work-item img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 2px;
            display: block;
            background: #ece6da;
            transform: translateZ(0); /* Включает видеокарту для плавности */
        }

        .work-caption {
            margin-top: 4px;
            font-size: 9px;
            font-weight: 800;
            color: #222;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: center;
        }

        /* Адаптивность для меньших экранов */
        @media (max-width: 880px) {
            .works-grid {
                grid-template-columns: repeat(4, 1fr); /* 4 в ряд на планшетах */
                gap: 8px;
            }
        }

        @media (max-width: 550px) {
            .works-grid {
                grid-template-columns: repeat(3, 1fr); /* 3 в ряд на телефонах */
                gap: 6px;
            }
        }

        /* Загрузка */
        .loading-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 0;
            font-family: 'Rubik Mono One', monospace, sans-serif;
            font-size: 12px;
            color: #777;
        }

        /* ПРОСМОТРЩИК С ЗУМОМ И СТРЕЛКАМИ */
        .lightbox-modal {
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(8, 7, 12, 0.94);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
        }

        .lightbox-modal.active { display: flex; }

        .lightbox-viewport {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            cursor: default;
        }

        .lightbox-viewport.is-zoomed { cursor: grab; }
        .lightbox-viewport.is-dragging { cursor: grabbing; }

        .lightbox-img {
            max-width: 90vw;
            max-height: 82vh;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.85);
            transition: transform 0.1s ease-out;
            transform-origin: center center;
            pointer-events: auto;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 25px;
            z-index: 2010;
            background: rgba(255, 255, 255, 0.12);
            border: none;
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 26px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s ease, transform 0.15s ease;
        }
        .lightbox-close:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.1);
        }

        .lightbox-counter {
            position: absolute;
            top: 25px;
            left: 25px;
            z-index: 2010;
            font-family: 'Rubik Mono One', monospace, sans-serif;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 12px;
            border-radius: 20px;
        }

        .lightbox-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 2010;
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            border: none;
            width: 52px;
            height: 60px;
            border-radius: 6px;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s ease, transform 0.15s ease;
        }
        .lightbox-arrow:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-50%) scale(1.08);
        }
        .lb-prev { left: 20px; }
        .lb-next { right: 20px; }

        .lightbox-toolbar {
            position: absolute;
            bottom: 22px;
            z-index: 2010;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(22, 20, 28, 0.75);
            backdrop-filter: blur(8px);
            padding: 6px 12px;
            border-radius: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .lb-tool-btn {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s ease;
        }
        .lb-tool-btn:hover { background: rgba(255, 255, 255, 0.35); }
        .lb-reset-btn { font-size: 18px; }

        .lb-zoom-val {
            font-family: 'Rubik Mono One', monospace, sans-serif;
            font-size: 11px;
            color: #fff;
            min-width: 52px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .lightbox-arrow { width: 40px; height: 48px; font-size: 18px; }
            .lb-prev { left: 8px; }
            .lb-next { right: 8px; }
            .lightbox-toolbar { bottom: 15px; }
        }

        @media (max-width: 650px) {
            .sheet-title-row { grid-template-columns: 80px 1fr 80px; }
            .sketchbook-sheet {
                padding: 16px 10px;
                border-left-width: 6px;
            }
            .folders-grid {
                grid-template-columns: 1fr;
                gap: 40px;
            }
            .works-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="index.html" class="back-desk-btn" id="toDeskBtn">← НА СТОЛ</a>

        <div class="breadcrumbs" id="breadcrumbs">
            <span class="crumb-active" id="rootCrumb">ПОРТФОЛИО</span>
        </div>

        <button class="lang-btn" id="langBtn" type="button">EN</button>
    </div>

    <main class="sketchbook-sheet">
        <div class="sheet-title-row">
            <button class="nav-back-step" id="navBackBtn" type="button">← НАЗАД</button>
            <h1 class="sheet-title" id="sectionTitle">ПОРТФОЛИО</h1>
            <div></div>
        </div>

        <div id="contentView"></div>
    </main>

    <!-- ПРОДВИНУТЫЙ ПРОСМОТРЩИК АРТА -->
    <div class="lightbox-modal" id="lightboxModal">
        <button class="lightbox-close" id="lightboxClose" title="Закрыть (Esc)">&times;</button>
        <div class="lightbox-counter" id="lightboxCounter">1 / 1</div>

        <button class="lightbox-arrow lb-prev" id="lightboxPrev" title="Предыдущая (←)">&#10094;</button>
        <button class="lightbox-arrow lb-next" id="lightboxNext" title="Следующая (→)">&#10095;</button>

        <div class="lightbox-viewport" id="lightboxViewport">
            <img src="" alt="" class="lightbox-img" id="lightboxImg" draggable="false">
        </div>

        <div class="lightbox-toolbar">
            <button class="lb-tool-btn" id="zoomOutBtn" title="Отдалить (−)">−</button>
            <span class="lb-zoom-val" id="zoomVal">100%</span>
            <button class="lb-tool-btn" id="zoomInBtn" title="Приблизить (+)">+</button>
            <button class="lb-tool-btn lb-reset-btn" id="zoomResetBtn" title="Сбросить (1:1)">⟲</button>
        </div>
    </div>

    <script>
        // Имя репозитория Zagush на GitHub
        const GITHUB_REPO = "zagush/zagush";

        // Стандартные картинки для превью папок, если папка пуста
        const defaultFan = [
            "phone.png", "contact.png", "draw.png", "sketchbook1.png",
            "face3.png", "face4.png", "face.png"
        ];

        // ========================================================
        // КАРТА ПАПОК (Пути точно соответствуют твоим папкам)
        // ========================================================
        const portfolioData = {
            id: "root",
            title: { ru: "ПОРТФОЛИО", en: "PORTFOLIO" },
            items: [
                // 1. ПИКСЕЛЬ-АРТ
                {
                    id: "pixel-art",
                    title: { ru: "ПИКСЕЛЬ-АРТ", en: "PIXEL ART" },
                    type: "category",
                    items: [
                        { id: "pixel-chars", title: { ru: "ПЕРСОНАЖИ", en: "CHARACTERS" }, folder: "portfolio/pixel-art/characters", type: "gallery" },
                        { id: "pixel-full", title: { ru: "ПОЛНОЦЕННЫЕ / ФОНЫ", en: "FULL ART & BG" }, folder: "portfolio/pixel-art/full-art", type: "gallery" },
                        { id: "pixel-ui", title: { ru: "UI / UX", en: "UI / UX" }, folder: "portfolio/pixel-art/ui-ux", type: "gallery" },
                        { id: "pixel-stickers", title: { ru: "СТИКЕРЫ", en: "STICKERS" }, folder: "portfolio/pixel-art/stickers", type: "gallery" },
                        { id: "pixel-other", title: { ru: "ОСТАЛЬНОЕ", en: "OTHER" }, folder: "portfolio/pixel-art/other", type: "gallery" }
                    ]
                },

                // 2. ХОЛСТЫ
                {
                    id: "canvases",
                    title: { ru: "ХОЛСТЫ", en: "CANVASES" },
                    desc: { ru: "Акрил, масло, аэрозольная краска", en: "Acrylic, oil, spray paint" },
                    type: "category",
                    items: [
                        { id: "canvas-2026", title: { ru: "2026", en: "2026" }, folder: "portfolio/canvases/2026", type: "gallery" },
                        { id: "canvas-2025", title: { ru: "2025", en: "2025" }, folder: "portfolio/canvases/2025", type: "gallery" },
                        { id: "canvas-2024", title: { ru: "2024", en: "2024" }, folder: "portfolio/canvases/2024", type: "gallery" },
                        { id: "canvas-2023", title: { ru: "2023", en: "2023" }, folder: "portfolio/canvases/2023", type: "gallery" }
                    ]
                },

               // 3. МЕРЧ
                {
                    id: "merch",
                    title: { ru: "МЕРЧ", en: "MERCH" },
                    desc: { ru: "Значки, брелоки, фигурки, стикеры, кастом", en: "Pins, keychains, figurines, stickers, custom" },
                    type: "category",
                    items: [
                        { id: "merch-pins", title: { ru: "ЗНАЧКИ", en: "PINS" }, folder: "portfolio/merch/pins", type: "gallery" },
                        { id: "merch-keychains", title: { ru: "БРЕЛОКИ", en: "KEYCHAINS" }, folder: "portfolio/merch/keychains", type: "gallery" },
                        { id: "merch-figures", title: { ru: "ФИГУРКИ", en: "FIGURINES" }, folder: "portfolio/merch/figures", type: "gallery" },
                        { id: "merch-stickers", title: { ru: "СТИКЕРЫ", en: "STICKERS" }, folder: "portfolio/merch/stickers", type: "gallery" },
                        { id: "merch-custom", title: { ru: "КАСТОМ", en: "CUSTOM" }, folder: "portfolio/merch/custom", type: "gallery" } // <-- НОВАЯ ПОДПАПКА
                    ]
                },
                
                // 4. ТРАДИШКА
                {
                    id: "traditional",
                    title: { ru: "ТРАДИШКА", en: "TRADITIONAL" },
                    desc: { ru: "Разное", en: "Miscellaneous" },
                    folder: "portfolio/traditional",
                    type: "gallery"
                },

                // 5. ОСТАЛЬНОЕ
                {
                    id: "other",
                    title: { ru: "ОСТАЛЬНОЕ", en: "OTHER" },
                    desc: { ru: "Остальное", en: "Other" },
                    type: "category",
                    items: [
                        { id: "other-tags", title: { ru: "ТЕГИ", en: "TAGS" }, desc: { ru: "Граффити, теги, маркеры", en: "Graffiti, tags, markers" }, folder: "portfolio/other/tags", type: "gallery" },
                        { id: "other-misc", title: { ru: "РАЗНОЕ", en: "MISC" }, folder: "portfolio/other/misc", type: "gallery" }
                    ]
                }
            ]
        };

        // ========================================================
        // АВТОМАТИЧЕСКОЕ ЧТЕНИЕ ПАПОК С GITHUB API С КЭШИРОВАНИЕМ
        // ========================================================
        async function fetchImagesFromFolder(folderPath) {
            if (!folderPath) return [];

            // Проверяем кэш сессии, чтобы не тратить лимит запросов
            const cacheKey = "zagush_cache_" + folderPath;
            try {
                const cached = sessionStorage.getItem(cacheKey);
                if (cached) return JSON.parse(cached);
            } catch(e) {}

            try {
                const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${folderPath}`);
                if (!res.ok) return [];

                const files = await res.json();
                if (!Array.isArray(files)) return [];

                // Фильтруем только картинки
                const imageExtensions = /\.(png|jpe?g|webp|gif)$/i;
                const images = files
                    .filter(f => f.type === "file" && imageExtensions.test(f.name))
                    .map(f => {
                        // Чистим имя файла в красивую подпись
                        const cleanTitle = f.name
                            .replace(imageExtensions, "")
                            .replace(/[-_]/g, " ")
                            .toUpperCase();

                        return {
                            title: cleanTitle,
                            img: f.path // Локальный путь для сайта
                        };
                    });

                // Сохраняем в кэш
                try {
                    sessionStorage.setItem(cacheKey, JSON.stringify(images));
                } catch(e) {}

                return images;
            } catch (err) {
                console.warn("GitHub API folder fetch:", err);
                return [];
            }
        }

        let navStack = [portfolioData];
        let currentLang = localStorage.getItem("user_lang") || "ru";

        const contentView = document.getElementById("contentView");
        const sectionTitle = document.getElementById("sectionTitle");
        const breadcrumbs = document.getElementById("breadcrumbs");
        const navBackBtn = document.getElementById("navBackBtn");
        const langBtn = document.getElementById("langBtn");
        const toDeskBtn = document.getElementById("toDeskBtn");

        const lightboxModal = document.getElementById("lightboxModal");
        const lightboxImg = document.getElementById("lightboxImg");
        const lightboxTitle = document.getElementById("lightboxTitle");
        const lightboxClose = document.getElementById("lightboxClose");

        function pushNav(item) {
            navStack.push(item);
            history.pushState({ depth: navStack.length }, "");
            renderCurrentView();
        }

        window.addEventListener("popstate", () => {
            if (navStack.length > 1) {
                navStack.pop();
                renderCurrentView();
            }
        });

        function updateLangUI() {
            document.documentElement.lang = currentLang;
            langBtn.textContent = currentLang === "ru" ? "EN" : "RU";
            toDeskBtn.textContent = currentLang === "ru" ? "← НА СТОЛ" : "← TO DESK";
            navBackBtn.textContent = currentLang === "ru" ? "← НАЗАД" : "← BACK";
            renderCurrentView();
        }

        langBtn.addEventListener("click", () => {
            currentLang = currentLang === "ru" ? "en" : "ru";
            try { localStorage.setItem("user_lang", currentLang); } catch (e) {}
            updateLangUI();
        });

        function renderBreadcrumbs() {
            breadcrumbs.innerHTML = "";
            navStack.forEach((node, index) => {
                if (index > 0) {
                    const sep = document.createElement("span");
                    sep.className = "crumb-sep";
                    sep.textContent = ">";
                    breadcrumbs.appendChild(sep);
                }

                const span = document.createElement("span");
                const isLast = index === navStack.length - 1;
                span.className = isLast ? "crumb-active" : "crumb-link";
                span.textContent = node.title[currentLang];

                if (!isLast) {
                    span.addEventListener("click", () => {
                        navStack = navStack.slice(0, index + 1);
                        history.pushState({ depth: navStack.length }, "");
                        renderCurrentView();
                    });
                }
                breadcrumbs.appendChild(span);
            });
        }

        async function renderCurrentView() {
            const current = navStack[navStack.length - 1];
            sectionTitle.textContent = current.title[currentLang];
            navBackBtn.style.display = navStack.length > 1 ? "block" : "none";
            renderBreadcrumbs();
            contentView.innerHTML = "";

            // Ветка с подпапками
            if (current.type === "category" || current.id === "root") {
                const grid = document.createElement("div");
                grid.className = "folders-grid";

                current.items.forEach(item => {
                    const card = document.createElement("div");
                    card.className = "folder-card";

                    const previewsWrap = document.createElement("div");
                    previewsWrap.className = "folder-previews";

                    // Дефолтный веер
                    defaultFan.slice(0, 7).forEach(src => {
                        const img = document.createElement("img");
                        img.className = "preview-thumb";
                        img.src = src;
                        previewsWrap.appendChild(img);
                    });

                    // Если это папка с работами — подгружаем реальные картинки для веера
                    if (item.folder) {
                        fetchImagesFromFolder(item.folder).then(realImages => {
                            if (realImages.length > 0) {
                                previewsWrap.innerHTML = "";
                                realImages.slice(0, 7).forEach(work => {
                                    const img = document.createElement("img");
                                    img.className = "preview-thumb";
                                    img.loading = "lazy";
                                    img.src = work.img;
                                    previewsWrap.appendChild(img);
                                });
                            }
                        });
                    }

                    const pocket = document.createElement("div");
                    pocket.className = "folder-pocket";
                    pocket.innerHTML = `
                        <div class="folder-title">${item.title[currentLang]}</div>
                        ${item.desc ? `<div class="folder-desc">${item.desc[currentLang]}</div>` : ''}
                        <div class="folder-count-badge">
                            ${item.items ? (item.items.length + (currentLang === 'ru' ? ' разделов' : ' sections')) : (currentLang === 'ru' ? 'галерея' : 'gallery')}
                        </div>
                    `;

                    card.appendChild(previewsWrap);
                    card.appendChild(pocket);

                    card.addEventListener("click", () => {
                        pushNav(item);
                    });

                    grid.appendChild(card);
                });

                contentView.appendChild(grid);
            } 
            // Ветка с галереей работ
            else if (current.type === "gallery") {
                const grid = document.createElement("div");
                grid.className = "works-grid";

                // ВОТ СЮДА ВСТАВЛЯЕМ ЭТИ СТРОЧКИ:
                const isPixelCategory = navStack.some(node => node.id && node.id.includes("pixel"));
                if (isPixelCategory) {
                    grid.classList.add("pixel-mode");
                }

                grid.innerHTML = `<div class="loading-state">${currentLang === 'ru' ? 'ЗАГРУЗКА РАБОТ...' : 'LOADING ARTWORKS...'}</div>`;
                contentView.appendChild(grid);

                // Автоматически сканируем папку на GitHub
                const works = await fetchImagesFromFolder(current.folder);
                grid.innerHTML = "";

                if (works.length === 0) {
                    grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #888; font-weight: 700; padding: 40px 0;">
                        ${currentLang === 'ru' ? 'Работы пока загружаются на GitHub...' : 'Artworks coming soon...'}
                    </div>`;
                } else {
                    } else {
                    works.forEach((work, idx) => {
                        const item = document.createElement("div");
                        item.className = "work-item";
                        item.innerHTML = `
    <img src="${work.img}" alt="${work.title}" loading="lazy" decoding="async">
    <div class="work-caption">${work.title}</div>
                        `;
                        item.addEventListener("click", () => {
                            openLightbox(works, idx);
                        });
                        grid.appendChild(item);
                    });
                }
            }
        }

        navBackBtn.addEventListener("click", () => {
            if (navStack.length > 1) {
                history.back();
            }
        });

        // ========================================================
        // ЛОГИКА ПРОСМОТРЩИКА: ЗУМ, ПЕРЕТАСКИВАНИЕ И ЛИСТАНИЕ
        // ========================================================
        let currentGalleryWorks = [];
        let currentWorkIdx = 0;
        let zoomLevel = 1;
        let panX = 0, panY = 0;
        let isDragging = false;
        let startDragX = 0, startDragY = 0;

        const lightboxViewport = document.getElementById("lightboxViewport");
        const lightboxCounter = document.getElementById("lightboxCounter");
        const lightboxPrev = document.getElementById("lightboxPrev");
        const lightboxNext = document.getElementById("lightboxNext");
        const zoomVal = document.getElementById("zoomVal");
        const zoomInBtn = document.getElementById("zoomInBtn");
        const zoomOutBtn = document.getElementById("zoomOutBtn");
        const zoomResetBtn = document.getElementById("zoomResetBtn");

        function updateTransform() {
            lightboxImg.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomLevel})`;
            zoomVal.textContent = Math.round(zoomLevel * 100) + '%';
            
            if (zoomLevel > 1) {
                lightboxViewport.classList.add("is-zoomed");
            } else {
                lightboxViewport.classList.remove("is-zoomed");
            }
        }

        function resetZoom() {
            zoomLevel = 1;
            panX = 0;
            panY = 0;
            updateTransform();
        }

        function setZoom(newLevel) {
            zoomLevel = Math.min(Math.max(newLevel, 1), 6);
            if (zoomLevel === 1) {
                panX = 0;
                panY = 0;
            }
            updateTransform();
        }

        function showImageAt(idx) {
            if (currentGalleryWorks.length === 0) return;
            currentWorkIdx = (idx + currentGalleryWorks.length) % currentGalleryWorks.length;
            const work = currentGalleryWorks[currentWorkIdx];

            resetZoom();
            lightboxImg.src = work.img;
            lightboxCounter.textContent = `${currentWorkIdx + 1} / ${currentGalleryWorks.length}`;

            // Пиксель-арт без размытия
            const isPixel = navStack.some(node => node.id && node.id.includes("pixel"));
            if (isPixel) {
                lightboxModal.classList.add("pixel-mode");
            } else {
                lightboxModal.classList.remove("pixel-mode");
            }

            lightboxImg.onload = () => {
                if (lightboxImg.naturalWidth <= 320) {
                    lightboxModal.classList.add("pixel-mode");
                }
            };
        }

        function openLightbox(works, index) {
            currentGalleryWorks = works;
            showImageAt(index);
            lightboxModal.classList.add("active");
        }

        function closeLightbox() {
            lightboxModal.classList.remove("active");
            resetZoom();
        }

        // Кнопки листания
        lightboxPrev.addEventListener("click", (e) => { e.stopPropagation(); showImageAt(currentWorkIdx - 1); });
        lightboxNext.addEventListener("click", (e) => { e.stopPropagation(); showImageAt(currentWorkIdx + 1); });

        // Кнопки зума
        zoomInBtn.addEventListener("click", (e) => { e.stopPropagation(); setZoom(zoomLevel + 0.4); });
        zoomOutBtn.addEventListener("click", (e) => { e.stopPropagation(); setZoom(zoomLevel - 0.4); });
        zoomResetBtn.addEventListener("click", (e) => { e.stopPropagation(); resetZoom(); });

        // Колёсико мыши
        lightboxViewport.addEventListener("wheel", (e) => {
            e.preventDefault();
            const delta = e.deltaY < 0 ? 0.25 : -0.25;
            setZoom(zoomLevel + delta);
        }, { passive: false });

        // Перетаскивание увеличенной картинки
        lightboxViewport.addEventListener("pointerdown", (e) => {
            if (zoomLevel <= 1) return;
            isDragging = true;
            startDragX = e.clientX - panX;
            startDragY = e.clientY - panY;
            lightboxViewport.classList.add("is-dragging");
            lightboxViewport.setPointerCapture(e.pointerId);
        });

        lightboxViewport.addEventListener("pointermove", (e) => {
            if (!isDragging) return;
            panX = e.clientX - startDragX;
            panY = e.clientY - startDragY;
            updateTransform();
        });

        function endDrag(e) {
            if (!isDragging) return;
            isDragging = false;
            lightboxViewport.classList.remove("is-dragging");
            try { lightboxViewport.releasePointerCapture(e.pointerId); } catch(err) {}
        }
        lightboxViewport.addEventListener("pointerup", endDrag);
        lightboxViewport.addEventListener("pointercancel", endDrag);

        // Клавиатура: стрелки, зум, Esc
        document.addEventListener("keydown", (e) => {
            if (!lightboxModal.classList.contains("active")) return;
            if (e.key === "Escape") closeLightbox();
            if (e.key === "ArrowLeft") showImageAt(currentWorkIdx - 1);
            if (e.key === "ArrowRight") showImageAt(currentWorkIdx + 1);
            if (e.key === "+" || e.key === "=") setZoom(zoomLevel + 0.3);
            if (e.key === "-") setZoom(zoomLevel - 0.3);
            if (e.key === "0") resetZoom();
        });

        lightboxClose.addEventListener("click", closeLightbox);
        lightboxViewport.addEventListener("click", (e) => {
            if (e.target === lightboxViewport && zoomLevel === 1) closeLightbox();
        });

        history.replaceState({ depth: 1 }, "");
        updateLangUI();
    </script>
</body>
</html>
