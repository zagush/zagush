<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAGUSH — DUBSTEP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #09080e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            color: #000;
            overflow: hidden;
            user-select: none;
            padding: 20px;
        }

        /* Визуализатор Windows Media Player на фоне */
        #bgCanvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* Кнопка НА СТОЛ в стиле рисовалки */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #ff5252;
            color: #ffffff;
            text-decoration: none;
            font-weight: 900;
            font-size: 13px;
            letter-spacing: 0.05em;
            padding: 8px 16px;
            border: 2.5px solid #000;
            box-shadow: 3px 3px 0 #000;
            z-index: 100;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        .back-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0 #000;
        }

        /* Главная сцена */
        .stage {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(15px, 4vw, 55px);
            width: 100%;
            max-width: 1050px;
        }

        /* Лица-кнопки по бокам */
        .head-btn {
            position: relative;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            outline: none;
            width: clamp(85px, 13vw, 160px);
            aspect-ratio: 1 / 1.2;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-origin: center bottom;
            transition: filter 0.2s ease;
        }

        .head-btn img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            pointer-events: none;
            filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.85));
        }

        .head-btn:hover img {
            filter: drop-shadow(0 0 16px #00ffcc);
        }

        /* Стрелки-стикеры над головами */
        .head-hint {
            position: absolute;
            top: -20px;
            background: #ffffff;
            color: #000000;
            border: 2px solid #000;
            box-shadow: 2px 2px 0 #000;
            font-size: 14px;
            font-weight: 900;
            padding: 2px 8px;
            transition: transform 0.15s ease;
        }

        .head-btn:hover .head-hint {
            transform: scale(1.15) translateY(-2px);
        }

        /* Карточка плейлиста в нео-брутализме */
        .playlist-card {
            background: #ffffff;
            border: 3px solid #000000;
            box-shadow: 7px 7px 0 #000000;
            width: min(420px, 88vw);
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        /* Полоса прогресса */
        .progress-bar-wrap {
            width: 100%;
            height: 14px;
            background: #f0f0f0;
            border: 2px solid #000000;
            box-shadow: 2px 2px 0 #000;
            cursor: pointer;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: #00ffcc;
            border-right: 2px solid #000;
            transition: width 0.1s linear;
        }

        /* Список треков */
        .tracks-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .tracks-list::-webkit-scrollbar {
            width: 6px;
        }
        .tracks-list::-webkit-scrollbar-track {
            background: #eeeeee;
            border-left: 1px solid #000;
        }
        .tracks-list::-webkit-scrollbar-thumb {
            background: #000000;
        }

        /* Кнопка отдельного трека */
        .track-item {
            background: #f6f6f6;
            border: 2px solid #000000;
            box-shadow: 2.5px 2.5px 0 #000000;
            padding: 10px 14px;
            font-weight: 900;
            font-size: 13px;
            letter-spacing: 0.05em;
            color: #000000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.1s ease, background 0.1s ease;
        }

        .track-item:hover {
            background: #ffffff;
            transform: translate(-1px, -1px);
            box-shadow: 3.5px 3.5px 0 #000000;
        }

        .track-item.active {
            background: #00ffcc;
            box-shadow: 3.5px 3.5px 0 #000000;
        }

        .track-num {
            font-size: 11px;
            opacity: 0.6;
            margin-right: 8px;
        }

        /* Главная кнопка Play / Pause */
        .play-btn {
            background: #00ffcc;
            color: #000000;
            border: 2.5px solid #000000;
            box-shadow: 3.5px 3.5px 0 #000000;
            padding: 11px;
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 0.08em;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        .play-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 5px 5px 0 #000000;
        }

        @media (max-width: 650px) {
            .stage {
                flex-direction: column;
                gap: 15px;
            }
            .head-btn {
                width: 90px;
            }
        }
    </style>
</head>
<body>

    <!-- Фон визуализатора -->
    <canvas id="bgCanvas"></canvas>

    <a href="index.html" class="back-btn">← НА СТОЛ</a>

    <div class="stage">
        <!-- Левое лицо: Назад -->
        <button id="prevBtn" class="head-btn" title="Предыдущий трек">
            <span class="head-hint">◄ НАЗАД</span>
            <img src="face2.png" id="leftHead" alt="Назад" onerror="this.src='face.png'">
        </button>

        <!-- Плейлист -->
        <div class="playlist-card">
            <div class="progress-bar-wrap" id="progressWrap">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>

            <div class="tracks-list" id="tracksContainer"></div>

            <button id="playPauseBtn" class="play-btn">ИГРАТЬ ▶</button>
        </div>

        <!-- Правое лицо: Вперёд -->
        <button id="nextBtn" class="head-btn" title="Следующий трек">
            <span class="head-hint">ВПЕРЁД ►</span>
            <img src="face3.png" id="rightHead" alt="Вперёд" onerror="this.src='face.png'">
        </button>
    </div>

    <!-- Аудио элемент (чистый, без ограничений CORS) -->
    <audio id="audio" preload="auto"></audio>

    <script>
        // СПИСОК ТРЕКОВ (БЕЗ СЛОВА DUBSTEP)
        const playlist = [
            { title: "ANGRY BIRDS", file: "angry-birds.mp3" },
            { title: "TRACK 1", file: "track1.mp3" },
            { title: "TRACK 2", file: "track2.mp3" },
            { title: "TRACK 3", file: "track3.mp3" },
            { title: "TRACK 4", file: "track4.mp3" },
            { title: "TRACK 5", file: "track5.mp3" },
            { title: "TRACK 6", file: "track6.mp3" },
            { title: "TRACK 7", file: "track7.mp3" }
        ];

        let currentIndex = 0;
        let isPlaying = false;

        const audio = document.getElementById('audio');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const tracksContainer = document.getElementById('tracksContainer');
        const progressFill = document.getElementById('progressFill');
        const progressWrap = document.getElementById('progressWrap');
        const leftHead = document.getElementById('leftHead');
        const rightHead = document.getElementById('rightHead');

        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function renderPlaylist() {
            tracksContainer.innerHTML = '';
            playlist.forEach((track, idx) => {
                const item = document.createElement('div');
                item.className = 'track-item' + (idx === currentIndex ? ' active' : '');
                item.innerHTML = `
                    <div>
                        <span class="track-num">0${idx + 1}</span>
                        <span>${track.title}</span>
                    </div>
                    <span style="font-size:11px;">${idx === currentIndex && isPlaying ? '▶ ИГРАЕТ' : ''}</span>
                `;
                item.addEventListener('click', () => {
                    currentIndex = idx;
                    loadAndPlay();
                });
                tracksContainer.appendChild(item);
            });
        }

        function loadTrack(idx) {
            audio.src = playlist[idx].file;
            renderPlaylist();
        }

        async function loadAndPlay() {
            await unlockAudioContext();
            loadTrack(currentIndex);
            audio.play().then(() => {
                isPlaying = true;
                playPauseBtn.textContent = 'ПАУЗА ||';
                playPauseBtn.style.background = '#ffffff';
                renderPlaylist();
            }).catch(e => {
                console.log("Audio play error:", e);
            });
        }

        async function togglePlay() {
            await unlockAudioContext();
            if (audio.paused) {
                if (!audio.src || audio.src === "") {
                    loadTrack(currentIndex);
                }
                audio.play().then(() => {
                    isPlaying = true;
                    playPauseBtn.textContent = 'ПАУЗА ||';
                    playPauseBtn.style.background = '#ffffff';
                    renderPlaylist();
                }).catch(e => console.log("Play error:", e));
            } else {
                audio.pause();
                isPlaying = false;
                playPauseBtn.textContent = 'ИГРАТЬ ▶';
                playPauseBtn.style.background = '#00ffcc';
                renderPlaylist();
            }
        }

        playPauseBtn.addEventListener('click', togglePlay);

        prevBtn.addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            loadAndPlay();
        });

        nextBtn.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % playlist.length;
            loadAndPlay();
        });

        audio.addEventListener('ended', () => {
            currentIndex = (currentIndex + 1) % playlist.length;
            loadAndPlay();
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = percent + '%';
            }
        });

        progressWrap.addEventListener('click', (e) => {
            const rect = progressWrap.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            audio.currentTime = (clickX / rect.width) * audio.duration;
        });

        // ========================================================
        // WEB AUDIO API: НАДЕЖНЫЙ СТАРТ И АНАЛИЗАТОР
        // ========================================================
        let audioCtx, analyser, source;
        let freqData, timeData;
        let isAudioCtxInit = false;

        async function unlockAudioContext() {
            if (!isAudioCtxInit) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioCtx.createAnalyser();
                    analyser.fftSize = 256;
                    source = audioCtx.createMediaElementSource(audio);
                    source.connect(analyser);
                    analyser.connect(audioCtx.destination);

                    freqData = new Uint8Array(analyser.frequencyBinCount);
                    timeData = new Uint8Array(analyser.frequencyBinCount);
                    isAudioCtxInit = true;
                } catch (e) {
                    console.log(e);
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }
        }

        let pulseRadius = 0;

        function renderVisualizer() {
            requestAnimationFrame(renderVisualizer);

            ctx.fillStyle = 'rgba(9, 8, 14, 0.28)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (!analyser || !isPlaying) {
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(0, 255, 204, 0.25)';
                ctx.lineWidth = 2;
                ctx.moveTo(0, canvas.height / 2);
                ctx.lineTo(canvas.width, canvas.height / 2);
                ctx.stroke();
                leftHead.style.transform = 'scale(1) rotate(0deg)';
                rightHead.style.transform = 'scale(1) rotate(0deg)';
                return;
            }

            analyser.getByteFrequencyData(freqData);
            analyser.getByteTimeDomainData(timeData);

            // Бас для лиц
            const bass = (freqData[1] + freqData[2] + freqData[3] + freqData[4]) / 4;
            const normBass = bass / 255;

            if (normBass > 0.35) {
                const scale = 1 + normBass * 0.38;
                leftHead.style.transform = `scale(${scale}) rotate(${-12 * normBass}deg)`;
                rightHead.style.transform = `scale(${scale}) rotate(${12 * normBass}deg)`;
            } else {
                leftHead.style.transform = 'scale(1) rotate(0deg)';
                rightHead.style.transform = 'scale(1) rotate(0deg)';
            }

            // Вспышка волны от саб-баса
            if (normBass > 0.58) {
                pulseRadius = Math.min(pulseRadius + 20, canvas.width / 2);
                ctx.beginPath();
                ctx.arc(canvas.width / 2, canvas.height / 2, pulseRadius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(0, 255, 204, ${normBass * 0.45})`;
                ctx.lineWidth = 4;
                ctx.stroke();
            } else {
                pulseRadius = Math.max(0, pulseRadius - 12);
            }

            // Осциллограф WMP (зеленая синусоида)
            ctx.lineWidth = 3;
            ctx.beginPath();
            const sliceWidth = canvas.width / timeData.length;
            let x = 0;

            for (let i = 0; i < timeData.length; i++) {
                const v = timeData[i] / 128.0;
                const y = (v * canvas.height) / 2;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
                x += sliceWidth;
            }
            ctx.strokeStyle = '#00ffcc';
            ctx.shadowBlur = 14;
            ctx.shadowColor = '#00ffcc';
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Столбики эквалайзера WMP сверху и снизу
            const barCount = 42;
            const barWidth = canvas.width / barCount;
            for (let i = 0; i < barCount; i++) {
                const val = freqData[i * 2] || 0;
                const barHeight = (val / 255) * (canvas.height * 0.33);

                ctx.fillStyle = `rgba(255, 0, 128, 0.4)`;
                ctx.fillRect(i * barWidth, 0, barWidth - 3, barHeight);

                ctx.fillStyle = `rgba(0, 255, 204, 0.45)`;
                ctx.fillRect(i * barWidth, canvas.height - barHeight, barWidth - 3, barHeight);
            }
        }

        renderVisualizer();
        loadTrack(currentIndex);
    </script>
</body>
</html>
