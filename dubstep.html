<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAGUSH — DUBSTEP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #09080e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', Courier, monospace, Arial, sans-serif;
            color: #000;
            overflow: hidden;
            user-select: none;
            padding: 20px;
        }

        /* Визуализатор на весь фон */
        #bgCanvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* Верхняя панель в стиле панели рисовалки */
        .top-nav {
            position: fixed;
            top: 15px;
            left: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            background: #ffffff;
            border: 2px solid #000000;
            padding: 5px;
            box-shadow: 3px 3px 0 #000;
        }

        /* Кнопка НА СТОЛ (как на скриншоте) */
        .btn-exit {
            background: #e74c3c;
            color: #ffffff;
            text-decoration: none;
            font-weight: 900;
            font-size: 13px;
            letter-spacing: 0.05em;
            padding: 7px 14px;
            border: 2px solid #000000;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.1s ease;
        }

        .btn-exit:hover {
            opacity: 0.9;
        }

        /* Главная сцена с головами и плеером */
        .stage {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(15px, 4vw, 55px);
            width: 100%;
            max-width: 1050px;
        }

        /* Лица-кнопки по бокам */
        .head-btn {
            position: relative;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            outline: none;
            width: clamp(85px, 13vw, 150px);
            aspect-ratio: 1 / 1.2;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-origin: center bottom;
            transition: filter 0.2s ease;
        }

        .head-btn img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            pointer-events: none;
            filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.85));
        }

        .head-btn:hover img {
            filter: drop-shadow(0 0 16px #00ffcc);
        }

        /* Стикерные подсказки над головами в стиле тулбара */
        .head-hint {
            position: absolute;
            top: -24px;
            background: #dbe2e8;
            color: #000000;
            border: 2px solid #000;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 0.05em;
            padding: 3px 8px;
            white-space: nowrap;
        }

        .head-btn:hover .head-hint {
            background: #00ffcc;
        }

        /* Панель плейлиста — стилизация под ретро-тулбар */
        .player-panel {
            background: #ffffff;
            border: 2px solid #000000;
            box-shadow: 5px 5px 0 #000000;
            width: min(440px, 90vw);
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Верхняя служебная плашка плеера */
        .player-header {
            background: #dbe2e8;
            border: 2px solid #000000;
            padding: 6px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 0.05em;
        }

        .player-status-tag {
            background: #000;
            color: #00ffcc;
            padding: 2px 6px;
        }

        /* Прогресс-бар */
        .progress-bar-wrap {
            width: 100%;
            height: 16px;
            background: #dbe2e8;
            border: 2px solid #000000;
            cursor: pointer;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: #00ffcc;
            border-right: 2px solid #000000;
        }

        /* Список треков */
        .tracks-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 240px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .tracks-list::-webkit-scrollbar {
            width: 8px;
        }
        .tracks-list::-webkit-scrollbar-track {
            background: #ffffff;
            border-left: 2px solid #000000;
        }
        .tracks-list::-webkit-scrollbar-thumb {
            background: #000000;
        }

        /* Кнопка трека в стиле кнопок тулбара */
        .track-item {
            background: #dbe2e8;
            border: 2px solid #000000;
            padding: 8px 12px;
            font-weight: 900;
            font-size: 12px;
            letter-spacing: 0.05em;
            color: #000000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: background 0.1s ease;
        }

        .track-item:hover {
            background: #edf2f7;
        }

        .track-item.active {
            background: #00ffcc;
        }

        .track-num {
            font-size: 11px;
            opacity: 0.6;
            margin-right: 6px;
        }

        /* Нижний ряд кнопок управления */
        .controls-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 6px;
        }

        .play-btn {
            background: #00ffcc;
            color: #000000;
            border: 2px solid #000000;
            padding: 10px;
            font-family: inherit;
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: background 0.1s ease;
        }

        .play-btn:hover {
            background: #33ffd6;
        }

        @media (max-width: 650px) {
            .stage {
                flex-direction: column;
                gap: 12px;
            }
            .head-btn {
                width: 80px;
            }
        }
    </style>
</head>
<body>

    <!-- Canvas Visualizer -->
    <canvas id="bgCanvas"></canvas>

    <!-- Верхний тулбар -->
    <div class="top-nav">
        <a href="index.html" class="btn-exit">← НА СТОЛ</a>
    </div>

    <div class="stage">
        <!-- Предыдущий трек -->
        <button id="prevBtn" class="head-btn" title="Предыдущий трек" type="button">
            <span class="head-hint">◄ НАЗАД</span>
            <img src="face2.png" id="leftHead" alt="Назад" onerror="this.src='face.png'">
        </button>

        <!-- Окно плеера -->
        <div class="player-panel">
            <div class="player-header">
                <span>DUBSTEP_AUDIO // SYSTEM</span>
                <span class="player-status-tag" id="statusTag">ГОТОВ</span>
            </div>

            <div class="progress-bar-wrap" id="progressWrap">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>

            <div class="tracks-list" id="tracksContainer"></div>

            <div class="controls-row">
                <button id="playPauseBtn" class="play-btn" type="button">ИГРАТЬ ▶</button>
            </div>
        </div>

        <!-- Следующий трек -->
        <button id="nextBtn" class="head-btn" title="Следующий трек" type="button">
            <span class="head-hint">ВПЕРЁД ►</span>
            <img src="face3.png" id="rightHead" alt="Вперёд" onerror="this.src='face.png'">
        </button>
    </div>

    <!-- Нативный элемент Audio -->
    <audio id="audio" preload="auto"></audio>

    <script>
        const playlist = [
            { title: "ANGRY BIRDS", file: "angry-birds.mp3" },
            { title: "TRACK 1", file: "track1.mp3" },
            { title: "TRACK 2", file: "track2.mp3" },
            { title: "TRACK 3", file: "track3.mp3" },
            { title: "TRACK 4", file: "track4.mp3" },
            { title: "TRACK 5", file: "track5.mp3" },
            { title: "TRACK 6", file: "track6.mp3" },
            { title: "TRACK 7", file: "track7.mp3" }
        ];

        let currentIndex = 0;
        let isPlaying = false;

        const audio = document.getElementById('audio');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const tracksContainer = document.getElementById('tracksContainer');
        const progressFill = document.getElementById('progressFill');
        const progressWrap = document.getElementById('progressWrap');
        const statusTag = document.getElementById('statusTag');
        const leftHead = document.getElementById('leftHead');
        const rightHead = document.getElementById('rightHead');

        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function renderPlaylist() {
            tracksContainer.innerHTML = '';
            playlist.forEach((track, idx) => {
                const item = document.createElement('div');
                item.className = 'track-item' + (idx === currentIndex ? ' active' : '');
                item.innerHTML = `
                    <div>
                        <span class="track-num">0${idx + 1}</span>
                        <span>${track.title}</span>
                    </div>
                    <span style="font-size:11px;">${idx === currentIndex && isPlaying ? '● PLAYING' : ''}</span>
                `;
                item.addEventListener('click', () => {
                    currentIndex = idx;
                    loadAndPlay();
                });
                tracksContainer.appendChild(item);
            });
        }

        // ========================================================
        // НАДЕЖНЫЙ WEB AUDIO API
        // ========================================================
        let audioCtx = null;
        let analyser = null;
        let sourceNode = null;
        let freqData, timeData;

        function initAudioEngine() {
            if (!audioCtx) {
                try {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioContextClass();
                    analyser = audioCtx.createAnalyser();
                    analyser.fftSize = 256;

                    sourceNode = audioCtx.createMediaElementSource(audio);
                    sourceNode.connect(analyser);
                    analyser.connect(audioCtx.destination);

                    freqData = new Uint8Array(analyser.frequencyBinCount);
                    timeData = new Uint8Array(analyser.frequencyBinCount);
                } catch (e) {
                    console.warn("Web Audio API Init Error:", e);
                }
            }

            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function loadTrack(idx) {
            audio.src = playlist[idx].file;
            audio.load();
            renderPlaylist();
        }

        async function loadAndPlay() {
            initAudioEngine();
            loadTrack(currentIndex);
            
            try {
                await audio.play();
                isPlaying = true;
                playPauseBtn.textContent = 'ПАУЗА ||';
                playPauseBtn.style.background = '#ffffff';
                statusTag.textContent = 'ИГРАЕТ';
                statusTag.style.color = '#00ffcc';
                renderPlaylist();
            } catch (err) {
                console.error("Audio playback error:", err);
                statusTag.textContent = 'ОШИБКА';
                statusTag.style.color = '#ff5252';
            }
        }

        async function togglePlay() {
            initAudioEngine();

            if (!audio.src || audio.src === "" || audio.src === window.location.href) {
                loadTrack(currentIndex);
            }

            if (audio.paused) {
                try {
                    await audio.play();
                    isPlaying = true;
                    playPauseBtn.textContent = 'ПАУЗА ||';
                    playPauseBtn.style.background = '#ffffff';
                    statusTag.textContent = 'ИГРАЕТ';
                    statusTag.style.color = '#00ffcc';
                    renderPlaylist();
                } catch (e) {
                    console.log("Play failed:", e);
                }
            } else {
                audio.pause();
                isPlaying = false;
                playPauseBtn.textContent = 'ИГРАТЬ ▶';
                playPauseBtn.style.background = '#00ffcc';
                statusTag.textContent = 'ПАУЗА';
                statusTag.style.color = '#ffffff';
                renderPlaylist();
            }
        }

        playPauseBtn.addEventListener('click', togglePlay);

        prevBtn.addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            loadAndPlay();
        });

        nextBtn.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % playlist.length;
            loadAndPlay();
        });

        audio.addEventListener('ended', () => {
            currentIndex = (currentIndex + 1) % playlist.length;
            loadAndPlay();
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = percent + '%';
            }
        });

        progressWrap.addEventListener('click', (e) => {
            if (!audio.duration) return;
            const rect = progressWrap.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            audio.currentTime = (clickX / rect.width) * audio.duration;
        });

        // ========================================================
        // ВИЗУАЛИЗАТОР
        // ========================================================
        let pulseRadius = 0;

        function renderVisualizer() {
            requestAnimationFrame(renderVisualizer);

            ctx.fillStyle = 'rgba(9, 8, 14, 0.28)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (!analyser || !isPlaying) {
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(0, 255, 204, 0.25)';
                ctx.lineWidth = 2;
                ctx.moveTo(0, canvas.height / 2);
                ctx.lineTo(canvas.width, canvas.height / 2);
                ctx.stroke();
                leftHead.style.transform = 'scale(1) rotate(0deg)';
                rightHead.style.transform = 'scale(1) rotate(0deg)';
                return;
            }

            analyser.getByteFrequencyData(freqData);
            analyser.getByteTimeDomainData(timeData);

            // Бас для голов
            const bass = (freqData[1] + freqData[2] + freqData[3] + freqData[4]) / 4;
            const normBass = bass / 255;

            if (normBass > 0.35) {
                const scale = 1 + normBass * 0.38;
                leftHead.style.transform = `scale(${scale}) rotate(${-12 * normBass}deg)`;
                rightHead.style.transform = `scale(${scale}) rotate(${12 * normBass}deg)`;
            } else {
                leftHead.style.transform = 'scale(1) rotate(0deg)';
                rightHead.style.transform = 'scale(1) rotate(0deg)';
            }

            // Вспышка волны от саб-баса
            if (normBass > 0.58) {
                pulseRadius = Math.min(pulseRadius + 20, canvas.width / 2);
                ctx.beginPath();
                ctx.arc(canvas.width / 2, canvas.height / 2, pulseRadius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(0, 255, 204, ${normBass * 0.45})`;
                ctx.lineWidth = 4;
                ctx.stroke();
            } else {
                pulseRadius = Math.max(0, pulseRadius - 12);
            }

            // Зеленый осциллограф
            ctx.lineWidth = 3;
            ctx.beginPath();
            const sliceWidth = canvas.width / timeData.length;
            let x = 0;

            for (let i = 0; i < timeData.length; i++) {
                const v = timeData[i] / 128.0;
                const y = (v * canvas.height) / 2;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
                x += sliceWidth;
            }
            ctx.strokeStyle = '#00ffcc';
            ctx.shadowBlur = 14;
            ctx.shadowColor = '#00ffcc';
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Столбики эквалайзера WMP сверху и снизу
            const barCount = 42;
            const barWidth = canvas.width / barCount;
            for (let i = 0; i < barCount; i++) {
                const val = freqData[i * 2] || 0;
                const barHeight = (val / 255) * (canvas.height * 0.33);

                ctx.fillStyle = `rgba(255, 0, 128, 0.4)`;
                ctx.fillRect(i * barWidth, 0, barWidth - 3, barHeight);

                ctx.fillStyle = `rgba(0, 255, 204, 0.45)`;
                ctx.fillRect(i * barWidth, canvas.height - barHeight, barWidth - 3, barHeight);
            }
        }

        renderPlaylist();
        renderVisualizer();
        loadTrack(currentIndex);
    </script>
</body>
</html>
