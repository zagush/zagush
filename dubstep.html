<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAGUSH — DUBSTEP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #06050a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            color: #fff;
            overflow: hidden;
            user-select: none;
            padding: 20px;
        }

        /* Полноэкранный визуализатор Windows Media Player */
        #bgCanvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* Кнопка возврата */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #ffffff;
            color: #000000;
            text-decoration: none;
            font-weight: 900;
            font-size: 13px;
            letter-spacing: 0.08em;
            padding: 8px 16px;
            border: 2px solid #000;
            box-shadow: 4px 4px 0 #00ffcc;
            z-index: 100;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .back-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 6px 6px 0 #00ffcc;
        }

        /* Главная сцена */
        .stage {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(15px, 4vw, 55px);
            width: 100%;
            max-width: 1050px;
        }

        /* Интерактивные лица-кнопки */
        .head-btn {
            position: relative;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            outline: none;
            width: clamp(85px, 13vw, 160px);
            aspect-ratio: 1 / 1.2;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-origin: center bottom;
            transition: filter 0.2s ease;
        }

        .head-btn img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            pointer-events: none;
            filter: drop-shadow(0 8px 15px rgba(0, 0, 0, 0.9));
        }

        .head-btn:hover img {
            filter: drop-shadow(0 0 18px #00ffcc);
        }

        .head-hint {
            position: absolute;
            top: -24px;
            font-size: 20px;
            font-weight: 900;
            color: #00ffcc;
            opacity: 0.7;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .head-btn:hover .head-hint {
            opacity: 1;
            transform: scale(1.3);
        }

        /* Центр: Карточка плейлиста */
        .playlist-card {
            background: rgba(18, 15, 25, 0.9);
            backdrop-filter: blur(8px);
            border: 3px solid #000;
            box-shadow: 8px 8px 0 #000, 0 0 30px rgba(0, 255, 204, 0.2);
            width: min(440px, 88vw);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        /* Полоса прогресса трека */
        .progress-bar-wrap {
            width: 100%;
            height: 10px;
            background: #252033;
            border: 1.5px solid #000;
            cursor: pointer;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: #00ffcc;
            box-shadow: 0 0 10px #00ffcc;
            transition: width 0.1s linear;
        }

        /* Список треков с красивым скроллом */
        .tracks-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .tracks-list::-webkit-scrollbar {
            width: 6px;
        }
        .tracks-list::-webkit-scrollbar-track {
            background: #15121e;
        }
        .tracks-list::-webkit-scrollbar-thumb {
            background: #00ffcc;
            border-radius: 2px;
        }

        .track-item {
            background: #221d2e;
            border: 2px solid #000;
            box-shadow: 3px 3px 0 #000;
            padding: 10px 14px;
            font-weight: 800;
            font-size: 13px;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.12s ease, background 0.12s ease;
        }

        .track-item:hover {
            background: #322b42;
            transform: translateX(3px);
        }

        .track-item.active {
            background: #00ffcc;
            color: #000000;
            border-color: #000000;
            box-shadow: 4px 4px 0 #000;
        }

        .track-num {
            font-size: 11px;
            opacity: 0.7;
            margin-right: 8px;
        }

        .track-status {
            font-size: 12px;
        }

        /* Кнопка Play/Pause */
        .play-btn {
            background: #ffffff;
            color: #000000;
            border: 2px solid #000;
            box-shadow: 4px 4px 0 #000;
            padding: 10px;
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 0.08em;
            cursor: pointer;
            width: 100%;
            margin-top: 4px;
            transition: transform 0.1s ease;
        }

        .play-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 5px 5px 0 #000;
        }

        @media (max-width: 650px) {
            .stage {
                flex-direction: column;
                gap: 15px;
            }
            .head-btn {
                width: 90px;
            }
        }
    </style>
</head>
<body>

    <!-- Канвас ретро визуализатора -->
    <canvas id="bgCanvas"></canvas>

    <a href="index.html" class="back-btn">← НА СТОЛ</a>

    <div class="stage">
        <!-- Левое лицо: Назад -->
        <button id="prevBtn" class="head-btn" title="Предыдущий трек">
            <span class="head-hint">◄</span>
            <img src="face2.png" id="leftHead" alt="Назад" onerror="this.src='face.png'">
        </button>

        <!-- Плейлист -->
        <div class="playlist-card">
            <div class="progress-bar-wrap" id="progressWrap">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>

            <div class="tracks-list" id="tracksContainer"></div>

            <button id="playPauseBtn" class="play-btn">ПАУЗА ||</button>
        </div>

        <!-- Правое лицо: Вперёд -->
        <button id="nextBtn" class="head-btn" title="Следующий трек">
            <span class="head-hint">►</span>
            <img src="face3.png" id="rightHead" alt="Вперёд" onerror="this.src='face.png'">
        </button>
    </div>

    <audio id="audio" crossorigin="anonymous"></audio>

    <script>
        // ВСЕ ТВОИ 8 ТРЕКОВ
        const playlist = [
            { title: "ANGRY BIRDS DUBSTEP", file: "angry-birds.mp3" },
            { title: "DUBSTEP TRACK 1", file: "track1.mp3" },
            { title: "DUBSTEP TRACK 2", file: "track2.mp3" },
            { title: "DUBSTEP TRACK 3", file: "track3.mp3" },
            { title: "DUBSTEP TRACK 4", file: "track4.mp3" },
            { title: "DUBSTEP TRACK 5", file: "track5.mp3" },
            { title: "DUBSTEP TRACK 6", file: "track6.mp3" },
            { title: "DUBSTEP TRACK 7", file: "track7.mp3" }
        ];

        let currentIndex = 0;
        let isPlaying = false;

        const audio = document.getElementById('audio');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const tracksContainer = document.getElementById('tracksContainer');
        const progressFill = document.getElementById('progressFill');
        const progressWrap = document.getElementById('progressWrap');
        const leftHead = document.getElementById('leftHead');
        const rightHead = document.getElementById('rightHead');

        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function renderPlaylist() {
            tracksContainer.innerHTML = '';
            playlist.forEach((track, idx) => {
                const item = document.createElement('div');
                item.className = 'track-item' + (idx === currentIndex ? ' active' : '');
                item.innerHTML = `
                    <div>
                        <span class="track-num">0${idx + 1}</span>
                        <span>${track.title}</span>
                    </div>
                    <span class="track-status">${idx === currentIndex && isPlaying ? '▶' : ''}</span>
                `;
                item.addEventListener('click', () => {
                    currentIndex = idx;
                    loadAndPlay();
                });
                tracksContainer.appendChild(item);
            });
        }

        function loadTrack(idx) {
            audio.src = playlist[idx].file;
            renderPlaylist();
        }

        function loadAndPlay() {
            initAudioContext();
            loadTrack(currentIndex);
            audio.play().then(() => {
                isPlaying = true;
                playPauseBtn.textContent = 'ПАУЗА ||';
                renderPlaylist();
            }).catch(e => console.log('Autoplay policy'));
        }

        function togglePlay() {
            initAudioContext();
            if (audio.paused) {
                if (!audio.src) loadTrack(currentIndex);
                audio.play();
                isPlaying = true;
                playPauseBtn.textContent = 'ПАУЗА ||';
            } else {
                audio.pause();
                isPlaying = false;
                playPauseBtn.textContent = 'ИГРАТЬ ▶';
            }
            renderPlaylist();
        }

        playPauseBtn.addEventListener('click', togglePlay);

        prevBtn.addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            loadAndPlay();
        });

        nextBtn.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % playlist.length;
            loadAndPlay();
        });

        audio.addEventListener('ended', () => {
            currentIndex = (currentIndex + 1) % playlist.length;
            loadAndPlay();
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = percent + '%';
            }
        });

        progressWrap.addEventListener('click', (e) => {
            const rect = progressWrap.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            audio.currentTime = (clickX / rect.width) * audio.duration;
        });

        // ========================================================
        // WEB AUDIO API + WINDOWS MEDIA PLAYER ЭФФЕКТ
        // ========================================================
        let audioCtx, analyser, source;
        let freqData, timeData;
        let isAudioCtxInit = false;

        function initAudioContext() {
            if (isAudioCtxInit) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                source = audioCtx.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);

                freqData = new Uint8Array(analyser.frequencyBinCount);
                timeData = new Uint8Array(analyser.frequencyBinCount);
                isAudioCtxInit = true;
            } catch (err) {
                console.log(err);
            }
        }

        let pulseRadius = 0;

        function renderVisualizer() {
            requestAnimationFrame(renderVisualizer);

            // Эффект затухания шлейфа как в WMP
            ctx.fillStyle = 'rgba(7, 6, 11, 0.25)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (!analyser || !isPlaying) {
                // Если на паузе — рисуем спокойную ровную зеленую линию
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(0, 255, 204, 0.2)';
                ctx.lineWidth = 2;
                ctx.moveTo(0, canvas.height / 2);
                ctx.lineTo(canvas.width, canvas.height / 2);
                ctx.stroke();
                leftHead.style.transform = 'scale(1) rotate(0deg)';
                rightHead.style.transform = 'scale(1) rotate(0deg)';
                return;
            }

            analyser.getByteFrequencyData(freqData);
            analyser.getByteTimeDomainData(timeData);

            // 1. Анализ баса для лиц
            const bass = (freqData[1] + freqData[2] + freqData[3] + freqData[4]) / 4;
            const normBass = bass / 255;

            if (normBass > 0.35) {
                const scale = 1 + normBass * 0.35;
                leftHead.style.transform = `scale(${scale}) rotate(${-12 * normBass}deg)`;
                rightHead.style.transform = `scale(${scale}) rotate(${12 * normBass}deg)`;
            } else {
                leftHead.style.transform = 'scale(1) rotate(0deg)';
                rightHead.style.transform = 'scale(1) rotate(0deg)';
            }

            // 2. Вспышка ударной волны от саб-баса в центре
            if (normBass > 0.6) {
                pulseRadius = Math.min(pulseRadius + 18, canvas.width / 2);
                ctx.beginPath();
                ctx.arc(canvas.width / 2, canvas.height / 2, pulseRadius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255, 0, 128, ${normBass * 0.4})`;
                ctx.lineWidth = 4;
                ctx.stroke();
            } else {
                pulseRadius = Math.max(0, pulseRadius - 10);
            }

            // 3. Волновой осциллограф WMP (синусоида по центру)
            ctx.lineWidth = 3;
            ctx.beginPath();
            const sliceWidth = canvas.width / timeData.length;
            let x = 0;

            for (let i = 0; i < timeData.length; i++) {
                const v = timeData[i] / 128.0;
                const y = (v * canvas.height) / 2;

                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);

                x += sliceWidth;
            }
            ctx.strokeStyle = '#00ffcc';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00ffcc';
            ctx.stroke();
            ctx.shadowBlur = 0;

            // 4. Частотные столбики WMP снизу и сверху экрана
            const barCount = 48;
            const barWidth = canvas.width / barCount;
            for (let i = 0; i < barCount; i++) {
                const val = freqData[i * 2] || 0;
                const barHeight = (val / 255) * (canvas.height * 0.35);

                // Верхний спектр (фиолетовый)
                ctx.fillStyle = `rgba(200, 0, 255, 0.45)`;
                ctx.fillRect(i * barWidth, 0, barWidth - 3, barHeight);

                // Нижний спектр (зелено-бирюзовый)
                ctx.fillStyle = `rgba(0, 255, 170, 0.45)`;
                ctx.fillRect(i * barWidth, canvas.height - barHeight, barWidth - 3, barHeight);
            }
        }

        renderVisualizer();
        loadTrack(currentIndex);
    </script>
</body>
</html>
