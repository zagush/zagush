<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAGUSH — DUBSTEP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #09080e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', Courier, monospace, Arial, sans-serif;
            color: #000;
            overflow: hidden;
            user-select: none;
            padding: 20px;
        }

        /* Фоновый визуализатор WMP */
        #bgCanvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* Тулбар выхода НА СТОЛ */
        .top-nav {
            position: fixed;
            top: 15px;
            left: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            background: #ffffff;
            border: 2px solid #000000;
            padding: 4px;
            box-shadow: 3px 3px 0 #000000;
        }

        .btn-exit {
            background: #e74c3c;
            color: #ffffff;
            text-decoration: none;
            font-weight: 900;
            font-size: 13px;
            letter-spacing: 0.05em;
            padding: 6px 14px;
            border: 2px solid #000000;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.1s ease;
        }

        .btn-exit:hover {
            opacity: 0.9;
        }

        /* Главная сцена */
        .stage {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(15px, 4vw, 55px);
            width: 100%;
            max-width: 1050px;
        }

        /* ========================================================
           ИНТЕРАКТИВНЫЕ ГОЛОВЫ
           ======================================================== */
        .head-btn {
            position: relative;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            outline: none;
            width: clamp(90px, 13vw, 155px);
            aspect-ratio: 1 / 1.2;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-origin: center bottom;
            transition: transform 0.1s ease;
        }

        .head-btn img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            pointer-events: none;
            filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.85));
            transition: filter 0.2s ease;
        }

        /* Легкое покачивание в покое */
        #prevBtn img {
            animation: breatheLeft 3s ease-in-out infinite;
        }
        #nextBtn img {
            animation: breatheRight 3s ease-in-out infinite;
        }

        @keyframes breatheLeft {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-5px) rotate(1deg); }
        }
        @keyframes breatheRight {
            0%, 100% { transform: translateY(0) rotate(2deg); }
            50% { transform: translateY(-5px) rotate(-1deg); }
        }

        /* Реакция на наведение курсора мыши */
        #prevBtn:hover img {
            animation: wobbleHoverLeft 0.4s ease-in-out infinite alternate !important;
            filter: drop-shadow(0 0 18px #00ffcc) drop-shadow(0 8px 12px rgba(0,0,0,0.9));
        }

        #nextBtn:hover img {
            animation: wobbleHoverRight 0.4s ease-in-out infinite alternate !important;
            filter: drop-shadow(0 0 18px #00ffcc) drop-shadow(0 8px 12px rgba(0,0,0,0.9));
        }

        @keyframes wobbleHoverLeft {
            0% { transform: scale(1.15) rotate(-10deg) translateY(-4px); }
            100% { transform: scale(1.22) rotate(3deg) translateY(-10px); }
        }

        @keyframes wobbleHoverRight {
            0% { transform: scale(1.15) rotate(10deg) translateY(-4px); }
            100% { transform: scale(1.22) rotate(-3deg) translateY(-10px); }
        }

        /* Сплющивание при клике */
        .head-btn:active img {
            transform: scale(0.82, 1.25) translateY(12px) !important;
            filter: drop-shadow(0 0 25px #ffffff) !important;
            transition: transform 0.05s ease;
        }

        /* Стикерные стрелки */
        .head-hint {
            position: absolute;
            top: -24px;
            background: #dbe2e8;
            color: #000000;
            border: 2px solid #000000;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 0.05em;
            padding: 3px 8px;
            white-space: nowrap;
            transition: transform 0.15s ease, background 0.15s ease;
        }

        .head-btn:hover .head-hint {
            background: #00ffcc;
            transform: scale(1.12) translateY(-3px);
        }

        /* ========================================================
           ПАНЕЛЬ ПЛЕЕРА
           ======================================================== */
        .player-panel {
            background: #ffffff;
            border: 2px solid #000000;
            box-shadow: 6px 6px 0 #000000;
            width: min(450px, 92vw);
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .player-header {
            background: #dbe2e8;
            border: 2px solid #000000;
            padding: 6px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 0.05em;
        }

        .player-status-tag {
            background: #000000;
            color: #00ffcc;
            padding: 2px 6px;
            font-size: 10px;
        }

        .progress-bar-wrap {
            width: 100%;
            height: 16px;
            background: #dbe2e8;
            border: 2px solid #000000;
            cursor: pointer;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: #00ffcc;
            border-right: 2px solid #000000;
        }

        .tracks-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 230px;
            overflow-y: auto;
            padding: 2px 4px 2px 0;
        }

        .tracks-list::-webkit-scrollbar {
            width: 8px;
        }
        .tracks-list::-webkit-scrollbar-track {
            background: #ffffff;
            border-left: 2px solid #000000;
        }
        .tracks-list::-webkit-scrollbar-thumb {
            background: #000000;
        }

        .track-item {
            background: #dbe2e8;
            border: 2px solid #000000;
            padding: 8px 12px;
            font-weight: 900;
            font-size: 12px;
            letter-spacing: 0.05em;
            color: #000000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: background 0.1s ease;
        }

        .track-item:hover {
            background: #edf2f7;
        }

        .track-item.active {
            background: #00ffcc;
        }

        .track-num {
            font-size: 11px;
            opacity: 0.65;
            margin-right: 8px;
        }

        .play-btn {
            background: #00ffcc;
            color: #000000;
            border: 2px solid #000000;
            padding: 10px;
            font-family: inherit;
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: background 0.1s ease;
            width: 100%;
        }

        .play-btn:hover {
            background: #33ffd6;
        }

        @media (max-width: 650px) {
            .stage {
                flex-direction: column;
                gap: 16px;
            }
            .head-btn {
                width: 85px;
            }
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <div class="top-nav">
        <a href="index.html" class="btn-exit">← НА СТОЛ</a>
    </div>

    <div class="stage">
        <!-- Предыдущий трек -->
        <button id="prevBtn" class="head-btn" title="Предыдущий трек" type="button">
            <span class="head-hint">◄ НАЗАД</span>
            <img src="face2.png" alt="Назад" onerror="this.src='face.png'">
        </button>

        <!-- Плеер -->
        <div class="player-panel">
            <div class="player-header">
                <span>DUBSTEP_AUDIO // SYSTEM</span>
                <span class="player-status-tag" id="statusTag">ГОТОВ</span>
            </div>

            <div class="progress-bar-wrap" id="progressWrap">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>

            <div class="tracks-list" id="tracksContainer"></div>

            <button id="playPauseBtn" class="play-btn" type="button">ИГРАТЬ ▶</button>
        </div>

        <!-- Следующий трек -->
        <button id="nextBtn" class="head-btn" title="Следующий трек" type="button">
            <span class="head-hint">ВПЕРЁД ►</span>
            <img src="face3.png" alt="Вперёд" onerror="this.src='face.png'">
        </button>
    </div>

    <!-- Аудио элемент -->
    <audio id="audio" preload="metadata"></audio>

    <script>
        // ТОЧНЫЕ ПУТИ В ПАПКУ dubstep/ СО СКРИНШОТА
        const playlist = [
            { title: "ANGRY BIRDS", file: "dubstep/angry-birds.mp3" },
            { title: "TRACK 1", file: "dubstep/track1.mp3" },
            { title: "TRACK 2", file: "dubstep/track2.mp3" },
            { title: "TRACK 3", file: "dubstep/track3.mp3" },
            { title: "TRACK 4", file: "dubstep/track4.mp3" },
            { title: "TRACK 5", file: "dubstep/track5.mp3" },
            { title: "TRACK 6", file: "dubstep/track6.mp3" },
            { title: "TRACK 7", file: "dubstep/track7.mp3" }
        ];

        let currentIndex = 0;
        let isPlaying = false;

        const audio = document.getElementById('audio');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const tracksContainer = document.getElementById('tracksContainer');
        const progressFill = document.getElementById('progressFill');
        const progressWrap = document.getElementById('progressWrap');
        const statusTag = document.getElementById('statusTag');

        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function renderPlaylist() {
            tracksContainer.innerHTML = '';
            playlist.forEach((track, idx) => {
                const item = document.createElement('div');
                item.className = 'track-item' + (idx === currentIndex ? ' active' : '');
                item.innerHTML = `
                    <div>
                        <span class="track-num">0${idx + 1}</span>
                        <span>${track.title}</span>
                    </div>
                    <span style="font-size:11px;">${idx === currentIndex && isPlaying ? '● ИГРАЕТ' : ''}</span>
                `;
                item.addEventListener('click', () => {
                    currentIndex = idx;
                    playTrack(currentIndex);
                });
                tracksContainer.appendChild(item);
            });
        }

        // ========================================================
        // WEB AUDIO API
        // ========================================================
        let audioCtx = null;
        let analyser = null;
        let freqData, timeData;

        function initAudioEngine() {
            if (!audioCtx) {
                try {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioContextClass();
                    analyser = audioCtx.createAnalyser();
                    analyser.fftSize = 256;

                    const sourceNode = audioCtx.createMediaElementSource(audio);
                    sourceNode.connect(analyser);
                    analyser.connect(audioCtx.destination);

                    freqData = new Uint8Array(analyser.frequencyBinCount);
                    timeData = new Uint8Array(analyser.frequencyBinCount);
                } catch (e) {
                    console.warn("Visualizer fallback notice:", e);
                }
            }

            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // ========================================================
        // ВОСПРОИЗВЕДЕНИЕ
        // ========================================================
        async function playTrack(idx) {
            initAudioEngine();
            currentIndex = idx;
            const targetFile = playlist[currentIndex].file;

            audio.src = targetFile;

            try {
                statusTag.textContent = 'ЗАГРУЗКА';
                statusTag.style.color = '#ffbb00';

                await audio.play();
                isPlaying = true;
                playPauseBtn.textContent = 'ПАУЗА ||';
                playPauseBtn.style.background = '#ffffff';
                statusTag.textContent = 'ИГРАЕТ';
                statusTag.style.color = '#00ffcc';
                renderPlaylist();
            } catch (err) {
                console.error("Playback error:", err);
            }
        }

        audio.addEventListener('error', () => {
            console.error("Audio error on source:", audio.src);
            statusTag.textContent = 'НЕТ ФАЙЛА 404';
            statusTag.style.color = '#ff5252';
            isPlaying = false;
            playPauseBtn.textContent = 'ИГРАТЬ ▶';
            playPauseBtn.style.background = '#00ffcc';
            renderPlaylist();
        });

        async function togglePlay() {
            initAudioEngine();

            if (!audio.src || audio.src === "" || audio.src === window.location.href) {
                playTrack(currentIndex);
                return;
            }

            if (audio.paused) {
                try {
                    await audio.play();
                    isPlaying = true;
                    playPauseBtn.textContent = 'ПАУЗА ||';
                    playPauseBtn.style.background = '#ffffff';
                    statusTag.textContent = 'ИГРАЕТ';
                    statusTag.style.color = '#00ffcc';
                    renderPlaylist();
                } catch (e) {
                    playTrack(currentIndex);
                }
            } else {
                audio.pause();
                isPlaying = false;
                playPauseBtn.textContent = 'ИГРАТЬ ▶';
                playPauseBtn.style.background = '#00ffcc';
                statusTag.textContent = 'ПАУЗА';
                statusTag.style.color = '#ffffff';
                renderPlaylist();
            }
        }

        playPauseBtn.addEventListener('click', togglePlay);

        prevBtn.addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            playTrack(currentIndex);
        });

        nextBtn.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % playlist.length;
            playTrack(currentIndex);
        });

        audio.addEventListener('ended', () => {
            currentIndex = (currentIndex + 1) % playlist.length;
            playTrack(currentIndex);
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = percent + '%';
            }
        });

        progressWrap.addEventListener('click', (e) => {
            if (!audio.duration) return;
            const rect = progressWrap.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            audio.currentTime = (clickX / rect.width) * audio.duration;
        });

        // ========================================================
        // ВИЗУАЛИЗАТОР И ПУЛЬСАЦИЯ ГОЛОВ ПОД БАС
        // ========================================================
        let pulseRadius = 0;

        function renderVisualizer() {
            requestAnimationFrame(renderVisualizer);

            ctx.fillStyle = 'rgba(9, 8, 14, 0.28)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (!analyser || !isPlaying) {
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(0, 255, 204, 0.25)';
                ctx.lineWidth = 2;
                ctx.moveTo(0, canvas.height / 2);
                ctx.lineTo(canvas.width, canvas.height / 2);
                ctx.stroke();
                prevBtn.style.transform = '';
                nextBtn.style.transform = '';
                return;
            }

            analyser.getByteFrequencyData(freqData);
            analyser.getByteTimeDomainData(timeData);

            // Бас
            const bass = (freqData[1] + freqData[2] + freqData[3] + freqData[4]) / 4;
            const normBass = bass / 255;

            // Кач голов от реального баса
            if (normBass > 0.38) {
                const scale = 1 + normBass * 0.35;
                prevBtn.style.transform = `scale(${scale}) rotate(${-11 * normBass}deg)`;
                nextBtn.style.transform = `scale(${scale}) rotate(${11 * normBass}deg)`;
            } else {
                prevBtn.style.transform = 'scale(1) rotate(0deg)';
                nextBtn.style.transform = 'scale(1) rotate(0deg)';
            }

            // Ударная волна
            if (normBass > 0.58) {
                pulseRadius = Math.min(pulseRadius + 22, canvas.width / 2);
                ctx.beginPath();
                ctx.arc(canvas.width / 2, canvas.height / 2, pulseRadius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(0, 255, 204, ${normBass * 0.5})`;
                ctx.lineWidth = 4;
                ctx.stroke();
            } else {
                pulseRadius = Math.max(0, pulseRadius - 14);
            }

            // Осциллограф волны
            ctx.lineWidth = 3;
            ctx.beginPath();
            const sliceWidth = canvas.width / timeData.length;
            let x = 0;

            for (let i = 0; i < timeData.length; i++) {
                const v = timeData[i] / 128.0;
                const y = (v * canvas.height) / 2;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
                x += sliceWidth;
            }
            ctx.strokeStyle = '#00ffcc';
            ctx.shadowBlur = 14;
            ctx.shadowColor = '#00ffcc';
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Столбики эквалайзера WMP
            const barCount = 42;
            const barWidth = canvas.width / barCount;
            for (let i = 0; i < barCount; i++) {
                const val = freqData[i * 2] || 0;
                const barHeight = (val / 255) * (canvas.height * 0.33);

                ctx.fillStyle = `rgba(255, 0, 128, 0.4)`;
                ctx.fillRect(i * barWidth, 0, barWidth - 3, barHeight);

                ctx.fillStyle = `rgba(0, 255, 204, 0.45)`;
                ctx.fillRect(i * barWidth, canvas.height - barHeight, barWidth - 3, barHeight);
            }
        }

        renderPlaylist();
        renderVisualizer();
        audio.src = playlist[0].file;
    </script>
</body>
</html>
