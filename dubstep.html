<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAGUSH — DUBSTEP</title>
    <!-- Подключение шрифта Stalinist One -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Stalinist+One&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #06050a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Stalinist One', cursive, sans-serif;
            color: #fff;
            overflow: hidden;
            user-select: none;
            padding: 20px;
        }

        /* Фоновый холст визуализаторов */
        #bgCanvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* Верхняя консоль управления */
        .top-nav {
            position: fixed;
            top: 15px;
            left: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            pointer-events: none;
        }

        .top-left-group, .top-right-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(25, 27, 34, 0.65);
            backdrop-filter: blur(8px);
            border: none;
            padding: 6px;
            border-radius: 4px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.6);
            pointer-events: auto;
        }

        .nav-btn {
            color: #ffffff;
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 0.04em;
            padding: 8px 14px;
            border: none;
            border-radius: 3px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.15s ease;
            font-family: inherit;
        }

        /* Кнопка выхода на главный стол */
        .btn-exit {
            background: #d63031;
            color: #ffffff;
        }

        /* Кнопка свой трек — серая */
        .btn-upload {
            background: #555a64;
            color: #ffffff;
        }

        .nav-btn:hover {
            opacity: 0.88;
            transform: translateY(-2px);
        }

        /* Селектор визуализаторов */
        .vis-switcher {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.45);
            padding: 4px 10px;
            border-radius: 3px;
        }

        .vis-btn {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            padding: 4px 10px;
            font-size: 12px;
            font-family: inherit;
            transition: background 0.15s ease;
        }
        .vis-btn:hover {
            background: #00ffcc;
            color: #000;
        }

        .vis-label {
            font-size: 10px;
            min-width: 210px;
            text-align: center;
            letter-spacing: 0.04em;
            color: #00ffcc;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.5);
        }

        /* Главная сцена с головами */
        .stage {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(15px, 4vw, 55px);
            width: 100%;
            max-width: 1100px;
        }

        /* Интерактивные головы */
        .head-btn {
            position: relative;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            outline: none;
            width: clamp(90px, 12vw, 150px);
            aspect-ratio: 1 / 1.2;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-origin: center bottom;
            transition: transform 0.1s ease;
        }

        .head-btn img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            pointer-events: none;
            filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.85));
            transition: filter 0.2s ease;
        }

        #prevBtn img { animation: breatheLeft 3s ease-in-out infinite; }
        #nextBtn img { animation: breatheRight 3s ease-in-out infinite; }

        @keyframes breatheLeft {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-5px) rotate(1deg); }
        }
        @keyframes breatheRight {
            0%, 100% { transform: translateY(0) rotate(2deg); }
            50% { transform: translateY(-5px) rotate(-1deg); }
        }

        #prevBtn:hover img {
            animation: wobbleHoverLeft 0.4s ease-in-out infinite alternate !important;
            filter: drop-shadow(0 0 18px #00ffcc) drop-shadow(0 8px 12px rgba(0,0,0,0.9));
        }

        #nextBtn:hover img {
            animation: wobbleHoverRight 0.4s ease-in-out infinite alternate !important;
            filter: drop-shadow(0 0 18px #00ffcc) drop-shadow(0 8px 12px rgba(0,0,0,0.9));
        }

        @keyframes wobbleHoverLeft {
            0% { transform: scale(1.15) rotate(-10deg) translateY(-4px); }
            100% { transform: scale(1.22) rotate(3deg) translateY(-10px); }
        }

        @keyframes wobbleHoverRight {
            0% { transform: scale(1.15) rotate(10deg) translateY(-4px); }
            100% { transform: scale(1.22) rotate(-3deg) translateY(-10px); }
        }

        .head-btn:active img {
            transform: scale(0.82, 1.25) translateY(12px) !important;
            filter: drop-shadow(0 0 25px #ffffff) !important;
            transition: transform 0.05s ease;
        }

        .head-hint {
            position: absolute;
            top: -26px;
            background: rgba(18, 20, 26, 0.85);
            color: #ffffff;
            border: none;
            border-radius: 3px;
            font-size: 10px;
            letter-spacing: 0.04em;
            padding: 4px 8px;
            white-space: nowrap;
            transition: transform 0.15s ease, background 0.15s ease;
        }

        .head-btn:hover .head-hint {
            background: #00ffcc;
            color: #000;
            transform: scale(1.1) translateY(-3px);
        }

        /* Панель плеера (Полупрозрачная, крупнее на ПК, без обводок) */
        .player-panel {
            background: rgba(18, 21, 28, 0.38); /* Еле заметная полупрозрачность для эффектов */
            backdrop-filter: blur(14px) saturate(180%);
            -webkit-backdrop-filter: blur(14px) saturate(180%);
            border: none;
            border-radius: 8px;
            box-shadow: 0 16px 38px rgba(0, 0, 0, 0.7);
            width: min(560px, 94vw); /* Сделали больше на ПК */
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .player-header {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            border-radius: 4px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            letter-spacing: 0.04em;
            color: #fff;
        }

        .player-status-tag {
            background: #00ffcc;
            color: #000000;
            padding: 3px 7px;
            font-size: 9px;
            border-radius: 2px;
        }

        .progress-bar-wrap {
            width: 100%;
            height: 14px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: #00ffcc;
            box-shadow: 0 0 10px #00ffcc;
            border: none;
        }

        .tracks-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 240px;
            overflow-y: auto;
            padding: 2px 4px 2px 0;
        }

        .tracks-list::-webkit-scrollbar {
            width: 6px;
        }
        .tracks-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }
        .tracks-list::-webkit-scrollbar-thumb {
            background: #00ffcc;
            border-radius: 3px;
        }

        .track-item {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            border-radius: 4px;
            padding: 10px 12px;
            font-size: 10px;
            letter-spacing: 0.04em;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.15s ease;
        }

        .track-item:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateX(4px);
        }

        .track-item.active {
            background: #00ffcc;
            color: #000000;
            box-shadow: 0 0 14px rgba(0, 255, 204, 0.4);
        }

        .track-num {
            font-size: 9px;
            opacity: 0.7;
            margin-right: 8px;
        }

        .play-btn {
            background: #00ffcc;
            color: #000000;
            border: none;
            border-radius: 4px;
            padding: 12px;
            font-family: inherit;
            font-size: 12px;
            letter-spacing: 0.06em;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.15s ease;
            width: 100%;
        }

        .play-btn:hover {
            background: #33ffd6;
            transform: translateY(-2px);
        }

        /* ========================================================
           АДАПТАЦИЯ ПОД ТЕЛЕФОН: ПЛАШКА СВЕРХУ, ГОЛОВЫ ВНИЗУ
           ======================================================== */
        @media (max-width: 750px) {
            body {
                overflow-y: auto;
                justify-content: flex-start;
                padding-top: 130px;
                padding-bottom: 30px;
            }
            .top-nav {
                flex-direction: column;
                align-items: stretch;
                top: 10px;
                left: 10px;
                right: 10px;
            }
            .stage {
                flex-direction: column; /* Плашка сверху, головы снизу */
                gap: 20px;
            }
            .player-panel {
                order: 1; /* Плашка идёт первой */
                width: 100%;
            }
            /* Кнопки-головы идут снизу в аккуратный ряд */
            #prevBtn {
                order: 2;
                width: 95px;
            }
            #nextBtn {
                order: 3;
                width: 95px;
            }
            .stage {
                display: grid;
                grid-template-areas: 
                    "player player"
                    "prev next";
                justify-items: center;
                gap: 15px;
            }
            .player-panel { grid-area: player; }
            #prevBtn { grid-area: prev; }
            #nextBtn { grid-area: next; }

            .vis-label {
                min-width: 150px;
                font-size: 9px;
            }
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <!-- Верхний тулбар -->
    <div class="top-nav">
        <div class="top-left-group">
            <a href="index.html" class="nav-btn btn-exit">← НА СТОЛ</a>
            <button id="uploadBtn" class="nav-btn btn-upload" type="button">+ СВОЙ ТРЕК</button>
            <input type="file" id="fileInput" accept="audio/*" multiple style="display: none;">
        </div>

        <div class="top-right-group">
            <div class="vis-switcher">
                <button class="vis-btn" id="prevVisBtn" type="button">◄</button>
                <span class="vis-label" id="visNameLabel">01. WMP CLASSIC</span>
                <button class="vis-btn" id="nextVisBtn" type="button">►</button>
            </div>
        </div>
    </div>

    <div class="stage">
        <!-- Предыдущий трек -->
        <button id="prevBtn" class="head-btn" title="Предыдущий трек" type="button">
            <span class="head-hint">◄ НАЗАД</span>
            <img src="face4.png" alt="Назад" onerror="this.src='face.png'">
        </button>

        <!-- Плеер -->
        <div class="player-panel">
            <div class="player-header">
                <span>DUBSTEP // WMP_ULTRA</span>
                <span class="player-status-tag" id="statusTag">ГОТОВ</span>
            </div>

            <div class="progress-bar-wrap" id="progressWrap">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>

            <div class="tracks-list" id="tracksContainer"></div>

            <button id="playPauseBtn" class="play-btn" type="button">ИГРАТЬ ▶</button>
        </div>

        <!-- Следующий трек -->
        <button id="nextBtn" class="head-btn" title="Следующий трек" type="button">
            <span class="head-hint">ВПЕРЁД ►</span>
            <img src="face3.png" alt="Вперёд" onerror="this.src='face.png'">
        </button>
    </div>

    <audio id="audio" preload="metadata"></audio>

    <script>
        const playlist = [
            { title: "ANGRY BIRDS", file: "dubstep/angry-birds.mp3" },
            { title: "TRACK 1", file: "dubstep/track1.mp3" },
            { title: "TRACK 2", file: "dubstep/track2.mp3" },
            { title: "TRACK 3", file: "dubstep/track3.mp3" },
            { title: "TRACK 4", file: "dubstep/track4.mp3" },
            { title: "TRACK 5", file: "dubstep/track5.mp3" },
            { title: "TRACK 6", file: "dubstep/track6.mp3" },
            { title: "TRACK 7", file: "dubstep/track7.mp3" }
        ];

        let currentIndex = 0;
        let isPlaying = false;

        // СПИСОК ВИЗУАЛИЗАТОРОВ С НОВЫМИ ОРГАНИЧЕСКИМИ ЦЕЛЬНЫМИ ФОРМАМИ
        const visualModes = [
            { id: 0, name: "01. WMP CLASSIC" },
            { id: 1, name: "02. LIQUID MARBLE" },      // Скрин 3: Масляные психоделические разводы
            { id: 2, name: "03. SMOKE VORTEX" },       // Скрин 1: Клубящийся органический туман
            { id: 3, name: "04. SUPERNOVA CORONA" },   // Скрин 2: Пылающее сферическое ядро с короной
            { id: 4, name: "05. METABALL LAVA" },      // Плотные сливающиеся капли лавы
            { id: 5, name: "06. AMBIENCE PLASMA" },    // Плазменный шторм
            { id: 6, name: "07. HYPNO VORTEX" },       // Воронка
            { id: 7, name: "08. BATTERY BLOSSOM" },    // Клубок Battery
            { id: 8, name: "09. WHITECAP TUNNEL" },    // Тоннель
            { id: 9, name: "10. SILK STRING MOIRÉ" },  // Шелковые волны
            { id: 10, name: "11. WINAMP TOWERS" },     // Башни эквалайзера
            { id: 11, name: "12. RADAR SONAR" },       // Радар
            { id: 12, name: "13. DUBSTEP BOMB" },      // Орбитальные вспышки
            { id: 13, name: "14. RGB GLITCH SEISMIC" } // Сейсмический глитч
        ];
        let currentVisIndex = 0;

        const audio = document.getElementById('audio');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const tracksContainer = document.getElementById('tracksContainer');
        const progressFill = document.getElementById('progressFill');
        const progressWrap = document.getElementById('progressWrap');
        const statusTag = document.getElementById('statusTag');

        const uploadBtn = document.getElementById('uploadBtn');
        const fileInput = document.getElementById('fileInput');
        const prevVisBtn = document.getElementById('prevVisBtn');
        const nextVisBtn = document.getElementById('nextVisBtn');
        const visNameLabel = document.getElementById('visNameLabel');

        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function renderPlaylist() {
            tracksContainer.innerHTML = '';
            playlist.forEach((track, idx) => {
                const item = document.createElement('div');
                item.className = 'track-item' + (idx === currentIndex ? ' active' : '');
                item.innerHTML = `
                    <div style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding-right:8px;">
                        <span class="track-num">${idx + 1 < 10 ? '0' + (idx + 1) : idx + 1}</span>
                        <span>${track.title}</span>
                    </div>
                    <span style="font-size:9px; flex-shrink:0;">${idx === currentIndex && isPlaying ? '● ИГРАЕТ' : ''}</span>
                `;
                item.addEventListener('click', () => {
                    currentIndex = idx;
                    playTrack(currentIndex);
                });
                tracksContainer.appendChild(item);
            });
        }

        // Загрузка треков пользователя
        uploadBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            files.forEach(file => {
                const url = URL.createObjectURL(file);
                const cleanName = file.name.replace(/\.[^/.]+$/, "").toUpperCase();
                playlist.push({
                    title: "★ " + cleanName,
                    file: url
                });
            });

            currentIndex = playlist.length - files.length;
            renderPlaylist();
            playTrack(currentIndex);
            fileInput.value = '';
        });

        function updateVisLabel() {
            visNameLabel.textContent = visualModes[currentVisIndex].name;
        }

        prevVisBtn.addEventListener('click', () => {
            currentVisIndex = (currentVisIndex - 1 + visualModes.length) % visualModes.length;
            updateVisLabel();
        });

        nextVisBtn.addEventListener('click', () => {
            currentVisIndex = (currentVisIndex + 1) % visualModes.length;
            updateVisLabel();
        });

        // ========================================================
        // WEB AUDIO API
        // ========================================================
        let audioCtx = null;
        let analyser = null;
        let freqData, timeData;

        function initAudioEngine() {
            if (!audioCtx) {
                try {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioContextClass();
                    analyser = audioCtx.createAnalyser();
                    analyser.fftSize = 256;

                    const sourceNode = audioCtx.createMediaElementSource(audio);
                    sourceNode.connect(analyser);
                    analyser.connect(audioCtx.destination);

                    freqData = new Uint8Array(analyser.frequencyBinCount);
                    timeData = new Uint8Array(analyser.frequencyBinCount);
                } catch (e) {
                    console.warn("Visualizer audio context:", e);
                }
            }

            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        async function playTrack(idx) {
            initAudioEngine();
            currentIndex = idx;
            const targetFile = playlist[currentIndex].file;

            audio.src = targetFile;

            try {
                statusTag.textContent = 'ЗАГРУЗКА';
                statusTag.style.background = '#f1c40f';

                await audio.play();
                isPlaying = true;
                playPauseBtn.textContent = 'ПАУЗА ||';
                playPauseBtn.style.background = '#ffffff';
                statusTag.textContent = 'ИГРАЕТ';
                statusTag.style.background = '#00ffcc';
                renderPlaylist();
            } catch (err) {
                console.error("Playback error:", err);
            }
        }

        audio.addEventListener('error', () => {
            statusTag.textContent = 'ОШИБКА 404';
            statusTag.style.background = '#ff5252';
            isPlaying = false;
            playPauseBtn.textContent = 'ИГРАТЬ ▶';
            playPauseBtn.style.background = '#00ffcc';
            renderPlaylist();
        });

        async function togglePlay() {
            initAudioEngine();

            if (!audio.src || audio.src === "" || audio.src === window.location.href) {
                playTrack(currentIndex);
                return;
            }

            if (audio.paused) {
                try {
                    await audio.play();
                    isPlaying = true;
                    playPauseBtn.textContent = 'ПАУЗА ||';
                    playPauseBtn.style.background = '#ffffff';
                    statusTag.textContent = 'ИГРАЕТ';
                    statusTag.style.background = '#00ffcc';
                    renderPlaylist();
                } catch (e) {
                    playTrack(currentIndex);
                }
            } else {
                audio.pause();
                isPlaying = false;
                playPauseBtn.textContent = 'ИГРАТЬ ▶';
                playPauseBtn.style.background = '#00ffcc';
                statusTag.textContent = 'ПАУЗА';
                statusTag.style.background = '#ffffff';
                renderPlaylist();
            }
        }

        playPauseBtn.addEventListener('click', togglePlay);

        prevBtn.addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            playTrack(currentIndex);
        });

        nextBtn.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % playlist.length;
            playTrack(currentIndex);
        });

        audio.addEventListener('ended', () => {
            currentIndex = (currentIndex + 1) % playlist.length;
            playTrack(currentIndex);
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = percent + '%';
            }
        });

        progressWrap.addEventListener('click', (e) => {
            if (!audio.duration) return;
            const rect = progressWrap.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            audio.currentTime = (clickX / rect.width) * audio.duration;
        });

        // ========================================================
        // ДАННЫЕ ДЛЯ МЕТАБОЛЛОВ И ЧАСТИЦ
        // ========================================================
        const metaballs = [];
        for (let i = 0; i < 18; i++) {
            metaballs.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                vx: (Math.random() - 0.5) * 3,
                vy: (Math.random() - 0.5) * 3,
                baseR: 50 + Math.random() * 60,
                color: i % 3 === 0 ? '#ff0055' : (i % 3 === 1 ? '#00ffcc' : '#f1c40f')
            });
        }

        const peakBars = new Array(48).fill(0);
        let pulseRadius = 0;
        let globalTick = 0;

        // ========================================================
        // ОСНОВНОЙ ЦИКЛ ОТРИСОВКИ
        // ========================================================
        function renderVisualizer() {
            requestAnimationFrame(renderVisualizer);
            globalTick += 0.025;

            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = 'rgba(6, 5, 10, 0.28)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (!analyser || !isPlaying) {
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(0, 255, 204, 0.2)';
                ctx.lineWidth = 2;
                ctx.moveTo(0, canvas.height / 2);
                ctx.lineTo(canvas.width, canvas.height / 2);
                ctx.stroke();
                prevBtn.style.transform = '';
                nextBtn.style.transform = '';
                return;
            }

            analyser.getByteFrequencyData(freqData);
            analyser.getByteTimeDomainData(timeData);

            const bass = (freqData[1] + freqData[2] + freqData[3] + freqData[4]) / 4;
            const normBass = bass / 255;

            // Кач голов в такт
            if (normBass > 0.38) {
                const scale = 1 + normBass * 0.36;
                prevBtn.style.transform = `scale(${scale}) rotate(${-11 * normBass}deg)`;
                nextBtn.style.transform = `scale(${scale}) rotate(${11 * normBass}deg)`;
            } else {
                prevBtn.style.transform = 'scale(1) rotate(0deg)';
                nextBtn.style.transform = 'scale(1) rotate(0deg)';
            }

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            switch (currentVisIndex) {
                // ----------------------------------------------------
                // 01. WMP CLASSIC
                // ----------------------------------------------------
                case 0: {
                    if (normBass > 0.58) {
                        pulseRadius = Math.min(pulseRadius + 22, canvas.width / 2);
                        ctx.beginPath();
                        ctx.arc(cx, cy, pulseRadius, 0, Math.PI * 2);
                        ctx.strokeStyle = `rgba(0, 255, 204, ${normBass * 0.5})`;
                        ctx.lineWidth = 4;
                        ctx.stroke();
                    } else {
                        pulseRadius = Math.max(0, pulseRadius - 14);
                    }

                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    const slice = canvas.width / timeData.length;
                    let x = 0;
                    for (let i = 0; i < timeData.length; i++) {
                        const v = timeData[i] / 128.0;
                        const y = (v * canvas.height) / 2;
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                        x += slice;
                    }
                    ctx.strokeStyle = '#00ffcc';
                    ctx.stroke();

                    const count = 42;
                    const bw = canvas.width / count;
                    for (let i = 0; i < count; i++) {
                        const val = freqData[i * 2] || 0;
                        const bh = (val / 255) * (canvas.height * 0.33);
                        ctx.fillStyle = `rgba(255, 0, 128, 0.4)`;
                        ctx.fillRect(i * bw, 0, bw - 2, bh);
                        ctx.fillStyle = `rgba(0, 255, 204, 0.45)`;
                        ctx.fillRect(i * bw, canvas.height - bh, bw - 2, bh);
                    }
                    break;
                }

                // ----------------------------------------------------
                // 02. LIQUID MARBLE (СКРИНШОТ 3: Масляные психоделические разводы)
                // ----------------------------------------------------
                case 1: {
                    ctx.globalCompositeOperation = 'lighter';
                    const layers = 16;
                    for (let l = 0; l < layers; l++) {
                        const f = freqData[(l * 7) % freqData.length] / 255;
                        const amp = 60 + f * 140;
                        const speed = globalTick * 1.2 + l * 0.4;

                        ctx.beginPath();
                        ctx.moveTo(0, canvas.height);
                        for (let x = 0; x <= canvas.width; x += 35) {
                            const y = cy + Math.sin(x * 0.005 + speed) * amp + 
                                           Math.cos(x * 0.009 - speed * 0.6) * (amp * 0.7);
                            ctx.lineTo(x, y);
                        }
                        ctx.lineTo(canvas.width, canvas.height);
                        ctx.closePath();

                        // Яркие психоделические цвета со скриншота (пурпур, ядовито-зеленый, красный)
                        const hues = [310, 120, 10, 280, 140, 350];
                        const hue = hues[l % hues.length];
                        ctx.fillStyle = `hsla(${hue}, 100%, 50%, ${0.28 + normBass * 0.2})`;
                        ctx.fill();
                    }
                    break;
                }

                // ----------------------------------------------------
                // 03. SMOKE VORTEX (СКРИНШОТ 1: Клубящийся органический туман WMP)
                // ----------------------------------------------------
                case 2: {
                    ctx.globalCompositeOperation = 'screen';
                    const blobs = 32;
                    const maxR = Math.min(cx, cy) * (0.8 + normBass * 0.5);

                    for (let i = 0; i < blobs; i++) {
                        const angle = (i / blobs) * Math.PI * 2 + globalTick * 0.6;
                        const f = freqData[(i * 3) % freqData.length] / 255;
                        const dist = (f * maxR * 0.7) + (Math.sin(globalTick + i) * 30);
                        
                        const bx = cx + Math.cos(angle) * dist;
                        const by = cy + Math.sin(angle) * dist;
                        const radius = 60 + f * 120 + normBass * 50;

                        const grad = ctx.createRadialGradient(bx, by, 0, bx, by, radius);
                        // Зелено-дымчатая органическая палитра WMP
                        grad.addColorStop(0, `rgba(120, 255, 60, ${0.45 + normBass * 0.3})`);
                        grad.addColorStop(0.5, `rgba(40, 160, 40, ${0.25 + normBass * 0.2})`);
                        grad.addColorStop(1, 'transparent');

                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(bx, by, radius, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    break;
                }

                // ----------------------------------------------------
                // 04. SUPERNOVA CORONA (СКРИНШОТ 2: Пылающее ядро с ореолом)
                // ----------------------------------------------------
                case 3: {
                    ctx.globalCompositeOperation = 'lighter';
                    const coreR = 60 + normBass * 90;

                    // Объемные световые лучи
                    const rayCount = 48;
                    for (let r = 0; r < rayCount; r++) {
                        const angle = (r / rayCount) * Math.PI * 2 + (globalTick * 0.2);
                        const f = freqData[r % freqData.length] / 255;
                        const rayLen = coreR + 80 + f * 220;

                        const rx = cx + Math.cos(angle) * rayLen;
                        const ry = cy + Math.sin(angle) * rayLen;

                        ctx.beginPath();
                        ctx.moveTo(cx, cy);
                        ctx.lineTo(rx, ry);
                        ctx.strokeStyle = `rgba(180, 255, 80, ${0.25 + f * 0.5})`;
                        ctx.lineWidth = 4 + normBass * 6;
                        ctx.stroke();
                    }

                    // Центральная светящаяся сфера
                    const grad = ctx.createRadialGradient(cx, cy, 5, cx, cy, coreR * 1.8);
                    grad.addColorStop(0, '#ffffff');
                    grad.addColorStop(0.2, '#fffb96');
                    grad.addColorStop(0.5, '#76ff03');
                    grad.addColorStop(0.8, '#00b0ff');
                    grad.addColorStop(1, 'transparent');

                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(cx, cy, coreR * 1.8, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                }

                // ----------------------------------------------------
                // 05. METABALL LAVA (Плотные сливающиеся капли лавы)
                // ----------------------------------------------------
                case 4: {
                    ctx.globalCompositeOperation = 'lighter';
                    metaballs.forEach((b, idx) => {
                        const f = freqData[(idx * 6) % freqData.length] / 255;
                        b.x += b.vx * (1 + normBass * 2);
                        b.y += b.vy * (1 + normBass * 2);

                        if (b.x < 0 || b.x > canvas.width) b.vx *= -1;
                        if (b.y < 0 || b.y > canvas.height) b.vy *= -1;

                        const curR = b.baseR + f * 70 + normBass * 40;
                        const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, curR);
                        grad.addColorStop(0, b.color);
                        grad.addColorStop(0.7, b.color);
                        grad.addColorStop(1, 'transparent');

                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(b.x, b.y, curR, 0, Math.PI * 2);
                        ctx.fill();
                    });
                    break;
                }

                // ----------------------------------------------------
                // 06. AMBIENCE PLASMA
                // ----------------------------------------------------
                case 5: {
                    ctx.globalCompositeOperation = 'lighter';
                    const rays = 65;
                    const rBase = 80 + normBass * 90;

                    for (let i = 0; i < rays; i++) {
                        const angle = (i / rays) * Math.PI * 2 + globalTick * 0.5;
                        const f = freqData[i % freqData.length] || 10;
                        const r = rBase + (f / 255) * (Math.min(cx, cy) * 0.85);

                        const x1 = cx + Math.cos(angle) * rBase;
                        const y1 = cy + Math.sin(angle) * rBase;
                        const x2 = cx + Math.cos(angle) * r;
                        const y2 = cy + Math.sin(angle) * r;

                        const hue = (i * 4 + globalTick * 50) % 60;
                        ctx.strokeStyle = `hsla(${hue}, 100%, 55%, 0.6)`;
                        ctx.lineWidth = 4 + normBass * 5;
                        ctx.beginPath();
                        ctx.moveTo(x1, y1);
                        ctx.quadraticCurveTo(
                            cx + Math.cos(angle + 0.3) * (r * 0.7),
                            cy + Math.sin(angle + 0.3) * (r * 0.7),
                            x2, y2
                        );
                        ctx.stroke();
                    }
                    break;
                }

                // ----------------------------------------------------
                // 07. HYPNO VORTEX
                // ----------------------------------------------------
                case 6: {
                    ctx.globalCompositeOperation = 'lighter';
                    const arms = 6;
                    const steps = 110;
                    const twist = 4 + normBass * 6;

                    for (let a = 0; a < arms; a++) {
                        const baseAngle = (a / arms) * Math.PI * 2 + globalTick;
                        ctx.beginPath();
                        for (let s = 0; s < steps; s++) {
                            const p = s / steps;
                            const r = p * Math.max(cx, cy) * 1.3;
                            const angle = baseAngle + p * twist;
                            const val = freqData[s % freqData.length] / 255;
                            const wobble = Math.sin(p * 15 + globalTick * 3) * (val * 40);

                            const x = cx + Math.cos(angle) * (r + wobble);
                            const y = cy + Math.sin(angle) * (r + wobble);

                            if (s === 0) ctx.moveTo(x, y);
                            else ctx.lineTo(x, y);
                        }
                        ctx.strokeStyle = a % 2 === 0 ? '#ff1100' : '#ff7700';
                        ctx.lineWidth = 3 + normBass * 6;
                        ctx.stroke();
                    }
                    break;
                }

                // ----------------------------------------------------
                // 08. BATTERY BLOSSOM
                // ----------------------------------------------------
                case 7: {
                    ctx.globalCompositeOperation = 'lighter';
                    const petals = 7;
                    const points = 220;
                    const rad = Math.min(cx, cy) * 0.7;

                    ctx.beginPath();
                    for (let i = 0; i <= points; i++) {
                        const theta = (i / points) * Math.PI * 2;
                        const f = freqData[i % freqData.length] / 255;
                        const r = rad * Math.sin(petals * theta + globalTick) * (0.8 + normBass * 0.4) + f * 45;
                        const x = cx + Math.cos(theta * 2 + globalTick * 0.5) * r;
                        const y = cy + Math.sin(theta * 3 + globalTick * 0.7) * r;

                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.strokeStyle = `hsl(${(globalTick * 40) % 360}, 100%, 65%)`;
                    ctx.lineWidth = 2.5;
                    ctx.stroke();
                    break;
                }

                // ----------------------------------------------------
                // 09. WHITECAP TUNNEL
                // ----------------------------------------------------
                case 8: {
                    ctx.globalCompositeOperation = 'lighter';
                    const rings = 14;
                    for (let r = 0; r < rings; r++) {
                        const p = (r + (globalTick * 1.5) % 1) / rings;
                        const rad = Math.pow(p, 2) * Math.max(cx, cy) * 1.4;
                        const nodes = 36;

                        ctx.beginPath();
                        for (let n = 0; n <= nodes; n++) {
                            const angle = (n / nodes) * Math.PI * 2;
                            const f = freqData[(n * 2) % freqData.length] / 255;
                            const wave = Math.sin(angle * 6 + globalTick * 4) * (20 + f * 40 * p);
                            const currentR = rad + wave;

                            const x = cx + Math.cos(angle) * currentR;
                            const y = cy + Math.sin(angle) * currentR;

                            if (n === 0) ctx.moveTo(x, y);
                            else ctx.lineTo(x, y);
                        }
                        const hue = (110 + r * 15 + globalTick * 60) % 360;
                        ctx.strokeStyle = `hsla(${hue}, 100%, 60%, ${p * 0.85})`;
                        ctx.lineWidth = 2.5 + p * 3;
                        ctx.stroke();
                    }
                    break;
                }

                // ----------------------------------------------------
                // 10. SILK STRING MOIRÉ
                // ----------------------------------------------------
                case 9: {
                    ctx.globalCompositeOperation = 'lighter';
                    const lines = 8;
                    const segments = 90;
                    const step = canvas.width / segments;

                    for (let l = 0; l < lines; l++) {
                        ctx.beginPath();
                        const phase = globalTick * 2 + l * 0.35;
                        const freqIdx = (l * 6) % freqData.length;
                        const amp = 40 + (freqData[freqIdx] / 255) * 160;

                        for (let s = 0; s <= segments; s++) {
                            const x = s * step;
                            const y = cy + Math.sin(s * 0.08 + phase) * amp * Math.cos(s * 0.03 + phase * 0.5);
                            if (s === 0) ctx.moveTo(x, y);
                            else ctx.lineTo(x, y);
                        }

                        const hue = (160 + l * 20 + globalTick * 30) % 360;
                        ctx.strokeStyle = `hsla(${hue}, 100%, 60%, 0.45)`;
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                    break;
                }

                // ----------------------------------------------------
                // 11. WINAMP TOWERS
                // ----------------------------------------------------
                case 10: {
                    const count = 44;
                    const barW = canvas.width / count;
                    for (let i = 0; i < count; i++) {
                        const val = freqData[i * 2] || 0;
                        const h = (val / 255) * (canvas.height * 0.7);

                        if (h > peakBars[i]) peakBars[i] = h;
                        else peakBars[i] = Math.max(0, peakBars[i] - 3.5);

                        const grad = ctx.createLinearGradient(0, canvas.height, 0, canvas.height - h);
                        grad.addColorStop(0, '#00ffcc');
                        grad.addColorStop(0.7, '#f1c40f');
                        grad.addColorStop(1, '#ff0055');

                        ctx.fillStyle = grad;
                        ctx.fillRect(i * barW + 2, canvas.height - h, barW - 4, h);

                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(i * barW + 2, canvas.height - peakBars[i] - 4, barW - 4, 3);
                    }
                    break;
                }

                // ----------------------------------------------------
                // 12. RADAR SONAR
                // ----------------------------------------------------
                case 11: {
                    const radius = Math.min(cx, cy) * 0.4 + normBass * 30;
                    ctx.beginPath();
                    ctx.moveTo(cx, cy);
                    ctx.arc(cx, cy, radius * 1.8, globalTick * 2, globalTick * 2 + 0.35);
                    ctx.closePath();
                    ctx.fillStyle = 'rgba(0, 255, 204, 0.08)';
                    ctx.fill();

                    const points = 64;
                    ctx.beginPath();
                    for (let i = 0; i < points; i++) {
                        const angle = (i / points) * Math.PI * 2;
                        const val = freqData[i % freqData.length] || 0;
                        const len = radius + (val / 255) * 130;

                        const x1 = cx + Math.cos(angle) * radius;
                        const y1 = cy + Math.sin(angle) * radius;
                        const x2 = cx + Math.cos(angle) * len;
                        const y2 = cy + Math.sin(angle) * len;

                        ctx.strokeStyle = i % 2 === 0 ? '#00ffcc' : '#ff007f';
                        ctx.lineWidth = 3;
                        ctx.moveTo(x1, y1);
                        ctx.lineTo(x2, y2);
                    }
                    ctx.stroke();
                    break;
                }

                // ----------------------------------------------------
                // 13. DUBSTEP BOMB
                // ----------------------------------------------------
                case 12: {
                    for (let i = 0; i < 40; i++) {
                        const angle = (i / 40) * Math.PI * 2 + globalTick;
                        const f = freqData[i % freqData.length] / 255;
                        const dist = (f * Math.min(cx, cy) * 0.8) + (normBass * 50);

                        ctx.beginPath();
                        ctx.arc(cx + Math.cos(angle) * dist, cy + Math.sin(angle) * dist, 6 + normBass * 14, 0, Math.PI * 2);
                        ctx.fillStyle = i % 2 === 0 ? '#00ffcc' : '#ff007f';
                        ctx.fill();
                    }
                    break;
                }

                // ----------------------------------------------------
                // 14. RGB GLITCH SEISMIC
                // ----------------------------------------------------
                case 13: {
                    const colors = ['#ff0055', '#00ffcc', '#ffffff'];
                    const offsets = [-4, 0, 4];

                    const shakeX = normBass > 0.6 ? (Math.random() - 0.5) * 16 : 0;
                    const shakeY = normBass > 0.6 ? (Math.random() - 0.5) * 16 : 0;

                    for (let c = 0; c < colors.length; c++) {
                        ctx.beginPath();
                        ctx.strokeStyle = colors[c];
                        ctx.lineWidth = 3;
                        const slice = canvas.width / timeData.length;
                        let x = 0;

                        for (let i = 0; i < timeData.length; i++) {
                            const v = timeData[i] / 128.0;
                            const y = ((v * canvas.height) / 2) + offsets[c] * (normBass * 5) + shakeY;
                            if (i === 0) ctx.moveTo(x + shakeX, y);
                            else ctx.lineTo(x + shakeX, y);
                            x += slice;
                        }
                        ctx.stroke();
                    }
                    break;
                }
            }
        }

        renderPlaylist();
        renderVisualizer();
        audio.src = playlist[0].file;
    </script>
</body>
