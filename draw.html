<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAGUSH — РИСОВАТЬ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            image-rendering: pixelated;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #2b2118;
            background-image: url('stol.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            padding: 10px;
            overflow-y: auto; /* Позволяет прокручивать страницу на мобильных до палитры */
            touch-action: pan-y;
            user-select: none;
        }

        /* Общий стиль пиксельного рамки и углов (Pixel-art UI) */
        .pixel-box {
            background: #ffffff;
            border: 3px solid #000;
            /* Ступенчатые пиксельные скругления углов */
            clip-path: polygon(
                0 4px, 2px 4px, 2px 2px, 4px 2px, 4px 0,
                calc(100% - 4px) 0, calc(100% - 4px) 2px, calc(100% - 2px) 2px, calc(100% - 2px) 4px, 100% 4px,
                100% calc(100% - 4px), calc(100% - 2px) calc(100% - 4px), calc(100% - 2px) calc(100% - 2px), calc(100% - 4px) calc(100% - 2px), calc(100% - 4px) 100%,
                4px 100%, 4px calc(100% - 2px), 2px calc(100% - 2px), 2px calc(100% - 4px), 0 calc(100% - 4px)
            );
            box-shadow: 4px 4px 0 #000;
        }

        /* Верхняя панель */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 12px;
            z-index: 10;
            max-width: 98vw;
        }

        /* Пиксельные кнопки с визуальным объемом и угловой резьбой */
        .tool-btn {
            background: #fff;
            border: 2px solid #000;
            font-weight: 900;
            font-size: 11px;
            letter-spacing: 0.03em;
            padding: 6px 10px;
            cursor: pointer;
            box-shadow: 3px 3px 0 #000;
            text-decoration: none;
            color: #000;
            display: flex;
            align-items: center;
            gap: 4px;
            position: relative;
            /* Пиксельный угол на кнопке */
            clip-path: polygon(
                0 2px, 2px 2px, 2px 0,
                calc(100% - 2px) 0, calc(100% - 2px) 2px, 100% 2px,
                100% calc(100% - 2px), calc(100% - 2px) calc(100% - 2px), calc(100% - 2px) 100%,
                2px 100%, 2px calc(100% - 2px), 0 calc(100% - 2px)
            );
            transition: background 0.1s;
        }

        .tool-btn:hover:not(:disabled) {
            background: #f0f0f0;
        }

        .tool-btn:active:not(:disabled) {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 #000;
        }

        .tool-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none;
        }

        .tool-btn.active {
            background: #000;
            color: #fff;
            box-shadow: inset 2px 2px 0 #555;
        }

        .back-btn {
            background: #ff5252;
            color: #fff;
        }

        .history-btn {
            background: #f0f0f0;
            font-size: 11px;
        }

        .clear-btn {
            background: #ffecb3;
        }

        .zoom-reset-btn {
            background: #b3e5fc;
        }

        /* Выбор размера пикселя */
        .size-picker {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 900;
            background: #f5f5f5;
            padding: 4px 8px;
            border: 2px solid #000;
            clip-path: polygon(
                0 2px, 2px 2px, 2px 0,
                calc(100% - 2px) 0, calc(100% - 2px) 2px, 100% 2px,
                100% calc(100% - 2px), calc(100% - 2px) calc(100% - 2px), calc(100% - 2px) 100%,
                2px 100%, 2px calc(100% - 2px), 0 calc(100% - 2px)
            );
        }

        .size-picker input {
            cursor: pointer;
            width: 70px;
        }

        /* Контейнер холста с внутренним скроллом при приближении */
        .canvas-container {
            position: relative;
            background: #ffffff;
            border: 4px solid #000;
            box-shadow: 6px 8px 0 rgba(0, 0, 0, 0.45);
            max-width: 95vw;
            max-height: 65vh;
            overflow: auto; /* Включает скроллбар при приближении холста */
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            clip-path: polygon(
                0 6px, 3px 6px, 3px 3px, 6px 3px, 6px 0,
                calc(100% - 6px) 0, calc(100% - 6px) 3px, calc(100% - 3px) 3px, calc(100% - 3px) 6px, 100% 6px,
                100% calc(100% - 6px), calc(100% - 3px) calc(100% - 6px), calc(100% - 3px) calc(100% - 3px), calc(100% - 6px) calc(100% - 3px), calc(100% - 6px) 100%,
                6px 100%, 6px calc(100% - 3px), 3px calc(100% - 3px), 3px calc(100% - 6px), 0 calc(100% - 6px)
            );
        }

        canvas {
            display: block;
            cursor: crosshair;
            background: #ffffff;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            transform-origin: 0 0;
            transition: transform 0.15s ease-out;
            touch-action: none;
        }

        /* Нижняя панель цветов */
        .bottom-palette {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 12px;
            max-width: 98vw;
            flex-wrap: wrap;
            z-index: 10;
            margin-bottom: 20px; /* Отступ снизу для удобного скролла на мобилках */
        }

        .current-color-preview {
            width: 28px;
            height: 28px;
            border: 2px solid #000;
            box-shadow: 2px 2px 0 #000;
            margin-right: 6px;
        }

        .palette-swatches {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .swatch {
            width: 22px;
            height: 22px;
            border: 2px solid #000;
            cursor: pointer;
            clip-path: polygon(
                0 2px, 2px 2px, 2px 0,
                calc(100% - 2px) 0, calc(100% - 2px) 2px, 100% 2px,
                100% calc(100% - 2px), calc(100% - 2px) calc(100% - 2px), calc(100% - 2px) 100%,
                2px 100%, 2px calc(100% - 2px), 0 calc(100% - 2px)
            );
        }

        .swatch:hover {
            transform: scale(1.15);
            z-index: 2;
        }

        .color-input-btn {
            width: 36px;
            height: 36px;
            padding: 2px;
            border: 2px solid #000;
            box-shadow: 2px 2px 0 #000;
            cursor: pointer;
            background: #ffffff;
        }

        .color-input-btn::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .color-input-btn::-webkit-color-swatch {
            border: 1px solid #000;
        }
    </style>
</head>
<body>

    <!-- Меню инструментов -->
    <div class="toolbar pixel-box">
        <a href="index.html" class="tool-btn back-btn">← НА СТОЛ</a>

        <!-- Кнопки истории действий -->
        <button id="undoBtn" class="tool-btn history-btn" title="Отмена (Ctrl+Z)" disabled>↶ НАЗАД</button>
        <button id="redoBtn" class="tool-btn history-btn" title="Повтор (Ctrl+Y)" disabled>↷ ВПЕРЁД</button>

        <button id="pencilBtn" class="tool-btn active" title="Карандаш (B)">КАРАНДАШ [B]</button>
        <button id="contourBtn" class="tool-btn" title="Контур Aseprite (D)">КОНТУР [D]</button>
        <button id="fillBtn" class="tool-btn" title="Заливка (G)">ЗАЛИВКА [G]</button>
        <button id="eraserBtn" class="tool-btn" title="Ластик (E)">ЛАСТИК [E]</button>
        <button id="zoomBtn" class="tool-btn" title="Лупа / Приближение (Z)">ЛУПА [Z]</button>
        <button id="resetZoomBtn" class="tool-btn zoom-reset-btn" style="display: none;">100%</button>

        <div class="size-picker">
            <span>РАЗМЕР:</span>
            <input type="range" id="sizeSlider" min="1" max="24" value="3">
            <span id="sizeValue">3px</span>
        </div>

        <button id="clearBtn" class="tool-btn clear-btn">ОЧИСТИТЬ</button>
        <button id="saveBtn" class="tool-btn">СКАЧАТЬ</button>
    </div>

    <!-- Холст со скроллбаром -->
    <div class="canvas-container" id="canvasContainer">
        <canvas id="paintCanvas"></canvas>
    </div>

    <!-- Палитра цветов -->
    <div class="bottom-palette pixel-box">
        <input type="color" id="customColorPicker" class="color-input-btn" value="#000000" title="Выбрать свой цвет">
        <div id="currentColorPreview" class="current-color-preview" style="background: #000000;"></div>
        <div class="palette-swatches" id="swatchesContainer"></div>
    </div>

    <script>
        const canvas = document.getElementById('paintCanvas');
        const container = document.getElementById('canvasContainer');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        // Кнопки
        const undoBtn = document.getElementById('undoBtn');
        const redoBtn = document.getElementById('redoBtn');
        const pencilBtn = document.getElementById('pencilBtn');
        const contourBtn = document.getElementById('contourBtn');
        const fillBtn = document.getElementById('fillBtn');
        const eraserBtn = document.getElementById('eraserBtn');
        const zoomBtn = document.getElementById('zoomBtn');
        const resetZoomBtn = document.getElementById('resetZoomBtn');
        const clearBtn = document.getElementById('clearBtn');
        const saveBtn = document.getElementById('saveBtn');

        const sizeSlider = document.getElementById('sizeSlider');
        const sizeValue = document.getElementById('sizeValue');
        const swatchesContainer = document.getElementById('swatchesContainer');
        const customColorPicker = document.getElementById('customColorPicker');
        const currentColorPreview = document.getElementById('currentColorPreview');

        const PALETTE = [
            '#000000', '#ffffff', '#99f553', '#ff8ff6',
            '#ff000d', '#ffabaf', '#f50018', '#630005',
            '#94c4ff', '#3183e8', '#262e85', '#ffff7d',
            '#ff8126', '#ffa361', '#d561ff', '#8150cc'
        ];

        let currentTool = 'pencil';
        let currentColor = '#000000';
        let brushSize = 3;
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        let contourPoints = [];

        // Масштабирование
        let currentScale = 1;
        const scaleSteps = [1, 1.5, 2, 3, 4];

        // ИСТОРИЯ ДЕЙСТВИЙ (UNDO / REDO)
        const MAX_HISTORY = 30;
        let undoStack = [];
        let redoStack = [];

        function saveState() {
            if (undoStack.length >= MAX_HISTORY) {
                undoStack.shift();
            }
            undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
            redoStack = [];
            updateHistoryButtons();
        }

        function undo() {
            if (undoStack.length === 0) return;
            redoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
            const prev = undoStack.pop();
            ctx.putImageData(prev, 0, 0);
            updateHistoryButtons();
        }

        function redo() {
            if (redoStack.length === 0) return;
            undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
            const next = redoStack.pop();
            ctx.putImageData(next, 0, 0);
            updateHistoryButtons();
        }

        function updateHistoryButtons() {
            undoBtn.disabled = (undoStack.length === 0);
            redoBtn.disabled = (redoStack.length === 0);
        }

        undoBtn.addEventListener('click', undo);
        redoBtn.addEventListener('click', redo);

        function initCanvas() {
            const w = Math.min(Math.floor(window.innerWidth * 0.92), 850);
            const h = Math.min(Math.floor(window.innerHeight * 0.65), 580);
            canvas.width = w;
            canvas.height = h;

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);
            ctx.imageSmoothingEnabled = false;
        }
        initCanvas();

        PALETTE.forEach(col => {
            const swatch = document.createElement('div');
            swatch.className = 'swatch';
            swatch.style.background = col;
            swatch.addEventListener('click', () => setColor(col));
            swatchesContainer.appendChild(swatch);
        });

        function setColor(hex) {
            currentColor = hex;
            currentColorPreview.style.background = hex;
            customColorPicker.value = hex;
            if (currentTool === 'eraser') setTool('pencil');
        }

        customColorPicker.addEventListener('input', (e) => setColor(e.target.value));

        function setTool(tool) {
            currentTool = tool;
            [pencilBtn, contourBtn, fillBtn, eraserBtn, zoomBtn].forEach(b => b.classList.remove('active'));
            if (tool === 'pencil') pencilBtn.classList.add('active');
            if (tool === 'contour') contourBtn.classList.add('active');
            if (tool === 'fill') fillBtn.classList.add('active');
            if (tool === 'eraser') eraserBtn.classList.add('active');
            if (tool === 'zoom') zoomBtn.classList.add('active');
        }

        pencilBtn.addEventListener('click', () => setTool('pencil'));
        contourBtn.addEventListener('click', () => setTool('contour'));
        fillBtn.addEventListener('click', () => setTool('fill'));
        eraserBtn.addEventListener('click', () => setTool('eraser'));
        zoomBtn.addEventListener('click', () => setTool('zoom'));

        // Функция масштабирования
        function applyZoom(newScale, clickX, clickY) {
            currentScale = newScale;
            canvas.style.transform = `scale(${currentScale})`;
            
            // Динамически подстраиваем минимальные виртуальные размеры, чтобы срабатывал скролл
            canvas.style.marginRight = `${(currentScale - 1) * canvas.width}px`;
            canvas.style.marginBottom = `${(currentScale - 1) * canvas.height}px`;

            if (currentScale > 1) {
                resetZoomBtn.style.display = 'inline-block';
                resetZoomBtn.textContent = Math.round(currentScale * 100) + '%';
            } else {
                resetZoomBtn.style.display = 'none';
            }

            if (clickX !== undefined && clickY !== undefined) {
                container.scrollLeft = clickX * currentScale - container.clientWidth / 2;
                container.scrollTop = clickY * currentScale - container.clientHeight / 2;
            }
        }

        resetZoomBtn.addEventListener('click', () => {
            applyZoom(1);
        });

        window.addEventListener('keydown', (e) => {
            const isCtrl = e.ctrlKey || e.metaKey;

            if (isCtrl && (e.key === 'z' || e.key === 'Z' || e.key === 'я' || e.key === 'Я')) {
                e.preventDefault();
                if (e.altKey || e.shiftKey) {
                    redo();
                } else {
                    undo();
                }
                return;
            }

            if (isCtrl && (e.key === 'y' || e.key === 'Y' || e.key === 'н' || e.key === 'Н')) {
                e.preventDefault();
                redo();
                return;
            }

            if (!isCtrl) {
                const key = e.key.toLowerCase();
                if (key === 'b' || key === 'и') setTool('pencil');
                if (key === 'd' || key === 'в') setTool('contour');
                if (key === 'g' || key === 'п') setTool('fill');
                if (key === 'e' || key === 'у') setTool('eraser');
                if (key === 'z' || key === 'я') setTool('zoom');
            }
        });

        sizeSlider.addEventListener('input', (e) => {
            brushSize = parseInt(e.target.value, 10);
            sizeValue.textContent = brushSize + 'px';
        });

        clearBtn.addEventListener('click', () => {
            if (confirm("Очистить весь лист?")) {
                saveState();
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        });

        saveBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'zagush-art.png';
            link.href = canvas.toDataURL();
            link.click();
        });

        function getCoords(e) {
            const rect = canvas.getBoundingClientRect();
            // Расчет с учетом текущего зума
            return {
                x: Math.floor((e.clientX - rect.left) / currentScale),
                y: Math.floor((e.clientY - rect.top) / currentScale)
            };
        }

        function drawPixelSquare(x, y, color, size) {
            ctx.fillStyle = color;
            ctx.fillRect(Math.floor(x - size / 2), Math.floor(y - size / 2), size, size);
        }

        function drawPixelLine(x0, y0, x1, y1, color, size) {
            const dx = Math.abs(x1 - x0);
            const dy = Math.abs(y1 - y0);
            const sx = (x0 < x1) ? 1 : -1;
            const sy = (y0 < y1) ? 1 : -1;
            let err = dx - dy;

            while (true) {
                drawPixelSquare(x0, y0, color, size);
                if (x0 === x1 && y0 === y1) break;
                const e2 = 2 * err;
                if (e2 > -dy) { err -= dy; x0 += sx; }
                if (e2 < dx) { err += dx; y0 += sy; }
            }
        }

        // Сканирующий алгоритм заливки контура без незакрашенных белых пикселей
        function fillPixelPolygon(points, color) {
            if (points.length < 3) return;

            let minY = points[0].y;
            let maxY = points[0].y;
            for (let i = 1; i < points.length; i++) {
                if (points[i].y < minY) minY = points[i].y;
                if (points[i].y > maxY) maxY = points[i].y;
            }

            minY = Math.max(0, minY);
            maxY = Math.min(canvas.height - 1, maxY);

            ctx.fillStyle = color;

            for (let y = minY; y <= maxY; y++) {
                const nodeX = [];
                let j = points.length - 1;

                for (let i = 0; i < points.length; i++) {
                    if ((points[i].y < y && points[j].y >= y) || (points[j].y < y && points[i].y >= y)) {
                        const x = Math.round(points[i].x + (y - points[i].y) / (points[j].y - points[i].y) * (points[j].x - points[i].x));
                        nodeX.push(x);
                    }
                    j = i;
                }

                nodeX.sort((a, b) => a - b);

                for (let i = 0; i < nodeX.length; i += 2) {
                    if (nodeX[i] >= canvas.width) break;
                    if (nodeX[i + 1] > 0) {
                        const left = Math.max(0, nodeX[i]);
                        const right = Math.min(canvas.width, nodeX[i + 1]);
                        if (right > left) {
                            ctx.fillRect(left, y, right - left + 1, 1);
                        }
                    }
                }
            }
        }

        // Flood Fill
        function floodFill(startX, startY, fillHex) {
            saveState();

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;

            const tempDiv = document.createElement('div');
            tempDiv.style.color = fillHex;
            document.body.appendChild(tempDiv);
            const rgbMatch = window.getComputedStyle(tempDiv).color.match(/\d+/g);
            document.body.removeChild(tempDiv);

            const fillR = parseInt(rgbMatch[0], 10);
            const fillG = parseInt(rgbMatch[1], 10);
            const fillB = parseInt(rgbMatch[2], 10);
            const fillA = 255;

            const startIndex = (startY * canvas.width + startX) * 4;
            const targetR = data[startIndex];
            const targetG = data[startIndex + 1];
            const targetB = data[startIndex + 2];
            const targetA = data[startIndex + 3];

            if (targetR === fillR && targetG === fillG && targetB === fillB && targetA === fillA) {
                return;
            }

            function matchTarget(idx) {
                return data[idx] === targetR &&
                       data[idx + 1] === targetG &&
                       data[idx + 2] === targetB &&
                       data[idx + 3] === targetA;
            }

            function colorPixel(idx) {
                data[idx] = fillR;
                data[idx + 1] = fillG;
                data[idx + 2] = fillB;
                data[idx + 3] = fillA;
            }

            const queue = [startX, startY];
            const w = canvas.width;
            const h = canvas.height;

            while (queue.length > 0) {
                const cy = queue.pop();
                const cx = queue.pop();

                let left = cx;
                while (left >= 0 && matchTarget((cy * w + left) * 4)) left--;
                left++;

                let right = cx;
                while (right < w && matchTarget((cy * w + right) * 4)) right++;
                right--;

                let spanUp = false;
                let spanDown = false;

                for (let x = left; x <= right; x++) {
                    const curIdx = (cy * w + x) * 4;
                    colorPixel(curIdx);

                    if (cy > 0) {
                        const upIdx = ((cy - 1) * w + x) * 4;
                        if (matchTarget(upIdx)) {
                            if (!spanUp) {
                                queue.push(x, cy - 1);
                                spanUp = true;
                            }
                        } else {
                            spanUp = false;
                        }
                    }

                    if (cy < h - 1) {
                        const downIdx = ((cy + 1) * w + x) * 4;
                        if (matchTarget(downIdx)) {
                            if (!spanDown) {
                                queue.push(x, cy + 1);
                                spanDown = true;
                            }
                        } else {
                            spanDown = false;
                        }
                    }
                }
            }

            ctx.putImageData(imgData, 0, 0);
        }

        // Мышь / Тач события
        canvas.addEventListener('pointerdown', (e) => {
            const { x, y } = getCoords(e);

            // Режим Лупа
            if (currentTool === 'zoom') {
                let currentIndex = scaleSteps.indexOf(currentScale);
                let nextIndex = (currentIndex + 1) % scaleSteps.length;
                applyZoom(scaleSteps[nextIndex], x, y);
                return;
            }

            canvas.setPointerCapture(e.pointerId);

            if (currentTool === 'fill') {
                floodFill(x, y, currentColor);
                return;
            }

            saveState();

            isDrawing = true;
            lastX = x;
            lastY = y;

            if (currentTool === 'contour') {
                contourPoints = [{ x, y }];
                drawPixelSquare(x, y, currentColor, brushSize);
            } else {
                const col = (currentTool === 'eraser') ? '#ffffff' : currentColor;
                drawPixelSquare(x, y, col, brushSize);
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDrawing) return;
            const { x, y } = getCoords(e);

            if (currentTool === 'contour') {
                contourPoints.push({ x, y });
                drawPixelLine(lastX, lastY, x, y, currentColor, brushSize);
            } else if (currentTool === 'pencil' || currentTool === 'eraser') {
                const col = (currentTool === 'eraser') ? '#ffffff' : currentColor;
                drawPixelLine(lastX, lastY, x, y, col, brushSize);
            }

            lastX = x;
            lastY = y;
        });

        function stopDrawing(e) {
            if (!isDrawing) return;
            isDrawing = false;
            try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}

            if (currentTool === 'contour' && contourPoints.length > 2) {
                fillPixelPolygon(contourPoints, currentColor);

                for (let i = 0; i < contourPoints.length; i++) {
                    const p1 = contourPoints[i];
                    const p2 = contourPoints[(i + 1) % contourPoints.length];
                    drawPixelLine(p1.x, p1.y, p2.x, p2.y, currentColor, brushSize);
                }

                contourPoints = [];
            }
        }

        canvas.addEventListener('pointerup', stopDrawing);
        canvas.addEventListener('pointercancel', stopDrawing);
    </script>
</body>
</html>
