<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAGUSH — РИСОВАТЬ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        body {
            font-family: 'Courier New', Courier, monospace, sans-serif;
            background: #2b2118;
            background-image: url('stol.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            padding: 12px;
            overflow-y: auto;
            touch-action: pan-y;
            user-select: none;
        }

        /* 
           Минималистичная пиксельная рамка (Pixel Border)
           - Срезанные 1px уголки
           - Тёмный контур без мыла
        */
        .pixel-card {
            background: #f8fafc;
            position: relative;
            box-shadow: 
                -2px 0 0 0 #0f172a,
                2px 0 0 0 #0f172a,
                0 -2px 0 0 #0f172a,
                0 2px 0 0 #0f172a;
            margin: 4px;
        }

        /* Панель инструментов */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 10px;
            z-index: 10;
            max-width: 98vw;
        }

        /* Минималистичные пиксельные кнопки без подписей клавиш */
        .tool-btn {
            background: #ffffff;
            border: none;
            outline: none;
            font-family: inherit;
            font-weight: bold;
            font-size: 11px;
            letter-spacing: 0.5px;
            padding: 6px 10px;
            cursor: pointer;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            position: relative;
            margin: 2px;
            box-shadow: 
                -2px 0 0 0 #0f172a,
                2px 0 0 0 #0f172a,
                0 -2px 0 0 #0f172a,
                0 2px 0 0 #0f172a;
            transition: background 0.1s, color 0.1s;
        }

        .tool-btn:hover:not(:disabled) {
            background: #e2e8f0;
        }

        .tool-btn:active:not(:disabled) {
            background: #cbd5e1;
        }

        /* Активное состояние кнопки */
        .tool-btn.active {
            background: #0f172a;
            color: #ffffff;
        }

        .tool-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Акцентные кнопки */
        .back-btn {
            background: #ef4444;
            color: #ffffff;
        }

        .back-btn:hover {
            background: #dc2626;
        }

        .clear-btn {
            background: #facc15;
            color: #0f172a;
        }

        .clear-btn:hover {
            background: #eab308;
        }

        /* Выбор размера кисти */
        .size-picker {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: bold;
            background: #ffffff;
            padding: 4px 8px;
            margin: 2px;
            box-shadow: 
                -2px 0 0 0 #0f172a,
                2px 0 0 0 #0f172a,
                0 -2px 0 0 #0f172a,
                0 2px 0 0 #0f172a;
        }

        .size-picker input {
            cursor: pointer;
            width: 55px;
        }

        /* Блок зума */
        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .zoom-display {
            font-size: 11px;
            font-weight: bold;
            min-width: 40px;
            text-align: center;
        }

        /* Контейнер холста */
        .canvas-container {
            position: relative;
            background: #ffffff;
            max-width: 95vw;
            max-height: 65vh;
            overflow: auto;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
        }

        canvas {
            display: block;
            cursor: crosshair;
            background: #ffffff;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            transform-origin: 0 0;
            touch-action: none;
        }

        /* Палитра */
        .bottom-palette {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 10px;
            max-width: 98vw;
            flex-wrap: wrap;
            z-index: 10;
            margin-bottom: 16px;
        }

        .current-color-preview {
            width: 22px;
            height: 22px;
            margin: 2px;
            box-shadow: 
                -2px 0 0 0 #0f172a,
                2px 0 0 0 #0f172a,
                0 -2px 0 0 #0f172a,
                0 2px 0 0 #0f172a;
        }

        .palette-swatches {
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
        }

        .swatch {
            width: 20px;
            height: 20px;
            cursor: pointer;
            margin: 2px;
            box-shadow: 
                -2px 0 0 0 #0f172a,
                2px 0 0 0 #0f172a,
                0 -2px 0 0 #0f172a,
                0 2px 0 0 #0f172a;
        }

        .swatch:hover {
            transform: scale(1.1);
        }

        .color-input-btn {
            width: 26px;
            height: 26px;
            padding: 0;
            border: none;
            cursor: pointer;
            background: transparent;
            margin: 2px;
            box-shadow: 
                -2px 0 0 0 #0f172a,
                2px 0 0 0 #0f172a,
                0 -2px 0 0 #0f172a,
                0 2px 0 0 #0f172a;
        }

        .color-input-btn::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .color-input-btn::-webkit-color-swatch {
            border: none;
        }
    </style>
</head>
<body>

    <!-- Панель инструментов -->
    <div class="toolbar pixel-card">
        <a href="index.html" class="tool-btn back-btn">← НА СТОЛ</a>

        <button id="undoBtn" class="tool-btn" title="Отмена (Ctrl+Z)" disabled>↶ НАЗАД</button>
        <button id="redoBtn" class="tool-btn" title="Повтор (Ctrl+Y)" disabled>↷ ВПЕРЁД</button>

        <!-- Чистые названия без подписи горячих клавиш -->
        <button id="pencilBtn" class="tool-btn active">КАРАНДАШ</button>
        <button id="contourBtn" class="tool-btn">КОНТУР</button>
        <button id="fillBtn" class="tool-btn">ЗАЛИВКА</button>
        <button id="eraserBtn" class="tool-btn">ЛАСТИК</button>

        <div class="zoom-controls">
            <button id="zoomOutBtn" class="tool-btn" title="Отдалить">-</button>
            <span id="zoomValue" class="zoom-display">100%</span>
            <button id="zoomInBtn" class="tool-btn" title="Приблизить">+</button>
        </div>

        <div class="size-picker">
            <span>РАЗМЕР:</span>
            <input type="range" id="sizeSlider" min="1" max="24" value="3">
            <span id="sizeValue">3px</span>
        </div>

        <button id="clearBtn" class="tool-btn clear-btn">ОЧИСТИТЬ</button>
        <button id="saveBtn" class="tool-btn">СКАЧАТЬ</button>
    </div>

    <!-- Холст -->
    <div class="canvas-container pixel-card" id="canvasContainer">
        <canvas id="paintCanvas"></canvas>
    </div>

    <!-- Палитра -->
    <div class="bottom-palette pixel-card">
        <input type="color" id="customColorPicker" class="color-input-btn" value="#000000" title="Выбрать свой цвет">
        <div id="currentColorPreview" class="current-color-preview" style="background: #000000;"></div>
        <div class="palette-swatches" id="swatchesContainer"></div>
    </div>

    <script>
        const canvas = document.getElementById('paintCanvas');
        const container = document.getElementById('canvasContainer');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        // Кнопки управления
        const undoBtn = document.getElementById('undoBtn');
        const redoBtn = document.getElementById('redoBtn');
        const pencilBtn = document.getElementById('pencilBtn');
        const contourBtn = document.getElementById('contourBtn');
        const fillBtn = document.getElementById('fillBtn');
        const eraserBtn = document.getElementById('eraserBtn');

        const zoomInBtn = document.getElementById('zoomInBtn');
        const zoomOutBtn = document.getElementById('zoomOutBtn');
        const zoomValue = document.getElementById('zoomValue');

        const clearBtn = document.getElementById('clearBtn');
        const saveBtn = document.getElementById('saveBtn');

        const sizeSlider = document.getElementById('sizeSlider');
        const sizeValue = document.getElementById('sizeValue');
        const swatchesContainer = document.getElementById('swatchesContainer');
        const customColorPicker = document.getElementById('customColorPicker');
        const currentColorPreview = document.getElementById('currentColorPreview');

        // Палитра цветов
        const PALETTE = [
            '#000000', '#ffffff', '#99f553', '#ff8ff6',
            '#ff000d', '#ffabaf', '#f50018', '#630005',
            '#94c4ff', '#3183e8', '#262e85', '#ffff7d',
            '#ff8126', '#ffa361', '#d561ff', '#8150cc'
        ];

        // Состояние приложения
        let currentTool = 'pencil';
        let currentColor = '#000000';
        let brushSize = 3;
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;

        // Масштабирование
        let currentScale = 1;
        const MIN_SCALE = 0.5;
        const MAX_SCALE = 4.0;
        const SCALE_STEP = 0.25;

        // История отмены/повтора
        const MAX_HISTORY = 30;
        let undoStack = [];
        let redoStack = [];

        function saveState() {
            if (undoStack.length >= MAX_HISTORY) undoStack.shift();
            undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
            redoStack = [];
            updateHistoryButtons();
        }

        function undo() {
            if (undoStack.length === 0) return;
            redoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
            const prev = undoStack.pop();
            ctx.putImageData(prev, 0, 0);
            updateHistoryButtons();
        }

        function redo() {
            if (redoStack.length === 0) return;
            undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
            const next = redoStack.pop();
            ctx.putImageData(next, 0, 0);
            updateHistoryButtons();
        }

        function updateHistoryButtons() {
            undoBtn.disabled = (undoStack.length === 0);
            redoBtn.disabled = (redoStack.length === 0);
        }

        undoBtn.addEventListener('click', undo);
        redoBtn.addEventListener('click', redo);

        // Инициализация размеров холста
        function initCanvas() {
            const w = Math.min(Math.floor(window.innerWidth * 0.92), 850);
            const h = Math.min(Math.floor(window.innerHeight * 0.65), 580);
            canvas.width = w;
            canvas.height = h;

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);
            ctx.imageSmoothingEnabled = false;
        }
        initCanvas();

        // Создание палитры
        PALETTE.forEach(col => {
            const swatch = document.createElement('div');
            swatch.className = 'swatch';
            swatch.style.background = col;
            swatch.addEventListener('click', () => setColor(col));
            swatchesContainer.appendChild(swatch);
        });

        function setColor(hex) {
            currentColor = hex;
            currentColorPreview.style.background = hex;
            customColorPicker.value = hex;
            if (currentTool === 'eraser') setTool('pencil');
        }

        customColorPicker.addEventListener('input', (e) => setColor(e.target.value));

        // Смена инструментов
        function setTool(tool) {
            currentTool = tool;
            [pencilBtn, contourBtn, fillBtn, eraserBtn].forEach(b => b.classList.remove('active'));
            if (tool === 'pencil') pencilBtn.classList.add('active');
            if (tool === 'contour') contourBtn.classList.add('active');
            if (tool === 'fill') fillBtn.classList.add('active');
            if (tool === 'eraser') eraserBtn.classList.add('active');
        }

        pencilBtn.addEventListener('click', () => setTool('pencil'));
        contourBtn.addEventListener('click', () => setTool('contour'));
        fillBtn.addEventListener('click', () => setTool('fill'));
        eraserBtn.addEventListener('click', () => setTool('eraser'));

        // Зум
        function setZoom(scale) {
            currentScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale));
            canvas.style.transform = `scale(${currentScale})`;
            canvas.style.marginRight = `${(currentScale - 1) * canvas.width}px`;
            canvas.style.marginBottom = `${(currentScale - 1) * canvas.height}px`;
            zoomValue.textContent = Math.round(currentScale * 100) + '%';
        }

        zoomInBtn.addEventListener('click', () => setZoom(currentScale + SCALE_STEP));
        zoomOutBtn.addEventListener('click', () => setZoom(currentScale - SCALE_STEP));

        // Горячие клавиши (сохранены в фоне для удобства)
        window.addEventListener('keydown', (e) => {
            const isCtrl = e.ctrlKey || e.metaKey;
            if (isCtrl && (e.key === 'z' || e.key === 'Z' || e.key === 'я' || e.key === 'Я')) {
                e.preventDefault();
                if (e.altKey || e.shiftKey) redo(); else undo();
                return;
            }
            if (isCtrl && (e.key === 'y' || e.key === 'Y' || e.key === 'н' || e.key === 'Н')) {
                e.preventDefault();
                redo();
                return;
            }
            if (!isCtrl) {
                const key = e.key.toLowerCase();
                if (key === 'b' || key === 'и') setTool('pencil');
                if (key === 'd' || key === 'в') setTool('contour');
                if (key === 'g' || key === 'п') setTool('fill');
                if (key === 'e' || key === 'у') setTool('eraser');
            }
        });

        sizeSlider.addEventListener('input', (e) => {
            brushSize = parseInt(e.target.value, 10);
            sizeValue.textContent = brushSize + 'px';
        });

        clearBtn.addEventListener('click', () => {
            if (confirm("Очистить весь холст?")) {
                saveState();
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        });

        saveBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'art.png';
            link.href = canvas.toDataURL();
            link.click();
        });

        // Вспомогательные функции рисования
        function getCoords(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: Math.floor((e.clientX - rect.left) / currentScale),
                y: Math.floor((e.clientY - rect.top) / currentScale)
            };
        }

        function drawPixelSquare(x, y, color, size) {
            ctx.fillStyle = color;
            ctx.fillRect(Math.floor(x - size / 2), Math.floor(y - size / 2), size, size);
        }

        function drawPixelLine(x0, y0, x1, y1, color, size) {
            const dx = Math.abs(x1 - x0);
            const dy = Math.abs(y1 - y0);
            const sx = (x0 < x1) ? 1 : -1;
            const sy = (y0 < y1) ? 1 : -1;
            let err = dx - dy;

            while (true) {
                drawPixelSquare(x0, y0, color, size);
                if (x0 === x1 && y0 === y1) break;
                const e2 = 2 * err;
                if (e2 > -dy) { err -= dy; x0 += sx; }
                if (e2 < dx) { err += dx; y0 += sy; }
            }
        }

        // РАБОТАЮЩАЯ ЗАЛИВКА (FLOOD FILL)
        function floodFill(startX, startY, fillHex) {
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;

            // Преобразование hex в RGB
            const temp = document.createElement('div');
            temp.style.color = fillHex;
            document.body.appendChild(temp);
            const rgb = window.getComputedStyle(temp).color.match(/\d+/g);
            document.body.removeChild(temp);

            const fillR = parseInt(rgb[0], 10);
            const fillG = parseInt(rgb[1], 10);
            const fillB = parseInt(rgb[2], 10);

            const startIndex = (startY * canvas.width + startX) * 4;
            const targetR = data[startIndex];
            const targetG = data[startIndex + 1];
            const targetB = data[startIndex + 2];

            if (targetR === fillR && targetG === fillG && targetB === fillB) return;

            function matchTarget(idx) {
                return data[idx] === targetR && data[idx + 1] === targetG && data[idx + 2] === targetB;
            }

            function colorPixel(idx) {
                data[idx] = fillR;
                data[idx + 1] = fillG;
                data[idx + 2] = fillB;
                data[idx + 3] = 255;
            }

            const queue = [startX, startY];
            const w = canvas.width;
            const h = canvas.height;

            while (queue.length > 0) {
                const cy = queue.pop();
                const cx = queue.pop();

                let left = cx;
                while (left >= 0 && matchTarget((cy * w + left) * 4)) left--;
                left++;

                let right = cx;
                while (right < w && matchTarget((cy * w + right) * 4)) right++;
                right--;

                let spanUp = false;
                let spanDown = false;

                for (let x = left; x <= right; x++) {
                    const curIdx = (cy * w + x) * 4;
                    colorPixel(curIdx);

                    if (cy > 0) {
                        const upIdx = ((cy - 1) * w + x) * 4;
                        if (matchTarget(upIdx)) {
                            if (!spanUp) { queue.push(x, cy - 1); spanUp = true; }
                        } else spanUp = false;
                    }

                    if (cy < h - 1) {
                        const downIdx = ((cy + 1) * w + x) * 4;
                        if (matchTarget(downIdx)) {
                            if (!spanDown) { queue.push(x, cy + 1); spanDown = true; }
                        } else spanDown = false;
                    }
                }
            }

            ctx.putImageData(imgData, 0, 0);
        }

        // ОБРАБОТКА НАЖАТИЙ НА ХОЛСТ
        canvas.addEventListener('pointerdown', (e) => {
            const { x, y } = getCoords(e);
            canvas.setPointerCapture(e.pointerId);

            if (currentTool === 'fill') {
                saveState();
                floodFill(x, y, currentColor);
                return;
            }

            saveState();
            isDrawing = true;
            lastX = x;
            lastY = y;

            const activeColor = (currentTool === 'eraser') ? '#ffffff' : currentColor;
            drawPixelSquare(x, y, activeColor, brushSize);
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDrawing) return;
            const { x, y } = getCoords(e);

            const activeColor = (currentTool === 'eraser') ? '#ffffff' : currentColor;
            
            // Для Карандаша, Ластика и временной заглушки Контура
            drawPixelLine(lastX, lastY, x, y, activeColor, brushSize);

            lastX = x;
            lastY = y;
        });

        function stopDrawing(e) {
            if (!isDrawing) return;
            isDrawing = false;
            try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
        }

        canvas.addEventListener('pointerup', stopDrawing);
        canvas.addEventListener('pointercancel', stopDrawing);
    </script>
</body>
</html>
