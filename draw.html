<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAGUSH — РИСОВАТЬ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        body {
            font-family: 'Courier New', Courier, monospace, sans-serif;
            background: #2b2118;
            background-image: url('stol.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            padding: 12px;
            overflow-y: auto;
            touch-action: pan-y;
            user-select: none;
        }

        /* 
           ОСНОВНОЙ ПАНЕЛЬНЫЙ СТИЛЬ (ASEPRITE / WIN95 RETRO UI)
           - Светлый еле-еле голубовато-серый фон (#e3e7ec)
           - Тёмный внешний пиксельный контур (#111827)
           - Внутренняя светлая фаска (#ffffff) для объема
        */
        .ase-panel {
            background: #f2f7ff;
            position: relative;
            box-shadow: 
                /* Внешняя пиксельная рамка 1px */
                0 0 0 1px #111827,
                /* Внутренняя светлая фаска (верх и лево) */
                inset 1px 1px 0 0 #ffffff,
                inset -1px -1px 0 0 #9ea7b3;
            padding: 6px;
        }

        /* Панель инструментов */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 5px;
            z-index: 10;
            max-width: 98vw;
        }

        /* 
           ОБЪЁМНЫЕ КНОПКИ ASEPRITE 
           - Выпуклые пиксельные грани (Белая сверху-слева, тёмная снизу-справа)
        */
        .tool-btn {
            background: #d4dbe4;
            border: none;
            outline: none;
            font-family: inherit;
            font-weight: bold;
            font-size: 11px;
            padding: 5px 9px;
            cursor: pointer;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            margin: 2px;
            box-shadow: 
                /* Черный внешний контур */
                0 0 0 1px #111827,
                /* Верхний и левый яркий блик */
                inset 1px 1px 0 0 #ffffff,
                /* Нижняя и правая пиксельная тень */
                inset -1px -1px 0 0 #717d8d;
            transition: background 0.05s;
        }

        .tool-btn:hover:not(:disabled) {
            background: #e1e7f0;
        }

        /* ЭФФЕКТ НАЖАТИЯ (Фаски меняются местами — кнопка уходит вглубь) */
        .tool-btn:active:not(:disabled),
        .tool-btn.active {
            background: #b0ba8;
            background: #b0b9c6;
            box-shadow: 
                0 0 0 1px #111827,
                /* Тень падает сверху и слева */
                inset 1px 1px 0 0 #475569,
                inset -1px -1px 0 0 #ffffff;
            color: #000000;
        }

        .tool-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            background: #cbd5e1;
            box-shadow: 0 0 0 1px #64748b;
        }

        /* Акцентные кнопки в стиле Aseprite */
        .back-btn {
            background: #e15555;
            color: #ffffff;
            box-shadow: 
                0 0 0 1px #111827,
                inset 1px 1px 0 0 #ffa0a0,
                inset -1px -1px 0 0 #991b1b;
        }

        .back-btn:hover {
            background: #f87171;
        }

        .clear-btn {
            background: #eab308;
            color: #1e293b;
            box-shadow: 
                0 0 0 1px #111827,
                inset 1px 1px 0 0 #fef08a,
                inset -1px -1px 0 0 #854d0e;
        }

        .clear-btn:hover {
            background: #facc15;
        }

        /* Вдавленное поле выбора размера и ввода */
        .size-picker {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: bold;
            background: #ffffff;
            padding: 3px 6px;
            margin: 2px;
            box-shadow: 
                0 0 0 1px #111827,
                inset 1px 1px 0 0 #64748b,
                inset -1px -1px 0 0 #ffffff;
        }

        .size-picker input {
            cursor: pointer;
            width: 50px;
        }

        /* Зум */
        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .zoom-display {
            font-size: 11px;
            font-weight: bold;
            min-width: 38px;
            text-align: center;
        }

        /* Контейнер холста */
        .canvas-container {
            position: relative;
            background: #ffffff;
            max-width: 95vw;
            max-height: 65vh;
            overflow: auto;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            box-shadow: 
                0 0 0 2px #111827,
                inset 2px 2px 0 0 #64748b;
        }

        canvas {
            display: block;
            cursor: crosshair;
            background: #ffffff;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            transform-origin: 0 0;
            touch-action: none;
        }

        /* Палитра */
        .bottom-palette {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 6px 10px;
            max-width: 98vw;
            flex-wrap: wrap;
            z-index: 10;
            margin-bottom: 16px;
        }

        .current-color-preview {
            width: 22px;
            height: 22px;
            margin: 2px;
            box-shadow: 
                0 0 0 1px #111827,
                inset 1px 1px 0 0 #ffffff,
                inset -1px -1px 0 0 #000000;
        }

        .palette-swatches {
            display: flex;
            gap: 2px;
            flex-wrap: wrap;
        }

        .swatch {
            width: 18px;
            height: 18px;
            cursor: pointer;
            margin: 2px;
            box-shadow: 
                0 0 0 1px #111827,
                inset 1px 1px 0 0 rgba(255,255,255,0.6),
                inset -1px -1px 0 0 rgba(0,0,0,0.4);
        }

        .swatch:hover {
            transform: scale(1.15);
            z-index: 2;
        }

        .color-input-btn {
            width: 24px;
            height: 24px;
            padding: 0;
            border: none;
            cursor: pointer;
            background: transparent;
            margin: 2px;
            box-shadow: 0 0 0 1px #111827;
        }

        .color-input-btn::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .color-input-btn::-webkit-color-swatch {
            border: none;
        }
    </style>
</head>
<body>

    <!-- Панель инструментов -->
    <div class="toolbar ase-panel">
        <a href="index.html" class="tool-btn back-btn">← НА СТОЛ</a>

        <button id="undoBtn" class="tool-btn" title="Отмена (Ctrl+Z)" disabled>↶ НАЗАД</button>
        <button id="redoBtn" class="tool-btn" title="Повтор (Ctrl+Y)" disabled>↷ ВПЕРЁД</button>

        <button id="pencilBtn" class="tool-btn active">КАРАНДАШ</button>
        <button id="contourBtn" class="tool-btn">КОНТУР</button>
        <button id="fillBtn" class="tool-btn">ЗАЛИВКА</button>
        <button id="eraserBtn" class="tool-btn">ЛАСТИК</button>

        <div class="zoom-controls">
            <button id="zoomOutBtn" class="tool-btn" title="Отдалить">-</button>
            <span id="zoomValue" class="zoom-display">100%</span>
            <button id="zoomInBtn" class="tool-btn" title="Приблизить">+</button>
        </div>

        <div class="size-picker">
    <span>РАЗМЕР:</span>
    <input type="range" id="sizeSlider" min="1" max="24" value="3">
    <span id="sizeValue">3px</span>
</div>

<button id="clearBtn" class="tool-btn clear-btn">ОЧИСТИТЬ</button>
<button id="saveOriginalBtn" class="tool-btn">СКАЧАТЬ (ОРИГИНАЛ)</button>
<button id="saveHighResBtn" class="tool-btn">СКАЧАТЬ (x4)</button>
</div>

<!-- Холст -->
    <div class="canvas-container" id="canvasContainer">
        <canvas id="paintCanvas"></canvas>
    </div>

    <!-- Палитра -->
    <div class="bottom-palette ase-panel">
        <input type="color" id="customColorPicker" class="color-input-btn" value="#000000" title="Выбрать свой цвет">
        <div id="currentColorPreview" class="current-color-preview" style="background: #000000;"></div>
        <div class="palette-swatches" id="swatchesContainer"></div>
    </div>

    <script>
    const canvas = document.getElementById('paintCanvas');
    const container = document.getElementById('canvasContainer');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    const undoBtn = document.getElementById('undoBtn');
    const redoBtn = document.getElementById('redoBtn');
    const pencilBtn = document.getElementById('pencilBtn');
    const contourBtn = document.getElementById('contourBtn');
    const fillBtn = document.getElementById('fillBtn');
    const eraserBtn = document.getElementById('eraserBtn');

    const zoomInBtn = document.getElementById('zoomInBtn');
    const zoomOutBtn = document.getElementById('zoomOutBtn');
    const zoomValue = document.getElementById('zoomValue');

    const clearBtn = document.getElementById('clearBtn');
    const saveBtn = document.getElementById('saveBtn');

    const sizeSlider = document.getElementById('sizeSlider');
    const sizeValue = document.getElementById('sizeValue');
    const swatchesContainer = document.getElementById('swatchesContainer');
    const customColorPicker = document.getElementById('customColorPicker');
    const currentColorPreview = document.getElementById('currentColorPreview');

    const PALETTE = [
        '#000000', '#ffffff', '#99f553', '#ff8ff6',
        '#ff000d', '#ffabaf', '#f50018', '#630005',
        '#94c4ff', '#3183e8', '#262e85', '#ffff7d',
        '#ff8126', '#ffa361', '#d561ff', '#8150cc'
    ];

    let currentTool = 'pencil';
    let currentColor = '#000000';
    let brushSize = 3;
    let isDrawing = false;
    let lastX = 0;
    let lastY = 0;
    
    // Векторный массив для накопления всех пикселей контура
    let contourPoints = []; 

    let currentScale = 1;
    const MIN_SCALE = 0.5;
    const MAX_SCALE = 4.0;
    const SCALE_STEP = 0.25;

    const MAX_HISTORY = 30;
    let undoStack = [];
    let redoStack = [];

    function saveState() {
        if (undoStack.length >= MAX_HISTORY) undoStack.shift();
        undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
        redoStack = [];
        updateHistoryButtons();
    }

    function undo() {
        if (undoStack.length === 0) return;
        redoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
        const prev = undoStack.pop();
        ctx.putImageData(prev, 0, 0);
        updateHistoryButtons();
    }

    function redo() {
        if (redoStack.length === 0) return;
        undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
        const next = redoStack.pop();
        ctx.putImageData(next, 0, 0);
        updateHistoryButtons();
    }

    function updateHistoryButtons() {
        undoBtn.disabled = (undoStack.length === 0);
        redoBtn.disabled = (redoStack.length === 0);
    }

    undoBtn.addEventListener('click', undo);
    redoBtn.addEventListener('click', redo);

    function initCanvas() {
        const w = Math.min(Math.floor(window.innerWidth * 0.92), 850);
        const h = Math.min(Math.floor(window.innerHeight * 0.65), 580);
        canvas.width = w;
        canvas.height = h;

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.imageSmoothingEnabled = false;
    }
    initCanvas();

    PALETTE.forEach(col => {
        const swatch = document.createElement('div');
        swatch.className = 'swatch';
        swatch.style.background = col;
        swatch.addEventListener('click', () => setColor(col));
        swatchesContainer.appendChild(swatch);
    });

    function setColor(hex) {
        currentColor = hex;
        currentColorPreview.style.background = hex;
        customColorPicker.value = hex;
        if (currentTool === 'eraser') setTool('pencil');
    }

    customColorPicker.addEventListener('input', (e) => setColor(e.target.value));

    function setTool(tool) {
        currentTool = tool;
        [pencilBtn, contourBtn, fillBtn, eraserBtn].forEach(b => b.classList.remove('active'));
        
        if (tool === 'pencil') pencilBtn.classList.add('active');
        if (tool === 'fill') fillBtn.classList.add('active');
        if (tool === 'eraser') eraserBtn.classList.add('active');
        
        if (tool === 'contour') {
            contourBtn.classList.add('active');
            // Принудительно ставим минимум 2px для Контура
            if (brushSize < 2) {
                brushSize = 2;
                sizeSlider.value = 2;
                sizeValue.textContent = '2px';
            }
        }
    }

    pencilBtn.addEventListener('click', () => setTool('pencil'));
    contourBtn.addEventListener('click', () => setTool('contour'));
    fillBtn.addEventListener('click', () => setTool('fill'));
    eraserBtn.addEventListener('click', () => setTool('eraser'));

    function setZoom(scale) {
        currentScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale));
        canvas.style.transform = `scale(${currentScale})`;
        canvas.style.marginRight = `${(currentScale - 1) * canvas.width}px`;
        canvas.style.marginBottom = `${(currentScale - 1) * canvas.height}px`;
        zoomValue.textContent = Math.round(currentScale * 100) + '%';
    }

    zoomInBtn.addEventListener('click', () => setZoom(currentScale + SCALE_STEP));
    zoomOutBtn.addEventListener('click', () => setZoom(currentScale - SCALE_STEP));

    window.addEventListener('keydown', (e) => {
        const isCtrl = e.ctrlKey || e.metaKey;
        if (isCtrl && (e.key === 'z' || e.key === 'Z' || e.key === 'я' || e.key === 'Я')) {
            e.preventDefault();
            if (e.altKey || e.shiftKey) redo(); else undo();
            return;
        }
        if (isCtrl && (e.key === 'y' || e.key === 'Y' || e.key === 'н' || e.key === 'Н')) {
            e.preventDefault();
            redo();
            return;
        }
        if (!isCtrl) {
            const key = e.key.toLowerCase();
            if (key === 'b' || key === 'и') setTool('pencil');
            if (key === 'd' || key === 'в') setTool('contour');
            if (key === 'g' || key === 'п') setTool('fill');
            if (key === 'e' || key === 'у') setTool('eraser');
        }
    });

    sizeSlider.addEventListener('input', (e) => {
        let val = parseInt(e.target.value, 10);
        
        // Блокируем ползунок на 2px, если выбран Контур
        if (currentTool === 'contour' && val < 2) {
            val = 2;
            sizeSlider.value = 2;
        }
        
        brushSize = val;
        sizeValue.textContent = brushSize + 'px';
    });

    clearBtn.addEventListener('click', () => {
        if (confirm("Очистить весь холст?")) {
            saveState();
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
    });

    // 1. Сохранение в оригинальном размере
    saveOriginalBtn.addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = 'art_original.png';
        link.href = canvas.toDataURL();
        link.click();
    });

    // 2. Сохранение в x4 качестве (Pixel Perfect)
    saveHighResBtn.addEventListener('click', () => {
        // Создаем временный холст в памяти
        const tempCanvas = document.createElement('canvas');
        const scaleFactor = 4; // Увеличиваем на 400%
        
        tempCanvas.width = canvas.width * scaleFactor;
        tempCanvas.height = canvas.height * scaleFactor;
        
        const tempCtx = tempCanvas.getContext('2d');
        
        // САМОЕ ВАЖНОЕ: Отключаем сглаживание, чтобы пиксели остались четкими квадратами
        tempCtx.imageSmoothingEnabled = false;
        
        // Отрисовываем наш маленький холст на большом с растягиванием
        tempCtx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
        
        // Генерируем ссылку и скачиваем большую картинку
        const link = document.createElement('a');
        link.download = 'art_x4_HD.png';
        link.href = tempCanvas.toDataURL('image/png');
        link.click();
    });

    function getCoords(e) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: Math.floor((e.clientX - rect.left) / currentScale),
            y: Math.floor((e.clientY - rect.top) / currentScale)
        };
    }

    function drawPixelSquare(x, y, color, size) {
        ctx.fillStyle = color;
        ctx.fillRect(Math.floor(x - size / 2), Math.floor(y - size / 2), size, size);
    }

    function getBresenhamPoints(x0, y0, x1, y1) {
        let pts = [];
        const dx = Math.abs(x1 - x0);
        const dy = Math.abs(y1 - y0);
        const sx = (x0 < x1) ? 1 : -1;
        const sy = (y0 < y1) ? 1 : -1;
        let err = dx - dy;

        let cx = x0;
        let cy = y0;

        while (true) {
            pts.push({ x: cx, y: cy });
            if (cx === x1 && cy === y1) break;
            const e2 = 2 * err;
            if (e2 > -dy) { err -= dy; cx += sx; }
            if (e2 < dx) { err += dx; cy += sy; }
        }
        return pts;
    }

    function drawPixelLine(x0, y0, x1, y1, color, size) {
        const points = getBresenhamPoints(x0, y0, x1, y1);
        for (let p of points) {
            drawPixelSquare(p.x, p.y, color, size);
        }
    }

    function fillPolygonScanline(points, colorHex) {
        if (points.length < 3) return;

        let minY = Infinity, maxY = -Infinity;
        for (let p of points) {
            if (p.y < minY) minY = p.y;
            if (p.y > maxY) maxY = p.y;
        }

        ctx.fillStyle = colorHex;
        
        for (let y = minY; y <= maxY; y++) {
            let intersections = [];
            let j = points.length - 1;
            
            for (let i = 0; i < points.length; i++) {
                let py_i = points[i].y;
                let px_i = points[i].x;
                let py_j = points[j].y;
                let px_j = points[j].x;

                if ((py_i <= y && py_j > y) || (py_j <= y && py_i > y)) {
                    let x = px_i + (y - py_i) / (py_j - py_i) * (px_j - px_i);
                    intersections.push(x);
                }
                j = i;
            }

            intersections.sort((a, b) => a - b);

            for (let i = 0; i < intersections.length; i += 2) {
                if (intersections[i + 1] !== undefined) {
                    let xStart = Math.floor(intersections[i]);
                    let xEnd = Math.ceil(intersections[i + 1]);
                    ctx.fillRect(xStart, y, (xEnd - xStart) + 1, 1);
                }
            }
        }
    }

    function floodFill(startX, startY, fillHex) {
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;

        const temp = document.createElement('div');
        temp.style.color = fillHex;
        document.body.appendChild(temp);
        const rgb = window.getComputedStyle(temp).color.match(/\d+/g);
        document.body.removeChild(temp);

        const fillR = parseInt(rgb[0], 10);
        const fillG = parseInt(rgb[1], 10);
        const fillB = parseInt(rgb[2], 10);

        const startIndex = (startY * canvas.width + startX) * 4;
        const targetR = data[startIndex];
        const targetG = data[startIndex + 1];
        const targetB = data[startIndex + 2];

        if (targetR === fillR && targetG === fillG && targetB === fillB) return;

        function matchTarget(idx) {
            return data[idx] === targetR && data[idx + 1] === targetG && data[idx + 2] === targetB;
        }

        function colorPixel(idx) {
            data[idx] = fillR;
            data[idx + 1] = fillG;
            data[idx + 2] = fillB;
            data[idx + 3] = 255;
        }

        const queue = [startX, startY];
        const w = canvas.width;
        const h = canvas.height;

        while (queue.length > 0) {
            const cy = queue.pop();
            const cx = queue.pop();

            let left = cx;
            while (left >= 0 && matchTarget((cy * w + left) * 4)) left--;
            left++;

            let right = cx;
            while (right < w && matchTarget((cy * w + right) * 4)) right++;
            right--;

            let spanUp = false;
            let spanDown = false;

            for (let x = left; x <= right; x++) {
                const curIdx = (cy * w + x) * 4;
                colorPixel(curIdx);

                if (cy > 0) {
                    const upIdx = ((cy - 1) * w + x) * 4;
                    if (matchTarget(upIdx)) {
                        if (!spanUp) { queue.push(x, cy - 1); spanUp = true; }
                    } else spanUp = false;
                }

                if (cy < h - 1) {
                    const downIdx = ((cy + 1) * w + x) * 4;
                    if (matchTarget(downIdx)) {
                        if (!spanDown) { queue.push(x, cy + 1); spanDown = true; }
                    } else spanDown = false;
                }
            }
        }

        ctx.putImageData(imgData, 0, 0);
    }

    canvas.addEventListener('pointerdown', (e) => {
        const { x, y } = getCoords(e);
        canvas.setPointerCapture(e.pointerId);

        if (currentTool === 'fill') {
            saveState();
            floodFill(x, y, currentColor);
            return;
        }

        saveState();
        isDrawing = true;
        lastX = x;
        lastY = y;

        if (currentTool === 'contour') {
            contourPoints = [{ x, y }];
            drawPixelSquare(x, y, currentColor, brushSize);
            return;
        }

        const activeColor = (currentTool === 'eraser') ? '#ffffff' : currentColor;
        drawPixelSquare(x, y, activeColor, brushSize);
    });

    canvas.addEventListener('pointermove', (e) => {
        if (!isDrawing) return;
        const { x, y } = getCoords(e);

        if (currentTool === 'contour') {
            let newPts = getBresenhamPoints(lastX, lastY, x, y);
            for (let i = 1; i < newPts.length; i++) {
                contourPoints.push(newPts[i]);
            }
            
            drawPixelLine(lastX, lastY, x, y, currentColor, brushSize);
            lastX = x;
            lastY = y;
            return;
        }

        const activeColor = (currentTool === 'eraser') ? '#ffffff' : currentColor;
        drawPixelLine(lastX, lastY, x, y, activeColor, brushSize);

        lastX = x;
        lastY = y;
    });

    function stopDrawing(e) {
        if (!isDrawing) return;
        isDrawing = false;

        if (currentTool === 'contour') {
            if (contourPoints.length > 2) {
                const first = contourPoints[0];
                const last = contourPoints[contourPoints.length - 1];
                
                let closePts = getBresenhamPoints(last.x, last.y, first.x, first.y);
                for (let i = 1; i < closePts.length - 1; i++) {
                    contourPoints.push(closePts[i]);
                }
                
                drawPixelLine(last.x, last.y, first.x, first.y, currentColor, brushSize);
                fillPolygonScanline(contourPoints, currentColor);
            }
            contourPoints = [];
        }

        try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
    }

    canvas.addEventListener('pointerup', stopDrawing);
    canvas.addEventListener('pointercancel', stopDrawing);
</script>
</body>
</html>
