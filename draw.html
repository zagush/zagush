<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAGUSH — РИСОВАТЬ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            image-rendering: pixelated;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #2b2118;
            background-image: url('stol.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            padding: 10px;
            overflow-y: auto;
            touch-action: pan-y;
            user-select: none;
        }

        /* 
           ОБЪЁМНАЯ ПИКСЕЛЬНАЯ РАМКА 
           - Обводка шириной 3px (#0d121d)
           - На углах отсутствует ровно 1 пиксель
           - Снизу и справа пиксельная тень (объём)
        */
        .pixel-box {
            background: #ffffff;
            position: relative;
            box-shadow: 
                /* Основная обводка толщиной 3px без крайнего пикселя на углу */
                -3px 0 0 0 #0d121d,
                3px 0 0 0 #0d121d,
                0 -3px 0 0 #0d121d,
                0 3px 0 0 #0d121d,
                -2px -2px 0 0 #0d121d,
                2px -2px 0 0 #0d121d,
                -2px 2px 0 0 #0d121d,
                2px 2px 0 0 #0d121d,
                /* Объёмная пиксельная тень снизу и справа */
                3px 3px 0 0 #0d121d,
                3px 6px 0 0 rgba(0, 0, 0, 0.35),
                0 6px 0 0 rgba(0, 0, 0, 0.35);
            margin: 6px;
        }

        /* Панель инструментов */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 12px;
            z-index: 10;
            max-width: 98vw;
        }

        /* 
           ОБЪЁМНЫЕ ПИКСЕЛЬНЫЕ КНОПКИ
           - Ширина обводки 3px
           - Отсутствует 1 пиксель на углах
           - Пиксельный объём внутри
        */
        .tool-btn {
            background: #ffffff;
            border: none;
            outline: none;
            font-weight: bold;
            font-size: 12px;
            padding: 6px 10px;
            cursor: pointer;
            color: #0d121d;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            text-decoration: none;
            position: relative;
            margin: 3px;
            box-shadow: 
                /* Обводка 3px с отсутствующим углом в 1px */
                -3px 0 0 0 #0d121d,
                3px 0 0 0 #0d121d,
                0 -3px 0 0 #0d121d,
                0 3px 0 0 #0d121d,
                -2px -2px 0 0 #0d121d,
                2px -2px 0 0 #0d121d,
                -2px 2px 0 0 #0d121d,
                2px 2px 0 0 #0d121d,
                /* Нижний пиксельный объём кнопки */
                0 3px 0 0 #b1b5c2,
                3px 3px 0 0 #0d121d;
            transition: transform 0.05s, box-shadow 0.05s, background 0.1s;
        }

        .tool-btn:hover:not(:disabled) {
            background: #f1f5f9;
        }

        .tool-btn:active:not(:disabled) {
            transform: translate(0, 2px);
            box-shadow: 
                -3px 0 0 0 #0d121d,
                3px 0 0 0 #0d121d,
                0 -3px 0 0 #0d121d,
                0 3px 0 0 #0d121d,
                -2px -2px 0 0 #0d121d,
                2px -2px 0 0 #0d121d,
                -2px 2px 0 0 #0d121d,
                2px 2px 0 0 #0d121d,
                0 1px 0 0 #b1b5c2;
        }

        /* Нажатая / Активная кнопка */
        .tool-btn.active {
            background: #0d121d;
            color: #ffffff;
            box-shadow: 
                -3px 0 0 0 #0d121d,
                3px 0 0 0 #0d121d,
                0 -3px 0 0 #0d121d,
                0 3px 0 0 #0d121d,
                -2px -2px 0 0 #0d121d,
                2px -2px 0 0 #0d121d,
                -2px 2px 0 0 #0d121d,
                2px 2px 0 0 #0d121d,
                0 3px 0 0 #000000;
        }

        .tool-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* Акцентные цвета кнопок */
        .back-btn {
            background: #ff5252;
            color: #ffffff;
        }

        .back-btn:hover {
            background: #ef4444;
        }

        .clear-btn {
            background: #fde047;
            color: #0d121d;
        }

        .clear-btn:hover {
            background: #facc15;
        }

        /* Выбор размера пикселя */
        .size-picker {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: bold;
            background: #ffffff;
            padding: 4px 8px;
            margin: 3px;
            box-shadow: 
                -3px 0 0 0 #0d121d,
                3px 0 0 0 #0d121d,
                0 -3px 0 0 #0d121d,
                0 3px 0 0 #0d121d,
                -2px -2px 0 0 #0d121d,
                2px -2px 0 0 #0d121d,
                -2px 2px 0 0 #0d121d,
                2px 2px 0 0 #0d121d,
                0 3px 0 0 #b1b5c2;
        }

        .size-picker input {
            cursor: pointer;
            width: 60px;
        }

        /* Зум индикатор и кнопки */
        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .zoom-display {
            font-size: 11px;
            font-weight: bold;
            min-width: 42px;
            text-align: center;
        }

        /* Контейнер холста */
        .canvas-container {
            position: relative;
            background: #ffffff;
            max-width: 95vw;
            max-height: 65vh;
            overflow: auto;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
        }

        canvas {
            display: block;
            cursor: crosshair;
            background: #ffffff;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            transform-origin: 0 0;
            touch-action: none;
        }

        /* Палитра */
        .bottom-palette {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 10px;
            max-width: 98vw;
            flex-wrap: wrap;
            z-index: 10;
            margin-bottom: 20px;
        }

        .current-color-preview {
            width: 26px;
            height: 26px;
            margin: 3px;
            box-shadow: 
                -3px 0 0 0 #0d121d,
                3px 0 0 0 #0d121d,
                0 -3px 0 0 #0d121d,
                0 3px 0 0 #0d121d,
                -2px -2px 0 0 #0d121d,
                2px -2px 0 0 #0d121d,
                -2px 2px 0 0 #0d121d,
                2px 2px 0 0 #0d121d;
        }

        .palette-swatches {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .swatch {
            width: 22px;
            height: 22px;
            cursor: pointer;
            margin: 3px;
            box-shadow: 
                -3px 0 0 0 #0d121d,
                3px 0 0 0 #0d121d,
                0 -3px 0 0 #0d121d,
                0 3px 0 0 #0d121d,
                -2px -2px 0 0 #0d121d,
                2px -2px 0 0 #0d121d,
                -2px 2px 0 0 #0d121d,
                2px 2px 0 0 #0d121d;
            transition: transform 0.1s;
        }

        .swatch:hover {
            transform: scale(1.15);
        }

        .color-input-btn {
            width: 30px;
            height: 30px;
            padding: 0;
            border: none;
            cursor: pointer;
            background: transparent;
            margin: 3px;
            box-shadow: 
                -3px 0 0 0 #0d121d,
                3px 0 0 0 #0d121d,
                0 -3px 0 0 #0d121d,
                0 3px 0 0 #0d121d,
                -2px -2px 0 0 #0d121d,
                2px -2px 0 0 #0d121d,
                -2px 2px 0 0 #0d121d,
                2px 2px 0 0 #0d121d;
        }

        .color-input-btn::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .color-input-btn::-webkit-color-swatch {
            border: none;
        }
    </style>
</head>
<body>

    <!-- Панель инструментов -->
    <div class="toolbar pixel-box">
        <a href="index.html" class="tool-btn back-btn">← НА СТОЛ</a>

        <button id="undoBtn" class="tool-btn" title="Отмена (Ctrl+Z)" disabled>↶ НАЗАД</button>
        <button id="redoBtn" class="tool-btn" title="Повтор (Ctrl+Y)" disabled>↷ ВПЕРЁД</button>

        <button id="pencilBtn" class="tool-btn active" title="Карандаш (B)">КАРАНДАШ [B]</button>
        <button id="contourBtn" class="tool-btn" title="Контур (D)">КОНТУР [D]</button>
        <button id="fillBtn" class="tool-btn" title="Заливка (G)">ЗАЛИВКА [G]</button>
        <button id="eraserBtn" class="tool-btn" title="Ластик (E)">ЛАСТИК [E]</button>

        <div class="zoom-controls">
            <button id="zoomOutBtn" class="tool-btn" title="Отдалить [−]">-</button>
            <span id="zoomValue" class="zoom-display">100%</span>
            <button id="zoomInBtn" class="tool-btn" title="Приблизить [+]">+</button>
        </div>

        <div class="size-picker">
            <span>РАЗМЕР:</span>
            <input type="range" id="sizeSlider" min="1" max="24" value="3">
            <span id="sizeValue">3px</span>
        </div>

        <button id="clearBtn" class="tool-btn clear-btn">ОЧИСТИТЬ</button>
        <button id="saveBtn" class="tool-btn">СКАЧАТЬ</button>
    </div>

    <!-- Холст -->
    <div class="canvas-container pixel-box" id="canvasContainer">
        <canvas id="paintCanvas"></canvas>
    </div>

    <!-- Палитра -->
    <div class="bottom-palette pixel-box">
        <input type="color" id="customColorPicker" class="color-input-btn" value="#000000" title="Выбрать свой цвет">
        <div id="currentColorPreview" class="current-color-preview" style="background: #000000;"></div>
        <div class="palette-swatches" id="swatchesContainer"></div>
    </div>

    <script>
        const canvas = document.getElementById('paintCanvas');
        const container = document.getElementById('canvasContainer');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        const undoBtn = document.getElementById('undoBtn');
        const redoBtn = document.getElementById('redoBtn');
        const pencilBtn = document.getElementById('pencilBtn');
        const contourBtn = document.getElementById('contourBtn');
        const fillBtn = document.getElementById('fillBtn');
        const eraserBtn = document.getElementById('eraserBtn');

        const zoomInBtn = document.getElementById('zoomInBtn');
        const zoomOutBtn = document.getElementById('zoomOutBtn');
        const zoomValue = document.getElementById('zoomValue');

        const clearBtn = document.getElementById('clearBtn');
        const saveBtn = document.getElementById('saveBtn');

        const sizeSlider = document.getElementById('sizeSlider');
        const sizeValue = document.getElementById('sizeValue');
        const swatchesContainer = document.getElementById('swatchesContainer');
        const customColorPicker = document.getElementById('customColorPicker');
        const currentColorPreview = document.getElementById('currentColorPreview');

        const PALETTE = [
            '#000000', '#ffffff', '#99f553', '#ff8ff6',
            '#ff000d', '#ffabaf', '#f50018', '#630005',
            '#94c4ff', '#3183e8', '#262e85', '#ffff7d',
            '#ff8126', '#ffa361', '#d561ff', '#8150cc'
        ];

        let currentTool = 'pencil';
        let currentColor = '#000000';
        let brushSize = 3;
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        let contourPoints = [];

        let currentScale = 1;
        const MIN_SCALE = 0.5;
        const MAX_SCALE = 4.0;
        const SCALE_STEP = 0.25;

        const MAX_HISTORY = 30;
        let undoStack = [];
        let redoStack = [];

        function saveState() {
            if (undoStack.length >= MAX_HISTORY) undoStack.shift();
            undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
            redoStack = [];
            updateHistoryButtons();
        }

        function undo() {
            if (undoStack.length === 0) return;
            redoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
            const prev = undoStack.pop();
            ctx.putImageData(prev, 0, 0);
            updateHistoryButtons();
        }

        function redo() {
            if (redoStack.length === 0) return;
            undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
            const next = redoStack.pop();
            ctx.putImageData(next, 0, 0);
            updateHistoryButtons();
        }

        function updateHistoryButtons() {
            undoBtn.disabled = (undoStack.length === 0);
            redoBtn.disabled = (redoStack.length === 0);
        }

        undoBtn.addEventListener('click', undo);
        redoBtn.addEventListener('click', redo);

        function initCanvas() {
            const w = Math.min(Math.floor(window.innerWidth * 0.92), 850);
            const h = Math.min(Math.floor(window.innerHeight * 0.65), 580);
            canvas.width = w;
            canvas.height = h;

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);
            ctx.imageSmoothingEnabled = false;
        }
        initCanvas();

        PALETTE.forEach(col => {
            const swatch = document.createElement('div');
            swatch.className = 'swatch';
            swatch.style.background = col;
            swatch.addEventListener('click', () => setColor(col));
            swatchesContainer.appendChild(swatch);
        });

        function setColor(hex) {
            currentColor = hex;
            currentColorPreview.style.background = hex;
            customColorPicker.value = hex;
            if (currentTool === 'eraser') setTool('pencil');
        }

        customColorPicker.addEventListener('input', (e) => setColor(e.target.value));

        function setTool(tool) {
            currentTool = tool;
            [pencilBtn, contourBtn, fillBtn, eraserBtn].forEach(b => b.classList.remove('active'));
            if (tool === 'pencil') pencilBtn.classList.add('active');
            if (tool === 'contour') contourBtn.classList.add('active');
            if (tool === 'fill') fillBtn.classList.add('active');
            if (tool === 'eraser') eraserBtn.classList.add('active');
        }

        pencilBtn.addEventListener('click', () => setTool('pencil'));
        contourBtn.addEventListener('click', () => setTool('contour'));
        fillBtn.addEventListener('click', () => setTool('fill'));
        eraserBtn.addEventListener('click', () => setTool('eraser'));

        function setZoom(scale) {
            currentScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale));
            canvas.style.transform = `scale(${currentScale})`;
            canvas.style.marginRight = `${(currentScale - 1) * canvas.width}px`;
            canvas.style.marginBottom = `${(currentScale - 1) * canvas.height}px`;
            zoomValue.textContent = Math.round(currentScale * 100) + '%';
        }

        zoomInBtn.addEventListener('click', () => setZoom(currentScale + SCALE_STEP));
        zoomOutBtn.addEventListener('click', () => setZoom(currentScale - SCALE_STEP));

        window.addEventListener('keydown', (e) => {
            const isCtrl = e.ctrlKey || e.metaKey;
            if (isCtrl && (e.key === 'z' || e.key === 'Z' || e.key === 'я' || e.key === 'Я')) {
                e.preventDefault();
                if (e.altKey || e.shiftKey) redo(); else undo();
                return;
            }
            if (isCtrl && (e.key === 'y' || e.key === 'Y' || e.key === 'н' || e.key === 'Н')) {
                e.preventDefault();
                redo();
                return;
            }
            if (!isCtrl) {
                const key = e.key.toLowerCase();
                if (key === 'b' || key === 'и') setTool('pencil');
                if (key === 'd' || key === 'в') setTool('contour');
                if (key === 'g' || key === 'п') setTool('fill');
                if (key === 'e' || key === 'у') setTool('eraser');
            }
        });

        sizeSlider.addEventListener('input', (e) => {
            brushSize = parseInt(e.target.value, 10);
            sizeValue.textContent = brushSize + 'px';
        });

        clearBtn.addEventListener('click', () => {
            if (confirm("Очистить весь лист?")) {
                saveState();
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        });

        saveBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'art.png';
            link.href = canvas.toDataURL();
            link.click();
        });

        function getCoords(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: Math.floor((e.clientX - rect.left) / currentScale),
                y: Math.floor((e.clientY - rect.top) / currentScale)
            };
        }

        function drawPixelSquare(x, y, color, size) {
            ctx.fillStyle = color;
            ctx.fillRect(Math.floor(x - size / 2), Math.floor(y - size / 2), size, size);
        }

        function drawPixelLine(x0, y0, x1, y1, color, size) {
            const dx = Math.abs(x1 - x0);
            const dy = Math.abs(y1 - y0);
            const sx = (x0 < x1) ? 1 : -1;
            const sy = (y0 < y1) ? 1 : -1;
            let err = dx - dy;

            while (true) {
                drawPixelSquare(x0, y0, color, size);
                if (x0 === x1 && y0 === y1) break;
                const e2 = 2 * err;
                if (e2 > -dy) { err -= dy; x0 += sx; }
                if (e2 < dx) { err += dx; y0 += sy; }
            }
        }

        canvas.addEventListener('pointerdown', (e) => {
            const { x, y } = getCoords(e);
            canvas.setPointerCapture(e.pointerId);

            saveState();
            isDrawing = true;
            lastX = x;
            lastY = y;

            const col = (currentTool === 'eraser') ? '#ffffff' : currentColor;
            drawPixelSquare(x, y, col, brushSize);
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDrawing) return;
            const { x, y } = getCoords(e);

            const col = (currentTool === 'eraser') ? '#ffffff' : currentColor;
            drawPixelLine(lastX, lastY, x, y, col, brushSize);

            lastX = x;
            lastY = y;
        });

        function stopDrawing(e) {
            if (!isDrawing) return;
            isDrawing = false;
            try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
        }

        canvas.addEventListener('pointerup', stopDrawing);
        canvas.addEventListener('pointercancel', stopDrawing);
    </script>
</body>
</html>
