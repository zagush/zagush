<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAGUSH — РИСОВАТЬ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            image-rendering: pixelated;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #2b2118;
            background-image: url('stol.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            padding: 10px;
            overflow-y: auto;
            touch-action: pan-y;
            user-select: none;
        }

        /* Пиксельный стиль рамок в точности как на референсе */
        .pixel-border {
            background: #ffffff;
            position: relative;
            box-shadow: 
                /* Черная пиксельная рамка со срезанными уголками */
                -3px 0 0 0 #0d121d,
                3px 0 0 0 #0d121d,
                0 -3px 0 0 #0d121d,
                0 3px 0 0 #0d121d,
                -2px -2px 0 0 #0d121d,
                2px -2px 0 0 #0d121d,
                -2px 2px 0 0 #0d121d,
                2px 2px 0 0 #0d121d;
            margin: 4px;
        }

        /* Панель инструментов */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 10px;
            z-index: 10;
            max-width: 98vw;
        }

        /* Кнопки с точным пиксельным дизайном */
        .tool-btn {
            background: #e2e8f0;
            border: none;
            outline: none;
            font-weight: bold;
            font-size: 12px;
            padding: 6px 10px;
            cursor: pointer;
            color: #0d121d;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            text-decoration: none;
            box-shadow: 
                -2px 0 0 0 #0d121d,
                2px 0 0 0 #0d121d,
                0 -2px 0 0 #0d121d,
                0 2px 0 0 #0d121d;
            margin: 2px;
            transition: background 0.1s;
        }

        .tool-btn:hover:not(:disabled) {
            background: #cbd5e1;
        }

        .tool-btn:active:not(:disabled) {
            background: #94a3b8;
        }

        .tool-btn.active {
            background: #0d121d;
            color: #ffffff;
        }

        .tool-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .back-btn {
            background: #f87171;
            color: #ffffff;
        }

        .back-btn:hover {
            background: #ef4444;
        }

        .clear-btn {
            background: #fde047;
        }

        /* Блок выбора размера */
        .size-picker {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: bold;
            background: #f1f5f9;
            padding: 4px 8px;
            box-shadow: 
                -2px 0 0 0 #0d121d,
                2px 0 0 0 #0d121d,
                0 -2px 0 0 #0d121d,
                0 2px 0 0 #0d121d;
            margin: 2px;
        }

        .size-picker input {
            cursor: pointer;
            width: 60px;
        }

        /* Блок зума */
        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .zoom-display {
            font-size: 11px;
            font-weight: bold;
            min-width: 42px;
            text-align: center;
        }

        /* Контейнер холста */
        .canvas-container {
            position: relative;
            background: #ffffff;
            max-width: 95vw;
            max-height: 65vh;
            overflow: auto;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
        }

        canvas {
            display: block;
            cursor: crosshair;
            background: #ffffff;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            transform-origin: 0 0;
            touch-action: none;
        }

        /* Нижняя панель */
        .bottom-palette {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 10px;
            max-width: 98vw;
            flex-wrap: wrap;
            z-index: 10;
            margin-bottom: 20px;
        }

        .current-color-preview {
            width: 24px;
            height: 24px;
            box-shadow: 
                -2px 0 0 0 #0d121d,
                2px 0 0 0 #0d121d,
                0 -2px 0 0 #0d121d,
                0 2px 0 0 #0d121d;
            margin-right: 4px;
        }

        .palette-swatches {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .swatch {
            width: 20px;
            height: 20px;
            cursor: pointer;
            box-shadow: 
                -2px 0 0 0 #0d121d,
                2px 0 0 0 #0d121d,
                0 -2px 0 0 #0d121d,
                0 2px 0 0 #0d121d;
            margin: 2px;
        }

        .swatch:hover {
            transform: scale(1.15);
        }

        .color-input-btn {
            width: 28px;
            height: 28px;
            padding: 0;
            border: none;
            cursor: pointer;
            background: transparent;
            box-shadow: 
                -2px 0 0 0 #0d121d,
                2px 0 0 0 #0d121d,
                0 -2px 0 0 #0d121d,
                0 2px 0 0 #0d121d;
        }

        .color-input-btn::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .color-input-btn::-webkit-color-swatch {
            border: none;
        }
    </style>
</head>
<body>

    <!-- Верхнее меню -->
    <div class="toolbar pixel-border">
        <a href="index.html" class="tool-btn back-btn">← НА СТОЛ</a>

        <button id="undoBtn" class="tool-btn" title="Отмена (Ctrl+Z)" disabled>↶ НАЗАД</button>
        <button id="redoBtn" class="tool-btn" title="Повтор (Ctrl+Y)" disabled>↷ ВПЕРЁД</button>

        <button id="pencilBtn" class="tool-btn active" title="Карандаш (B)">КАРАНДАШ [B]</button>
        <button id="contourBtn" class="tool-btn" title="Контур (D)">КОНТУР [D]</button>
        <button id="fillBtn" class="tool-btn" title="Заливка (G)">ЗАЛИВКА [G]</button>
        <button id="eraserBtn" class="tool-btn" title="Ластик (E)">ЛАСТИК [E]</button>

        <!-- Кнопки Приближения ПЛЮС / МИНУС -->
        <div class="zoom-controls">
            <button id="zoomOutBtn" class="tool-btn" title="Отдалить [−]">-</button>
            <span id="zoomValue" class="zoom-display">100%</span>
            <button id="zoomInBtn" class="tool-btn" title="Приблизить [+]">+</button>
        </div>

        <div class="size-picker">
            <span>РАЗМЕР:</span>
            <input type="range" id="sizeSlider" min="1" max="24" value="3">
            <span id="sizeValue">3px</span>
        </div>

        <button id="clearBtn" class="tool-btn clear-btn">ОЧИСТИТЬ</button>
        <button id="saveBtn" class="tool-btn">СКАЧАТЬ</button>
    </div>

    <!-- Холст со скроллом -->
    <div class="canvas-container pixel-border" id="canvasContainer">
        <canvas id="paintCanvas"></canvas>
    </div>

    <!-- Палитра -->
    <div class="bottom-palette pixel-border">
        <input type="color" id="customColorPicker" class="color-input-btn" value="#000000" title="Выбрать свой цвет">
        <div id="currentColorPreview" class="current-color-preview" style="background: #000000;"></div>
        <div class="palette-swatches" id="swatchesContainer"></div>
    </div>

    <script>
        const canvas = document.getElementById('paintCanvas');
        const container = document.getElementById('canvasContainer');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        // Кнопки
        const undoBtn = document.getElementById('undoBtn');
        const redoBtn = document.getElementById('redoBtn');
        const pencilBtn = document.getElementById('pencilBtn');
        const contourBtn = document.getElementById('contourBtn');
        const fillBtn = document.getElementById('fillBtn');
        const eraserBtn = document.getElementById('eraserBtn');

        const zoomInBtn = document.getElementById('zoomInBtn');
        const zoomOutBtn = document.getElementById('zoomOutBtn');
        const zoomValue = document.getElementById('zoomValue');

        const clearBtn = document.getElementById('clearBtn');
        const saveBtn = document.getElementById('saveBtn');

        const sizeSlider = document.getElementById('sizeSlider');
        const sizeValue = document.getElementById('sizeValue');
        const swatchesContainer = document.getElementById('swatchesContainer');
        const customColorPicker = document.getElementById('customColorPicker');
        const currentColorPreview = document.getElementById('currentColorPreview');

        const PALETTE = [
            '#000000', '#ffffff', '#99f553', '#ff8ff6',
            '#ff000d', '#ffabaf', '#f50018', '#630005',
            '#94c4ff', '#3183e8', '#262e85', '#ffff7d',
            '#ff8126', '#ffa361', '#d561ff', '#8150cc'
        ];

        let currentTool = 'pencil';
        let currentColor = '#000000';
        let brushSize = 3;
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        let contourPoints = [];

        // Масштабирование (+/-)
        let currentScale = 1;
        const MIN_SCALE = 0.5;
        const MAX_SCALE = 4.0;
        const SCALE_STEP = 0.25;

        // История
        const MAX_HISTORY = 30;
        let undoStack = [];
        let redoStack = [];

        function saveState() {
            if (undoStack.length >= MAX_HISTORY) undoStack.shift();
            undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
            redoStack = [];
            updateHistoryButtons();
        }

        function undo() {
            if (undoStack.length === 0) return;
            redoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
            const prev = undoStack.pop();
            ctx.putImageData(prev, 0, 0);
            updateHistoryButtons();
        }

        function redo() {
            if (redoStack.length === 0) return;
            undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
            const next = redoStack.pop();
            ctx.putImageData(next, 0, 0);
            updateHistoryButtons();
        }

        function updateHistoryButtons() {
            undoBtn.disabled = (undoStack.length === 0);
            redoBtn.disabled = (redoStack.length === 0);
        }

        undoBtn.addEventListener('click', undo);
        redoBtn.addEventListener('click', redo);

        function initCanvas() {
            const w = Math.min(Math.floor(window.innerWidth * 0.92), 850);
            const h = Math.min(Math.floor(window.innerHeight * 0.65), 580);
            canvas.width = w;
            canvas.height = h;

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);
            ctx.imageSmoothingEnabled = false;
        }
        initCanvas();

        PALETTE.forEach(col => {
            const swatch = document.createElement('div');
            swatch.className = 'swatch';
            swatch.style.background = col;
            swatch.addEventListener('click', () => setColor(col));
            swatchesContainer.appendChild(swatch);
        });

        function setColor(hex) {
            currentColor = hex;
            currentColorPreview.style.background = hex;
            customColorPicker.value = hex;
            if (currentTool === 'eraser') setTool('pencil');
        }

        customColorPicker.addEventListener('input', (e) => setColor(e.target.value));

        function setTool(tool) {
            currentTool = tool;
            [pencilBtn, contourBtn, fillBtn, eraserBtn].forEach(b => b.classList.remove('active'));
            if (tool === 'pencil') pencilBtn.classList.add('active');
            if (tool === 'contour') contourBtn.classList.add('active');
            if (tool === 'fill') fillBtn.classList.add('active');
            if (tool === 'eraser') eraserBtn.classList.add('active');
        }

        pencilBtn.addEventListener('click', () => setTool('pencil'));
        contourBtn.addEventListener('click', () => setTool('contour'));
        fillBtn.addEventListener('click', () => setTool('fill'));
        eraserBtn.addEventListener('click', () => setTool('eraser'));

        // КНОПКИ ПРИБЛИЖЕНИЯ И ОТДАЛЕНИЯ
        function setZoom(scale) {
            currentScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale));
            canvas.style.transform = `scale(${currentScale})`;
            canvas.style.marginRight = `${(currentScale - 1) * canvas.width}px`;
            canvas.style.marginBottom = `${(currentScale - 1) * canvas.height}px`;
            zoomValue.textContent = Math.round(currentScale * 100) + '%';
        }

        zoomInBtn.addEventListener('click', () => setZoom(currentScale + SCALE_STEP));
        zoomOutBtn.addEventListener('click', () => setZoom(currentScale - SCALE_STEP));

        // Горячие клавиши
        window.addEventListener('keydown', (e) => {
            const isCtrl = e.ctrlKey || e.metaKey;
            if (isCtrl && (e.key === 'z' || e.key === 'Z' || e.key === 'я' || e.key === 'Я')) {
                e.preventDefault();
                if (e.altKey || e.shiftKey) redo(); else undo();
                return;
            }
            if (isCtrl && (e.key === 'y' || e.key === 'Y' || e.key === 'н' || e.key === 'Н')) {
                e.preventDefault();
                redo();
                return;
            }
            if (!isCtrl) {
                const key = e.key.toLowerCase();
                if (key === 'b' || key === 'и') setTool('pencil');
                if (key === 'd' || key === 'в') setTool('contour');
                if (key === 'g' || key === 'п') setTool('fill');
                if (key === 'e' || key === 'у') setTool('eraser');
            }
        });

        sizeSlider.addEventListener('input', (e) => {
            brushSize = parseInt(e.target.value, 10);
            sizeValue.textContent = brushSize + 'px';
        });

        clearBtn.addEventListener('click', () => {
            if (confirm("Очистить весь лист?")) {
                saveState();
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        });

        saveBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'art.png';
            link.href = canvas.toDataURL();
            link.click();
        });

        function getCoords(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: Math.floor((e.clientX - rect.left) / currentScale),
                y: Math.floor((e.clientY - rect.top) / currentScale)
            };
        }

        function drawPixelSquareOnCtx(targetCtx, x, y, color, size) {
            targetCtx.fillStyle = color;
            targetCtx.fillRect(Math.floor(x - size / 2), Math.floor(y - size / 2), size, size);
        }

        function drawPixelLineOnCtx(targetCtx, x0, y0, x1, y1, color, size) {
            const dx = Math.abs(x1 - x0);
            const dy = Math.abs(y1 - y0);
            const sx = (x0 < x1) ? 1 : -1;
            const sy = (y0 < y1) ? 1 : -1;
            let err = dx - dy;

            while (true) {
                drawPixelSquareOnCtx(targetCtx, x0, y0, color, size);
                if (x0 === x1 && y0 === y1) break;
                const e2 = 2 * err;
                if (e2 > -dy) { err -= dy; x0 += sx; }
                if (e2 < dx) { err += dx; y0 += sy; }
            }
        }

        // ИДЕАЛЬНЫЙ КОНТУР БЕЗ ПРОПУСКОВ ПИКСЕЛЕЙ ПО КРАЯМ
        function processContourFill() {
            if (contourPoints.length < 3) return;

            // 1. Вычисляем центр фигуры для заливки
            let sumX = 0, sumY = 0;
            contourPoints.forEach(p => { sumX += p.x; sumY += p.y; });
            const centerX = Math.round(sumX / contourPoints.length);
            const centerY = Math.round(sumY / contourPoints.length);

            // 2. Создаем временный холст в память
            const offCanvas = document.createElement('canvas');
            offCanvas.width = canvas.width;
            offCanvas.height = canvas.height;
            const offCtx = offCanvas.getContext('2d');
            offCtx.fillStyle = '#ffffff';
            offCtx.fillRect(0, 0, offCanvas.width, offCanvas.height);

            // 3. Рисуем замкнутую пиксельную границу
            for (let i = 0; i < contourPoints.length; i++) {
                const p1 = contourPoints[i];
                const p2 = contourPoints[(i + 1) % contourPoints.length];
                drawPixelLineOnCtx(offCtx, p1.x, p1.y, p2.x, p2.y, '#000000', brushSize);
            }

            // 4. Заливаем внутренности растровой заливкой
            floodFillOnCtx(offCtx, centerX, centerY, '#000000');

            // 5. Переносим получившуюся фигуру на основной холст с нужным цветом
            const offImg = offCtx.getImageData(0, 0, canvas.width, canvas.height);
            const mainImg = ctx.getImageData(0, 0, canvas.width, canvas.height);

            const tempDiv = document.createElement('div');
            tempDiv.style.color = currentColor;
            document.body.appendChild(tempDiv);
            const rgbMatch = window.getComputedStyle(tempDiv).color.match(/\d+/g);
            document.body.removeChild(tempDiv);

            const r = parseInt(rgbMatch[0], 10);
            const g = parseInt(rgbMatch[1], 10);
            const b = parseInt(rgbMatch[2], 10);

            for (let i = 0; i < offImg.data.length; i += 4) {
                // Если пиксель во временном буфере черный (границы или закрашен)
                if (offImg.data[i] === 0 && offImg.data[i + 1] === 0 && offImg.data[i + 2] === 0) {
                    mainImg.data[i] = r;
                    mainImg.data[i + 1] = g;
                    mainImg.data[i + 2] = b;
                    mainImg.data[i + 3] = 255;
                }
            }

            ctx.putImageData(mainImg, 0, 0);
        }

        // Заливка
        function floodFillOnCtx(targetCtx, startX, startY, fillHex) {
            const imgData = targetCtx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;

            const tempDiv = document.createElement('div');
            tempDiv.style.color = fillHex;
            document.body.appendChild(tempDiv);
            const rgbMatch = window.getComputedStyle(tempDiv).color.match(/\d+/g);
            document.body.removeChild(tempDiv);

            const fillR = parseInt(rgbMatch[0], 10);
            const fillG = parseInt(rgbMatch[1], 10);
            const fillB = parseInt(rgbMatch[2], 10);

            const startIndex = (startY * canvas.width + startX) * 4;
            const targetR = data[startIndex];
            const targetG = data[startIndex + 1];
            const targetB = data[startIndex + 2];

            if (targetR === fillR && targetG === fillG && targetB === fillB) return;

            function matchTarget(idx) {
                return data[idx] === targetR && data[idx + 1] === targetG && data[idx + 2] === targetB;
            }

            function colorPixel(idx) {
                data[idx] = fillR;
                data[idx + 1] = fillG;
                data[idx + 2] = fillB;
                data[idx + 3] = 255;
            }

            const queue = [startX, startY];
            const w = canvas.width;
            const h = canvas.height;

            while (queue.length > 0) {
                const cy = queue.pop();
                const cx = queue.pop();

                let left = cx;
                while (left >= 0 && matchTarget((cy * w + left) * 4)) left--;
                left++;

                let right = cx;
                while (right < w && matchTarget((cy * w + right) * 4)) right++;
                right--;

                let spanUp = false;
                let spanDown = false;

                for (let x = left; x <= right; x++) {
                    const curIdx = (cy * w + x) * 4;
                    colorPixel(curIdx);

                    if (cy > 0) {
                        const upIdx = ((cy - 1) * w + x) * 4;
                        if (matchTarget(upIdx)) {
                            if (!spanUp) { queue.push(x, cy - 1); spanUp = true; }
                        } else spanUp = false;
                    }

                    if (cy < h - 1) {
                        const downIdx = ((cy + 1) * w + x) * 4;
                        if (matchTarget(downIdx)) {
                            if (!spanDown) { queue.push(x, cy + 1); spanDown = true; }
                        } else spanDown = false;
                    }
                }
            }

            targetCtx.putImageData(imgData, 0, 0);
        }

        // События мыши/тача
        canvas.addEventListener('pointerdown', (e) => {
            const { x, y } = getCoords(e);
            canvas.setPointerCapture(e.pointerId);

            if (currentTool === 'fill') {
                saveState();
                floodFillOnCtx(ctx, x, y, currentColor);
                return;
            }

            saveState();
            isDrawing = true;
            lastX = x;
            lastY = y;

            if (currentTool === 'contour') {
                contourPoints = [{ x, y }];
                drawPixelSquareOnCtx(ctx, x, y, currentColor, brushSize);
            } else {
                const col = (currentTool === 'eraser') ? '#ffffff' : currentColor;
                drawPixelSquareOnCtx(ctx, x, y, col, brushSize);
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDrawing) return;
            const { x, y } = getCoords(e);

            if (currentTool === 'contour') {
                contourPoints.push({ x, y });
                drawPixelLineOnCtx(ctx, lastX, lastY, x, y, currentColor, brushSize);
            } else if (currentTool === 'pencil' || currentTool === 'eraser') {
                const col = (currentTool === 'eraser') ? '#ffffff' : currentColor;
                drawPixelLineOnCtx(ctx, lastX, lastY, x, y, col, brushSize);
            }

            lastX = x;
            lastY = y;
        });

        function stopDrawing(e) {
            if (!isDrawing) return;
            isDrawing = false;
            try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}

            if (currentTool === 'contour') {
                processContourFill();
                contourPoints = [];
            }
        }

        canvas.addEventListener('pointerup', stopDrawing);
        canvas.addEventListener('pointercancel', stopDrawing);
    </script>
</body>
</html>
