<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>ZAGUSH — CONTACTS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-text-stroke: 0 !important;
        }

        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        body {
            background-color: #2b2118;
            background-image: url('./stol.jpg');
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;
            background-repeat: no-repeat;
            font-family: Arial, Helvetica, sans-serif;
            color: #1a1a1a;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Верхняя панель */
        .top-bar {
            position: fixed;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            pointer-events: none;
        }

        .back-desk-btn, .lang-btn {
            background: #ffffff;
            color: #000;
            font-family: 'Rubik Mono One', monospace, sans-serif;
            font-size: 11px;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 3px 5px 12px rgba(0, 0, 0, 0.35);
            transition: transform 0.15s ease, background 0.15s ease;
            user-select: none;
            pointer-events: auto;
        }

        .back-desk-btn:hover, .lang-btn:hover {
            transform: translateY(-2px);
            background: #f0f0f0;
        }

        /* Лист письма */
        .letter-sheet {
            width: min(940px, 92vw);
            height: min(660px, 86vh);
            background-color: transparent;
            background-image: url('./paper-contacts-pc.png');
            background-position: center center;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.55));
            position: relative;
            display: flex;
            flex-direction: column;
            /* Отступ сверху, чтобы не закрывать надписи From / to */
            padding: clamp(80px, 13vh, 110px) clamp(30px, 5vw, 70px) clamp(30px, 4vw, 50px);
            image-rendering: pixelated;
        }

        /* Сетка под марки */
        .stamps-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 22px;
            align-content: center;
            justify-items: center;
            padding: 10px;
        }

        /* Стиль марки, лежащей на бумаге */
        .stamp-card {
            width: 100%;
            max-width: 160px;
            height: 185px;
            background: #fcfbf7;
            /* Реалистичные слоеные тени бумаги на бумаге */
            box-shadow: 
                1px 2px 3px rgba(45, 30, 15, 0.15),
                3px 6px 12px rgba(45, 30, 15, 0.22);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 2px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.3, 1), box-shadow 0.2s ease;
            position: relative;
        }

        /* Внутренняя перфорированная рамка марки */
        .stamp-inner {
            width: 100%;
            height: 100%;
            border: 2px dashed rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 12px 6px 10px;
        }

        /* Естественные наклоны марок на столе */
        .stamp-card:nth-child(1) { transform: rotate(-2deg); }
        .stamp-card:nth-child(2) { transform: rotate(1.5deg); }
        .stamp-card:nth-child(3) { transform: rotate(-1deg); }
        .stamp-card:nth-child(4) { transform: rotate(2.2deg); }

        /* Эффект поднятия марки при наведении */
        .stamp-card:hover {
            transform: translateY(-6px) scale(1.04) rotate(0deg) !important;
            box-shadow: 
                2px 4px 6px rgba(45, 30, 15, 0.15),
                6px 14px 22px rgba(45, 30, 15, 0.32);
            z-index: 10;
        }

        .stamp-card:active {
            transform: translateY(-2px) scale(1.01) !important;
            box-shadow: 2px 4px 8px rgba(45, 30, 15, 0.2);
        }

        .stamp-icon {
            font-size: 34px;
            line-height: 1;
            margin-top: 6px;
        }

        .stamp-title {
            font-family: 'Rubik Mono One', monospace, sans-serif;
            font-size: 11px;
            color: #111;
            text-align: center;
            letter-spacing: 0;
            line-height: 1.3;
        }

        .stamp-action {
            font-family: 'Rubik Mono One', monospace, sans-serif;
            font-size: 8px;
            color: #777;
            text-transform: uppercase;
        }

        /* Цвета акцентов марок */
        .stamp-tg .stamp-icon { color: #229ED9; }
        .stamp-wa .stamp-icon { color: #25D366; }
        .stamp-mail .stamp-icon { color: #EA4335; }
        .stamp-inst .stamp-icon { color: #E1306C; }

        /* Всплывашка копирования почты */
        .copy-toast {
            position: absolute;
            bottom: -28px;
            background: #111;
            color: #fff;
            font-family: 'Rubik Mono One', monospace, sans-serif;
            font-size: 8px;
            padding: 4px 8px;
            border-radius: 4px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            transform: translateY(-5px);
            white-space: nowrap;
        }
        .copy-toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Адаптив для телефонов */
        @media (max-width: 700px) {
            .letter-sheet {
                width: 94vw;
                height: 86vh;
                background-image: url('./paper-contacts-mobile.png');
                padding: 95px 18px 30px;
            }

            .stamps-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 14px;
            }

            .stamp-card {
                max-width: 140px;
                height: 155px;
            }

            .stamp-icon { font-size: 28px; }
            .stamp-title { font-size: 10px; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="index.html" class="back-desk-btn" id="toDeskBtn">← НА СТОЛ</a>
        <button class="lang-btn" id="langBtn" type="button">EN</button>
    </div>

    <main class="letter-sheet">
        <div class="stamps-grid">
            
            <!-- 1. TELEGRAM -->
            <a href="https://t.me/zagush" target="_blank" rel="noopener noreferrer" class="stamp-card stamp-tg">
                <div class="stamp-inner">
                    <span class="stamp-icon">✈</span>
                    <span class="stamp-title">TELEGRAM</span>
                    <span class="stamp-action stamp-btn-text">ОТКРЫТЬ</span>
                </div>
            </a>

            <!-- 2. WHATSAPP (ПРЯМАЯ ССЫЛКА НА ЧАТ) -->
            <a href="https://wa.me/79819598971" target="_blank" rel="noopener noreferrer" class="stamp-card stamp-wa">
                <div class="stamp-inner">
                    <span class="stamp-icon">💬</span>
                    <span class="stamp-title">WHATSAPP</span>
                    <span class="stamp-action stamp-btn-text">НАПИСАТЬ</span>
                </div>
            </a>

            <!-- 3. EMAIL (КЛИК = КОПИРОВАНИЕ АДРЕСА) -->
            <div class="stamp-card stamp-mail" id="mailStamp" title="Кликните, чтобы скопировать почту">
                <div class="stamp-inner">
                    <span class="stamp-icon">✉</span>
                    <span class="stamp-title">EMAIL</span>
                    <span class="stamp-action" id="mailActionText">СКОПИРОВАТЬ</span>
                </div>
                <div class="copy-toast" id="copyToast">СКОПИРОВАНО!</div>
            </div>

            <!-- 4. INSTAGRAM -->
            <a href="https://www.instagram.com/zagush_a?obrf=cjM2YXRuNjZ3bTBn" target="_blank" rel="noopener noreferrer" class="stamp-card stamp-inst">
                <div class="stamp-inner">
                    <span class="stamp-icon">📷</span>
                    <span class="stamp-title">INSTAGRAM</span>
                    <span class="stamp-action stamp-btn-text">ОТКРЫТЬ</span>
                </div>
            </a>

        </div>
    </main>

    <script>
        const EMAIL_ADDRESS = "nik.zagush@gmail.com";

        let currentLang = localStorage.getItem("user_lang") || "ru";
        const langBtn = document.getElementById("langBtn");
        const toDeskBtn = document.getElementById("toDeskBtn");
        const mailStamp = document.getElementById("mailStamp");
        const mailActionText = document.getElementById("mailActionText");
        const copyToast = document.getElementById("copyToast");

        function updateLangUI() {
            document.documentElement.lang = currentLang;
            langBtn.textContent = currentLang === "ru" ? "EN" : "RU";
            toDeskBtn.textContent = currentLang === "ru" ? "← НА СТОЛ" : "← TO DESK";

            document.querySelectorAll(".stamp-btn-text").forEach(el => {
                el.textContent = currentLang === "ru" ? "ОТКРЫТЬ" : "OPEN";
            });

            mailActionText.textContent = currentLang === "ru" ? "СКОПИРОВАТЬ" : "COPY";
            copyToast.textContent = currentLang === "ru" ? "СКОПИРОВАНО!" : "COPIED!";
        }

        langBtn.addEventListener("click", () => {
            currentLang = currentLang === "ru" ? "en" : "ru";
            try { localStorage.setItem("user_lang", currentLang); } catch (e) {}
            updateLangUI();
        });

        // Копирование почты по клику
        mailStamp.addEventListener("click", () => {
            navigator.clipboard.writeText(EMAIL_ADDRESS).then(() => {
                copyToast.classList.add("show");
                mailActionText.textContent = currentLang === "ru" ? "ГОТОВО!" : "DONE!";
                setTimeout(() => {
                    copyToast.classList.remove("show");
                    mailActionText.textContent = currentLang === "ru" ? "СКОПИРОВАТЬ" : "COPY";
                }, 2000);
            }).catch(() => {
                window.location.href = "mailto:" + EMAIL_ADDRESS;
            });
        });

        updateLangUI();
    </script>
</body>
</html>
