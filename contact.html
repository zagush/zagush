<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>ZAGUSH — CONTACTS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-text-stroke: 0 !important;
        }

        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        body {
            background-color: #2b2118;
            background-image: url('./stol.jpg');
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;
            background-repeat: no-repeat;
            font-family: Arial, Helvetica, sans-serif;
            color: #1a1a1a;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Верхняя панель */
        .top-bar {
            position: fixed;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            pointer-events: none;
        }

        .back-desk-btn, .lang-btn {
            background: #ffffff;
            color: #000;
            font-family: 'Rubik Mono One', monospace, sans-serif;
            font-size: 11px;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 3px 5px 12px rgba(0, 0, 0, 0.35);
            transition: transform 0.15s ease, background 0.15s ease;
            user-select: none;
            pointer-events: auto;
        }

        .back-desk-btn:hover, .lang-btn:hover {
            transform: translateY(-2px);
            background: #f0f0f0;
        }

        /* Лист письма */
        .letter-sheet {
            width: min(940px, 92vw);
            height: min(660px, 86vh);
            background-color: transparent;
            background-image: url('./paper-contacts-pc.png');
            background-position: center center;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.55));
            position: relative;
            display: flex;
            flex-direction: column;
            /* Отступ сверху, чтобы не закрывать надписи From / to */
            padding: clamp(80px, 13vh, 110px) clamp(30px, 5vw, 60px) clamp(30px, 4vw, 50px);
            image-rendering: pixelated;
        }

        /* Сетка под марки */
        .stamps-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            align-content: center;
            justify-items: center;
            padding: 10px;
        }

        /* Блок марки с плашкой */
        .stamp-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.3, 1);
            position: relative;
        }

        /* Естественные легкие наклоны */
        .stamp-unit:nth-child(1) { transform: rotate(-2deg); }
        .stamp-unit:nth-child(2) { transform: rotate(1.5deg); }
        .stamp-unit:nth-child(3) { transform: rotate(-1.2deg); }
        .stamp-unit:nth-child(4) { transform: rotate(2deg); }

        /* Приподнимание при наведении */
        .stamp-unit:hover {
            transform: translateY(-6px) scale(1.05) rotate(0deg) !important;
            z-index: 10;
        }

        .stamp-unit:active {
            transform: translateY(-2px) scale(1.01) !important;
        }

        /* Сама картинка марки */
        .stamp-img {
            width: clamp(100px, 12vw, 135px);
            height: auto;
            display: block;
            image-rendering: pixelated;
            /* Мягкая тень от марки на бумаге */
            filter: drop-shadow(2px 5px 6px rgba(45, 30, 15, 0.25));
            transition: filter 0.2s ease;
        }

        .stamp-unit:hover .stamp-img {
            filter: drop-shadow(3px 10px 12px rgba(45, 30, 15, 0.35));
        }

        /* Нейтральная белая плашка без обводки */
        .stamp-label {
            margin-top: 12px;
            background: #ffffff;
            border: none;
            border-radius: 4px;
            padding: 6px 14px;
            font-family: 'Rubik Mono One', monospace, sans-serif;
            font-size: 10px;
            color: #111111;
            letter-spacing: 0;
            text-align: center;
            white-space: nowrap;
            /* Аккуратная легкая тень плашки */
            box-shadow: 
                0 2px 4px rgba(45, 30, 15, 0.12),
                0 4px 10px rgba(45, 30, 15, 0.18);
            transition: background 0.15s ease, transform 0.15s ease;
        }

        .stamp-unit:hover .stamp-label {
            background: #fdfdfd;
        }

        /* Мобильная версия */
        @media (max-width: 700px) {
            .letter-sheet {
                width: 94vw;
                height: 86vh;
                background-image: url('./paper-contacts-mobile.png');
                padding: 95px 16px 30px;
            }

            .stamps-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px 14px;
            }

            .stamp-img {
                width: clamp(100px, 34vw, 125px);
            }

            .stamp-label {
                margin-top: 8px;
                font-size: 9px;
                padding: 5px 10px;
            }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="index.html" class="back-desk-btn" id="toDeskBtn">← НА СТОЛ</a>
        <button class="lang-btn" id="langBtn" type="button">EN</button>
    </div>

    <main class="letter-sheet">
        <div class="stamps-grid">
            
            <!-- 1. ПОЧТА (mark_04.png) -->
            <div class="stamp-unit" id="emailUnit" title="Кликните, чтобы скопировать почту">
                <img src="./mark_04.png" alt="Email" class="stamp-img">
                <div class="stamp-label" id="emailLabel">EMAIL</div>
            </div>

            <!-- 2. INSTAGRAM (mark_05.png) -->
            <a href="https://www.instagram.com/zagush_a?obrf=cjM2YXRuNjZ3bTBn" target="_blank" rel="noopener noreferrer" class="stamp-unit">
                <img src="./mark_05.png" alt="Instagram" class="stamp-img">
                <div class="stamp-label">INSTAGRAM</div>
            </a>

            <!-- 3. WHATSAPP (mark_06.png) -->
            <a href="https://wa.me/79819598971" target="_blank" rel="noopener noreferrer" class="stamp-unit">
                <img src="./mark_06.png" alt="WhatsApp" class="stamp-img">
                <div class="stamp-label">WHATSAPP</div>
            </a>

            <!-- 4. TELEGRAM (mark_07.png) -->
            <a href="https://t.me/zagush" target="_blank" rel="noopener noreferrer" class="stamp-unit">
                <img src="./mark_07.png" alt="Telegram" class="stamp-img">
                <div class="stamp-label">TELEGRAM</div>
            </a>

        </div>
    </main>

    <script>
        const EMAIL_ADDRESS = "nik.zagush@gmail.com";

        let currentLang = localStorage.getItem("user_lang") || "ru";
        const langBtn = document.getElementById("langBtn");
        const toDeskBtn = document.getElementById("toDeskBtn");
        const emailUnit = document.getElementById("emailUnit");
        const emailLabel = document.getElementById("emailLabel");

        function updateLangUI() {
            document.documentElement.lang = currentLang;
            langBtn.textContent = currentLang === "ru" ? "EN" : "RU";
            toDeskBtn.textContent = currentLang === "ru" ? "← НА СТОЛ" : "← TO DESK";
        }

        langBtn.addEventListener("click", () => {
            currentLang = currentLang === "ru" ? "en" : "ru";
            try { localStorage.setItem("user_lang", currentLang); } catch (e) {}
            updateLangUI();
        });

        // Клик по марке почты копирует email
        emailUnit.addEventListener("click", () => {
            navigator.clipboard.writeText(EMAIL_ADDRESS).then(() => {
                const oldText = emailLabel.textContent;
                emailLabel.textContent = currentLang === "ru" ? "СКОПИРОВАНО!" : "COPIED!";
                emailLabel.style.background = "#e8f5e9";
                
                setTimeout(() => {
                    emailLabel.textContent = oldText;
                    emailLabel.style.background = "#ffffff";
                }, 2000);
            }).catch(() => {
                window.location.href = "mailto:" + EMAIL_ADDRESS;
            });
        });

        updateLangUI();
    </script>
</body>
</html>
