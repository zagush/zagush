<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>ZAGUSH — CONTACTS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-text-stroke: 0 !important;
        }

        html, body {
            height: 100vh;
            overflow: hidden;
        }

        body {
            background: #2b2118 url('stol.jpg') center center / cover fixed no-repeat;
            font-family: Arial, Helvetica, sans-serif;
            color: #1a1a1a;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Верхняя панель */
        .top-bar {
            position: fixed;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            pointer-events: none;
        }

        .back-desk-btn, .lang-btn {
            background: #ffffff;
            color: #000;
            font-family: 'Rubik Mono One', monospace, sans-serif;
            font-size: 11px;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 3px 5px 12px rgba(0, 0, 0, 0.35);
            transition: transform 0.15s ease, background 0.15s ease;
            user-select: none;
            pointer-events: auto;
        }

        .back-desk-btn:hover, .lang-btn:hover {
            transform: translateY(-2px);
            background: #f0f0f0;
        }

        /* Лист письма */
        .letter-sheet {
            width: min(940px, 92vw);
            height: min(660px, 86vh);
            background: transparent url('paper-contacts-pc.png') center center / 100% 100% no-repeat;
            filter: drop-shadow(0 14px 30px rgba(0, 0, 0, 0.55));
            position: relative;
            display: flex;
            flex-direction: column;
            /* Отступ сверху, чтобы не перекрывать нарисованные From / to */
            padding: clamp(75px, 12vh, 100px) clamp(30px, 4vw, 60px) clamp(30px, 4vw, 50px);
            image-rendering: pixelated;
        }

        /* Сетка под марки */
        .stamps-container {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 20px;
            align-content: center;
            justify-items: center;
            overflow-y: auto;
            padding: 10px;
        }

        /* Заглушки для будущих марок */
        .stamp-item {
            width: 120px;
            height: 140px;
            background: #e8e2d5;
            border: 2px dashed #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Rubik Mono One', monospace, sans-serif;
            font-size: 10px;
            color: #333;
            text-decoration: none;
            box-shadow: 4px 4px 0 #000;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            cursor: pointer;
            user-select: none;
        }

        .stamp-item:hover {
            transform: translateY(-4px) rotate(-1deg);
            box-shadow: 6px 8px 0 #000;
        }

        /* Мобильная версия */
        @media (max-width: 650px) {
            .letter-sheet {
                width: 92vw;
                height: 85vh;
                background-image: url('paper-contacts-mobile.png');
                padding: 85px 20px 30px;
            }

            .stamps-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .stamp-item {
                width: 100%;
                max-width: 130px;
                height: 120px;
            }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="index.html" class="back-desk-btn" id="toDeskBtn">← НА СТОЛ</a>
        <button class="lang-btn" id="langBtn" type="button">EN</button>
    </div>

    <main class="letter-sheet">
        <div class="stamps-container" id="stampsContainer">
            <div class="stamp-item">МАРКА 1<br>(TELEGRAM)</div>
            <div class="stamp-item">МАРКА 2<br>(WHATSAPP)</div>
            <div class="stamp-item">МАРКА 3<br>(PHONE)</div>
            <div class="stamp-item">МАРКА 4<br>(EMAIL)</div>
            <div class="stamp-item">МАРКА 5<br>(VK)</div>
            <div class="stamp-item">МАРКА 6<br>(INSTA)</div>
        </div>
    </main>

    <script>
        let currentLang = localStorage.getItem("user_lang") || "ru";
        const langBtn = document.getElementById("langBtn");
        const toDeskBtn = document.getElementById("toDeskBtn");

        function updateLangUI() {
            document.documentElement.lang = currentLang;
            langBtn.textContent = currentLang === "ru" ? "EN" : "RU";
            toDeskBtn.textContent = currentLang === "ru" ? "← НА СТОЛ" : "← TO DESK";
        }

        langBtn.addEventListener("click", () => {
            currentLang = currentLang === "ru" ? "en" : "ru";
            try { localStorage.setItem("user_lang", currentLang); } catch (e) {}
            updateLangUI();
        });

        updateLangUI();
    </script>
</body>
</html>
