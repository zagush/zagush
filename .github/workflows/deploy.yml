# Деплой статического сайта zagush/zagush на GitHub Pages
# Источник файлов — корень репозитория, ветка main (сборка не нужна).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Не запускать параллельные деплои: новый запуск ждёт завершения предыдущего
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1  # неглубокий клон — репозиторий большой, история не нужна

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload static files as artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .  # сайт лежит в корне репозитория

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
