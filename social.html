<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAGUSH — SOCIALS</title>
    <!-- Шрифты проекта -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=VT323&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100vw;
            min-height: 100vh;
            background: #2b1d14 url('stol.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Rubik Mono One', monospace;
            overflow-x: hidden;
            padding: 20px 10px;
        }

        /* Кнопка "Назад на стол" */
        .btn-back {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            display: inline-block;
            transition: transform 0.15s ease, filter 0.15s ease;
            image-rendering: pixelated !important;
            filter: drop-shadow(3px 4px 0px rgba(0,0,0,0.7));
        }

        .btn-back img {
            display: block;
            width: 48px;
            height: auto;
            image-rendering: pixelated !important;
        }

        .btn-back:hover {
            transform: scale(1.08) translate(-2px, -2px);
        }

        .btn-back:active {
            transform: scale(0.96) translate(2px, 2px);
        }

        /* Контейнер телефона */
        .phone-container {
            position: relative;
            width: 320px;
            height: 640px;
            max-height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: phoneAppear 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.25);
        }

        @keyframes phoneAppear {
            0% { transform: translateY(40px) scale(0.92); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        /* Фоновая картинка корпуса телефона + МЯГКАЯ ТЕНЬ СТОЛА */
        .phone-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            image-rendering: pixelated !important;
            pointer-events: none;
            z-index: 1;

            /* Мягкая реалистичная тень от объекта на деревянном столе */
            filter: drop-shadow(0 10px 15px rgba(25, 14, 7, 0.4))
                    drop-shadow(0 25px 35px rgba(20, 10, 5, 0.45))
                    drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.3));
        }

        /* Интерактивный экран поверх арта */
        .phone-screen {
            position: absolute;
            inset: 12px 14px 14px 14px;
            z-index: 2;
            display: flex;
            flex-direction: column;
            border-radius: 12px;
            overflow: hidden;
        }

        /* Верхняя статус-строка */
        .phone-status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 10px;
            font-size: 11px;
            background: rgba(0, 0, 0, 0.75);
            color: #ffffff;
            border-bottom: 2px solid #000;
            user-select: none;
        }

        /* Заголовок страницы */
        .phone-header {
            text-align: center;
            padding: 8px 6px;
            background: #ffffff;
            border: 2px solid #000000;
            margin: 8px 8px 4px 8px;
            box-shadow: 3px 3px 0 #000000;
        }

        .phone-title {
            font-size: 12px;
            color: #000000;
            letter-spacing: 0.5px;
        }

        /* Скролл-контейнер со ссылками */
        .social-links {
            flex: 1;
            overflow-y: auto;
            padding: 6px 8px 12px 8px;
            display: flex;
            flex-direction: column;
            gap: 7px;
            scrollbar-width: thin;
            scrollbar-color: #000000 rgba(255, 255, 255, 0.5);
        }

        .social-links::-webkit-scrollbar {
            width: 6px;
        }
        .social-links::-webkit-scrollbar-thumb {
            background: #000;
            border: 1px solid #fff;
        }
        .social-links::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Карточка социальной сети */
        .social-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.92);
            border: 2px solid #000000;
            padding: 6px 8px;
            text-decoration: none;
            color: #000000;
            font-size: 10px;
            box-shadow: 3px 3px 0 #000000;
            transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.1s ease;
            backdrop-filter: blur(2px);
        }

        .social-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0 #000000;
            background: #fff;
        }

        .social-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 #000000;
        }

        /* Иконка / Бейдж слева */
        .social-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
            color: #ffffff;
            font-size: 12px;
            border: 1px solid #000000;
            flex-shrink: 0;
        }

        /* Индивидуальные акценты при ховере */
        .btn-tg:hover .social-icon { background: #29b6f6; color: #fff; }
        .btn-ig:hover .social-icon { background: #ff2a7a; color: #fff; }
        .btn-pin:hover .social-icon { background: #e60023; color: #fff; }
        .btn-yt:hover .social-icon { background: #ff0000; color: #fff; }
        .btn-ill:hover .social-icon { background: #ff9900; color: #000; }
        .btn-x:hover .social-icon { background: #000000; color: #fff; }
        .btn-vk:hover .social-icon { background: #0077ff; color: #fff; }
        .btn-be:hover .social-icon { background: #0057ff; color: #fff; }

        .social-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Нижний индикатор Home */
        .phone-home-indicator {
            width: 70px;
            height: 4px;
            background: #000;
            border-radius: 2px;
            margin: 6px auto 4px auto;
            opacity: 0.8;
            flex-shrink: 0;
        }

        /* Адаптив под маленькие экраны */
        @media (max-height: 700px) {
            .phone-container {
                height: 94vh;
                width: 290px;
            }
            .social-btn {
                padding: 4px 6px;
                font-size: 9px;
            }
            .social-icon {
                width: 20px;
                height: 20px;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- КНОПКА ВОЗВРАТА НА СТОЛ -->
    <a href="index.html" class="btn-back" id="backBtn" title="Назад на стол / Back">
        <img src="btn_back.png" alt="Назад">
    </a>

    <!-- КОРПУС ТЕЛЕФОНА -->
    <div class="phone-container">
        <!-- Ассет с рисунком и рамкой -->
        <img src="phonesoc.png" alt="Phone" class="phone-bg" draggable="false">

        <!-- Внутренний интерфейс -->
        <div class="phone-screen">
            <!-- Верхняя строка статуса -->
            <div class="phone-status-bar">
                <span id="phoneClock">13:37</span>
                <span>100%</span>
            </div>

            <!-- Плашка заголовка -->
            <div class="phone-header">
                <h1 class="phone-title" data-ru="МОИ СОЦСЕТИ" data-en="MY SOCIALS">МОИ СОЦСЕТИ</h1>
            </div>

            <!-- Список ссылок -->
            <div class="social-links">

                <!-- Telegram Основной -->
                <a href="https://t.me/zagush_a" target="_blank" rel="noopener noreferrer" class="social-btn btn-tg">
                    <span class="social-icon">✈</span>
                    <span class="social-name">Telegram</span>
                </a>

                <!-- Telegram Жизнь -->
                <a href="https://t.me/zagus_h_bbeb" target="_blank" rel="noopener noreferrer" class="social-btn btn-tg">
                    <span class="social-icon">✈</span>
                    <span class="social-name" data-ru="TG — Жизнь" data-en="TG — Life">TG — Жизнь</span>
                </a>

                <!-- Instagram -->
                <a href="https://www.instagram.com/zagush_a?mdxt=cjM2YXRuNjZ3bTBn" target="_blank" rel="noopener noreferrer" class="social-btn btn-ig">
                    <span class="social-icon">📸</span>
                    <span class="social-name">Instagram</span>
                </a>

                <!-- Pinterest -->
                <a href="https://ru.pinterest.com/zagush/" target="_blank" rel="noopener noreferrer" class="social-btn btn-pin">
                    <span class="social-icon">P</span>
                    <span class="social-name">Pinterest</span>
                </a>

                <!-- YouTube -->
                <a href="https://www.youtube.com/@zagush" target="_blank" rel="noopener noreferrer" class="social-btn btn-yt">
                    <span class="social-icon">▶</span>
                    <span class="social-name">YouTube</span>
                </a>

                <!-- Illustrators -->
                <a href="https://illustrators.ru/users/zagush" target="_blank" rel="noopener noreferrer" class="social-btn btn-ill">
                    <span class="social-icon">✎</span>
                    <span class="social-name">Illustrators</span>
                </a>

                <!-- X (Twitter) -->
                <a href="https://x.com/zagush_" target="_blank" rel="noopener noreferrer" class="social-btn btn-x">
                    <span class="social-icon">𝕏</span>
                    <span class="social-name">X (Twitter)</span>
                </a>

                <!-- VKontakte -->
                <a href="https://vk.ru/zagush_a" target="_blank" rel="noopener noreferrer" class="social-btn btn-vk">
                    <span class="social-icon">В</span>
                    <span class="social-name">VKontakte</span>
                </a>

                <!-- Behance -->
                <a href="https://www.behance.net/zagush" target="_blank" rel="noopener noreferrer" class="social-btn btn-be">
                    <span class="social-icon">Bē</span>
                    <span class="social-name">Behance</span>
                </a>

            </div>

            <div class="phone-home-indicator"></div>
        </div>
    </div>

    <!-- СКРИПТ: ЗВУКИ И ПЕРЕВОД -->
    <script>
        // Web Audio клик в стиле Zagush
        const AudioFX = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if (AC) this.ctx = new AC();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },
            playClick() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.05);
            }
        };

        // Живые часы на телефоне
        function updateClock() {
            const el = document.getElementById('phoneClock');
            if (!el) return;
            const d = new Date();
            el.textContent = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        }
        updateClock();
        setInterval(updateClock, 30000);

        // Звуки на ссылках
        document.querySelectorAll('.social-btn, .btn-back').forEach(btn => {
            btn.addEventListener('mouseenter', () => AudioFX.playClick());
            btn.addEventListener('click', () => AudioFX.playClick());
        });

        // Язык из localStorage
        const lang = localStorage.getItem("user_lang") || "ru";
        document.querySelectorAll('[data-' + lang + ']').forEach(el => {
            el.textContent = el.getAttribute('data-' + lang);
        });
    </script>
</body>
</html>
