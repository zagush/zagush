<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAGUSH</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="home">
        <div class="background"></div>

        <button id="languageSwitch" class="language-switch" type="button">EN</button>

        <header class="site-header">
            <a href="index.html" class="logo" id="logo">ЗАГУШ</a>
        </header>

        <section class="about">
            <h1 id="aboutTitle">ОБО МНЕ</h1>
            <p class="intro-text" id="introText">
                Я создаю цифровое искусство, граффити, традиционные работы и многое другое.<br>
                Больше моих работ можно посмотреть в социальных сетях.
            </p>
        </section>

        <section class="desk">
          <!-- 1. Скетчбук (Портфолио) -->
            <a href="portfolio.html" class="object sketchbook-object">
                <img src="sketchbook.png" alt="Портфолио" class="item-img">
                <span class="item-title" id="portfolioText">ПОРТФОЛИО</span>
            </a>

            <!-- 2. Телефон (Соцсети) -->
            <div class="object phone-object" id="phoneTrigger" role="button" tabindex="0">
                <img src="./phone.png" alt="Phone" class="item-img">
                <span class="phone-label" id="socialsLabel">СОЦСЕТИ</span>
            </div>

            <!-- 3. Листик с ручкой (Рисовать) -->
            <a href="draw.html" class="object draw-object">
                <img src="paper.png" alt="Рисовать" class="item-img">
                <span class="item-title" id="drawText">РИСОВАТЬ</span>
            </a>

            <!-- 4. Конверт (Контакты) -->
            <a href="contact.html" class="object contact-object">
                <img src="envelope.png" alt="Контакты" class="item-img">
                <span class="item-title" id="contactText">КОНТАКТЫ</span>
            </a>
        </section>

        <!-- Модалка соцсетей -->
        <div class="phone-modal" id="phoneModal">
            <div class="modal-backdrop" id="modalBackdrop"></div>
            <div class="phone-device">
                <button class="modal-close" id="modalClose" type="button">&times;</button>
                <div class="phone-notch"></div>
                <div class="phone-inner">
                    <div class="phone-status-bar">
                        <span>13:37</span>
                        <span>100%</span>
                    </div>
                    <div class="phone-content">
                        <h2 class="phone-title" id="modalTitle">МОИ СОЦСЕТИ</h2>
                        <div class="social-links">
                            <a href="#" target="_blank" rel="noopener noreferrer" class="social-btn">
                                <span class="social-icon">✈</span>
                                <span>Telegram</span>
                            </a>
                            <a href="#" target="_blank" rel="noopener noreferrer" class="social-btn">
                                <span class="social-icon">В</span>
                                <span>VKontakte</span>
                            </a>
                            <a href="#" target="_blank" rel="noopener noreferrer" class="social-btn">
                                <span class="social-icon">📸</span>
                                <span>Instagram</span>
                            </a>
                            <a href="#" target="_blank" rel="noopener noreferrer" class="social-btn">
                                <span class="social-icon">▶</span>
                                <span>YouTube</span>
                            </a>
                        </div>
                    </div>
                    <div class="phone-home-indicator"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
