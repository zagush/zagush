<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZAGUSH</title>

    <meta
        name="description"
        content="ZAGUSH — художник и цифровой автор."
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="home">

        <div class="background"></div>


        <!-- Header -->
        <header class="site-header">

            <a href="index.html" class="logo">
                ZAGUSH
            </a>

            <!-- Language switch -->
            <button
                class="language-switch"
                id="languageSwitch"
                type="button"
                aria-label="Сменить язык"
            >
                EN
            </button>

        </header>


        <!-- About -->
        <section class="about">

            <h1 data-i18n="about-title">
                ОБО МНЕ
            </h1>

            <p data-i18n="about-text">
                Создаю иллюстрации, игры, пиксель-арт
                и цифровые работы.
            </p>

        </section>


        <!-- Interactive objects -->
        <section class="desk">

            <!-- Portfolio -->
            <a href="portfolio.html" class="object portfolio-object">

                <div class="placeholder portfolio-placeholder">
                    <span data-i18n="portfolio">
                        ПОРТФОЛИО
                    </span>
                </div>

            </a>


            <!-- Socials -->
            <a href="socials.html" class="object socials-object">

                <div class="placeholder socials-placeholder">
                    <span data-i18n="socials">
                        СОЦСЕТИ
                    </span>
                </div>

            </a>


            <!-- Drawing -->
            <a href="draw.html" class="object draw-object">

                <div class="placeholder draw-placeholder">
                    <span data-i18n="draw">
                        РИСОВАТЬ
                    </span>
                </div>

            </a>


            <!-- Contact -->
            <a href="contact.html" class="object contact-object">

                <div class="placeholder contact-placeholder">
                    <span data-i18n="contact">
                        КОНТАКТЫ
                    </span>
                </div>

            </a>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
