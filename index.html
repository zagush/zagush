<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAGUSH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&display=swap" rel="stylesheet">
    <!-- Добавлен ?v=2 против кэширования браузером -->
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <main class="home">
        <div class="background"></div>

        <button id="languageSwitch" class="language-switch" type="button">EN</button>

        <header class="site-header">
            <a href="index.html" class="logo" id="logo">ЗАГУШ</a>
        </header>

        <section class="about">
            <p class="intro-text" id="introText">
                Я создаю цифровое искусство, граффити, традиционные работы и многое другое.<br>
                Больше моих работ можно посмотреть в социальных сетях.
            </p>
        </section>

        <section class="desk">
            <!-- 1. ТЕЛЕФОН (СОЦСЕТИ) — Сверху слева -->
            <a href="social.html" class="object phone-object">
                <img src="phone.png" alt="Соцсети" class="item-img">
                <span class="item-label sticker-title" id="socialText">СОЦСЕТИ</span>
            </a>

            <!-- 2. СКЕТЧБУК (ПОРТФОЛИО) — Сверху справа -->
            <a href="portfolio.html" class="object sketchbook-object">
                <img src="sketchbook1.png" alt="Портфолио" class="item-img">
                <span class="item-label sticker-title" id="portfolioText">ПОРТФОЛИО</span>
            </a>

            <!-- 3. КОНТАКТЫ (КОНВЕРТ) — Снизу слева -->
            <a href="contact.html" class="object contact-object">
                <img src="contact.png" alt="Контакты" class="item-img">
                <span class="item-label sticker-title" id="contactText">КОНТАКТЫ</span>
            </a>

            <!-- 4. РИСОВАТЬ (ЛИСТОК) — Снизу справа -->
            <a href="draw.html" class="object draw-object">
                <img src="draw.png" alt="Рисовать" class="item-img">
                <span class="item-label sticker-title" id="drawText">РИСОВАТЬ</span>
            </a>
        </section>

        <!-- Пасхалка внизу экрана -->
        <a href="dubstep.html" class="secret-face" title="??? dubstep ???">
            <img src="face.png" alt="face">
        </a>

        <!-- Интерактивные сквиши для жмяканья -->
        <div class="skvish skvish1" id="skvish1" title="Пожмякай меня!">
            <div class="skvish-bubble" id="bubble1">ЖМЯК!</div>
            <img src="face4.png" alt="skvish1" onerror="this.src='face.png'">
        </div>

        <div class="skvish skvish2" id="skvish2" title="Тыкни сюда!">
            <div class="skvish-bubble" id="bubble2">ЧПОК!</div>
            <img src="face3.png" alt="skvish2" onerror="this.src='face.png'">
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
