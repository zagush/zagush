<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAGUSH</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="home">
        <div class="background"></div>

        <button id="languageSwitch" class="language-switch" type="button" aria-label="Сменить язык">EN</button>

        <header class="site-header">
            <a href="index.html" class="logo" id="logo">ЗАГУШ</a>
        </header>

        <section class="about">
            <h1 id="aboutTitle">ОБО МНЕ</h1>
            <p class="intro-text" id="introText">
                Я создаю цифровое искусство, граффити, традиционные работы и многое другое.<br>
                Больше моих работ можно посмотреть в социальных сетях.
            </p>
        </section>

        <section class="desk">
            <a href="portfolio.html" class="object portfolio-object">
                <div class="placeholder portfolio-placeholder">
                    <span id="portfolioText">ПОРТФОЛИО</span>
                </div>
            </a>

            <!-- Интерактивный телефон -->
            <div class="object socials-object" id="phoneTrigger" role="button" tabindex="0" aria-label="Открыть соцсети">
                <div class="phone-wrapper">
                    <img src="phone.png" alt="Телефон" class="phone-img">
                    <div class="phone-screen-glare"></div>
                    <span class="object-label" id="socialsLabel">СОЦСЕТИ</span>
                </div>
            </div>

            <a href="draw.html" class="object draw-object">
                <div class="placeholder draw-placeholder">
                    <span id="drawText">РИСОВАТЬ</span>
                </div>
            </a>

            <a href="contact.html" class="object contact-object">
                <div class="placeholder contact-placeholder">
                    <span id="contactText">КОНТАКТЫ</span>
                </div>
            </a>
        </section>

        <!-- Модалка смартфона с соцсетями -->
        <div class="phone-modal" id="phoneModal" aria-hidden="true">
            <div class="modal-backdrop" id="modalBackdrop"></div>
            <div class="phone-device">
                <button class="modal-close" id="modalClose" aria-label="Закрыть">&times;</button>
                <div class="phone-notch"></div>
                <div class="phone-inner">
                    <div class="phone-status-bar">
                        <span>13:37</span>
                        <span>100%</span>
                    </div>
                    <div class="phone-content">
                        <h2 class="phone-title" id="modalTitle">МОИ СОЦСЕТИ</h2>
                        <div class="social-links">
                            <a href="https://t.me/твой_ник" target="_blank" rel="noopener noreferrer" class="social-btn tg">
                                <span class="social-icon">✈</span>
                                <span class="social-name">Telegram</span>
                            </a>
                            <a href="https://vk.com/твой_ник" target="_blank" rel="noopener noreferrer" class="social-btn vk">
                                <span class="social-icon">В</span>
                                <span class="social-name">VKontakte</span>
                            </a>
                            <a href="https://instagram.com/твой_ник" target="_blank" rel="noopener noreferrer" class="social-btn inst">
                                <span class="social-icon">📸</span>
                                <span class="social-name">Instagram</span>
                            </a>
                            <a href="https://youtube.com/@твой_ник" target="_blank" rel="noopener noreferrer" class="social-btn yt">
                                <span class="social-icon">▶</span>
                                <span class="social-name">YouTube</span>
                            </a>
                        </div>
                    </div>
                    <div class="phone-home-indicator"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
