<!DOCTYPE html>

<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>ZAGUSH</title>

<meta
    name="description"
    content="ЗАГУШ — художник и цифровой автор."
>

<link rel="stylesheet" href="style.css">
```

</head>

<body>

```
<main class="home">

    <div class="background"></div>


    <!-- Language button -->

    <button
        id="languageSwitch"
        class="language-switch"
        type="button"
    >
        EN
    </button>


    <!-- Header -->

    <header class="site-header">

        <a
            href="index.html"
            class="logo"
            id="logo"
        >
            ЗАГУШ
        </a>

    </header>


    <!-- Intro -->

    <section class="intro">

        <p
            class="intro-text"
            id="introText"
        >
            Я создаю цифровое искусство, граффити,
            традиционные работы и многое другое.
            <br>
            Больше моих работ можно посмотреть
            в социальных сетях.
        </p>

    </section>


    <!-- Interactive objects -->

    <section class="desk">


        <a
            href="portfolio.html"
            class="object portfolio-object"
        >

            <div class="placeholder portfolio-placeholder">

                <span id="portfolioText">
                    ПОРТФОЛИО
                </span>

            </div>

        </a>


        <a
            href="socials.html"
            class="object socials-object"
        >

            <div class="placeholder socials-placeholder">

                <span id="socialsText">
                    СОЦСЕТИ
                </span>

            </div>

        </a>


        <a
            href="draw.html"
            class="object draw-object"
        >

            <div class="placeholder draw-placeholder">

                <span id="drawText">
                    РИСОВАТЬ
                </span>

            </div>

        </a>


        <a
            href="contact.html"
            class="object contact-object"
        >

            <div class="placeholder contact-placeholder">

                <span id="contactText">
                    КОНТАКТЫ
                </span>

            </div>

        </a>


    </section>

</main>


<script src="script.js"></script>

</body>

</html>
